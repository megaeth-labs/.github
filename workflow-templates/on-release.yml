name: On Release

# Publish targets for a release. Runs when the release pipeline publishes the
# GitHub Release (release-publish creates it after the tag), and on demand
# for a rehearsal on a tag ref, which runs every job with nothing uploaded,
# published or attached:
#   gh workflow run on-release.yml --ref vX.Y.Z -f dry_run=true
# The tag being released is always the run's own ref; there is no tag input.
# The `publish` environment authorises that ref, so it must also be what
# gets built and published.
#
# This file must exist on the tagged commit: a `release` event resolves the
# workflow from the tag's tree, not from the default branch. A release branch
# cut from a default branch that has it carries it; a branch cut before it
# landed needs it cherry-picked (through its own PR — the `release-*` ruleset
# requires one) before the settle PR merges, or the Release publishes with
# nothing attached and no failed run. release-settle warns when the settled
# commit lacks a workflow the default branch has. A rehearsal likewise needs
# a tag whose tree has this file.
#
# Credentials live in the `publish` environment: create it with a deployment
# policy of "selected tags: v*" and put CARGO_REGISTRY_TOKEN / GCP_AUTH_KEY
# in it as environment secrets. A job can then use them only when the run's
# ref is a v* tag — a release event or a tag-ref rehearsal — never from a
# branch build. Required reviewers are optional: settlement is already a
# reviewed PR.
#
# Each target is its own job so a hiccup in one never blocks another. Delete
# the jobs this repository does not need; keep the shared actions at @main.
# Every destination below is a placeholder — there are no defaults.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify and build everything; publish, upload and attach nothing"
        required: false
        type: boolean
        default: true

# One run per tag: a release run and a dispatch on the same tag both end in
# uploads (`--clobber` on Release assets), so overlapping runs would race.
# Never cancel an upload mid-flight; queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The run's ref — the released tag on a release event, the dispatched tag
  # on a rehearsal. Never an input: the publish environment authorises this
  # ref, so it must also be what gets built and published.
  TAG: ${{ github.ref_name }}
  # A release event is never a dry run; a dispatch defaults to one.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

jobs:
  # ---- language package index: crates.io ------------------------------------
  crates:
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - name: Require a tag ref
        run: |
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || { echo "::error::this workflow publishes the run's own ref, which must be a tag (got $GITHUB_REF_TYPE $GITHUB_REF_NAME); dispatch it with --ref vX.Y.Z"; exit 1; }

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false

      - uses: megaeth-labs/.github/.github/actions/release-publish-rust-crates@main
        with:
          # Explicit allowlist, dependency order is worked out by Cargo.
          crates: |
            my-crate-core
            my-crate
          version: ${{ env.TAG }}
          # A rehearsal never needs the token; do not hand it to the job at all.
          token: ${{ env.DRY_RUN != 'true' && secrets.CARGO_REGISTRY_TOKEN || '' }}
          dry_run: ${{ env.DRY_RUN }}

  # ---- binary: build → verify → MegaETH registry → Release asset -------------
  binary:
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: write # release-assets
    steps:
      - name: Require a tag ref
        run: |
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || { echo "::error::this workflow publishes the run's own ref, which must be a tag (got $GITHUB_REF_TYPE $GITHUB_REF_NAME); dispatch it with --ref vX.Y.Z"; exit 1; }

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false

      - name: Build
        run: cargo build --release --locked -p my-binary

      # The built binary must report the tag's version (`my-binary X.Y.Z`):
      # catches a build from the wrong tree and a tag / manifest mismatch. A
      # binary that cannot run fails here even on a dry run.
      - uses: megaeth-labs/.github/.github/actions/release-verify-version@main
        with:
          command: target/release/my-binary --version
          version: ${{ env.TAG }}
          dry_run: ${{ env.DRY_RUN }}

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_AUTH_KEY }}

      - uses: megaeth-labs/.github/.github/actions/release-upload-artifact@main
        with:
          file: target/release/my-binary
          kind: artifact-registry
          project: my-gcp-project
          location: my-region
          repository: my-generic-repository
          package: my-binary
          version: ${{ env.TAG }}
          dry_run: ${{ env.DRY_RUN }}

      - uses: megaeth-labs/.github/.github/actions/release-assets@main
        with:
          tag: ${{ env.TAG }}
          files: |
            target/release/my-binary
          dry_run: ${{ env.DRY_RUN }}
