name: Release Settle

# Settle a release candidate by pull request. A push to a `release-v*` branch
# starts this workflow and `route` decides what the push means:
#   refresh  the candidate has landed on the release branch: generate release
#            notes from the commits since the previous tag and open or update
#            a reviewed `chore/release-settle-vX.Y.Z` PR onto the release
#            branch with the changelog entry;
#   publish  that settle PR was just merged: create the annotated tag at the
#            merge commit and the GitHub Release with the changelog section
#            as notes.
# Merging the settle PR is the release decision, so nothing waits for a click
# on the run. To refresh every eligible release branch by hand, dispatch this
# workflow (optionally with `version` to refresh just one); it never publishes.
#
# Every write is made by the release GitHub App (mega-gutenberg), whose token
# is minted only in jobs that run in the `release` environment. Create that
# environment with a deployment policy of the default branch and `release-v*`
# branches, and no required reviewers. The app is a bypass actor on the `v*`
# tag ruleset only; the `release-*` branch ruleset still requires the reviewed
# settle PR. `route` is read-only and uses the job token.
#
# This file must exist on the release branch (it does, when the branch is cut
# from a default branch that has it); a push to the branch runs the copy of
# the workflow on that branch.
#
# Guide: https://github.com/megaeth-labs/.github/blob/main/.github/actions/RELEASE.md

on:
  push:
    branches: ["release-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to refresh (X.Y.Z); blank: every eligible release branch"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # Read-only: classifies the push (or the dispatch) as refresh, publish or skip.
  route:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      action: ${{ steps.route.outputs.action }}
      targets: ${{ steps.route.outputs.targets }}
      release_branch: ${{ steps.route.outputs.release_branch }}
      commit: ${{ steps.route.outputs.commit }}
      pr_number: ${{ steps.route.outputs.pr_number }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: route
        uses: megaeth-labs/.github/.github/actions/release-route@main
        with:
          kind: settle
          version: ${{ inputs.version }}
          version_file: VERSION
          version_pattern: plain

  refresh:
    needs: route
    if: needs.route.outputs.action == 'refresh'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.route.outputs.targets) }}
    # One refresh per release branch, queued and never cancelled: two runs
    # would race on the settle PR branch.
    concurrency:
      group: release-settle-refresh-${{ matrix.target.release_branch }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: release-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: megaeth-labs
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: megaeth-labs/.github/.github/actions/release-settle@main
        with:
          token: ${{ steps.release-token.outputs.token }}
          version: ${{ matrix.target.version }}
          commit: ${{ matrix.target.commit }}
          release_branch: ${{ matrix.target.release_branch }}
          version_file: VERSION
          version_pattern: plain
          changelog_file: CHANGELOG.md

  publish:
    needs: route
    if: needs.route.outputs.action == 'publish'
    # One publish per release branch: the tag guard and the tag push are two
    # steps, so a re-run must queue behind a run in flight, never overlap it.
    concurrency:
      group: release-settle-publish-${{ needs.route.outputs.release_branch }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: release-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: megaeth-labs
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: read
          permission-workflows: write

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: megaeth-labs/.github/.github/actions/release-publish@main
        with:
          token: ${{ steps.release-token.outputs.token }}
          commit: ${{ needs.route.outputs.commit }}
          pr_number: ${{ needs.route.outputs.pr_number }}
          version_file: VERSION
          version_pattern: plain
          changelog_file: CHANGELOG.md
