name: Release Publish
description: >-
  Publish a settled release. Normally runs when a `chore/release-settle-vX.Y.Z`
  PR merges into its release branch (or, with `commit` + `version` given, on
  an explicit commit that `release-settle` in `direct` mode just made):
  creates the annotated tag `vX.Y.Z` at the
  merge commit (exactly once — refuses if it exists, or if the branch moved
  after the settle PR was opened) and publishes the GitHub Release with the
  changelog section as notes. This is the only place in the release flow that
  creates a tag; merging the settle PR is the approval. The default branch's
  changelog catches up in the next release candidate PR — nothing is
  back-merged. The consumer checks the repository out first
  (`fetch-depth: 0`, `persist-credentials: false`).

inputs:
  token:
    description: >-
      GitHub App installation token (e.g. the Maxwell app). The tag push must
      come from it so `push: tags` workflows (artifact builds) fire; the job's
      GITHUB_TOKEN would not trigger them. Also needs to be a bypass actor on
      the repository's tag ruleset.
    required: true
  version_file:
    required: true
  version_pattern:
    required: false
    default: plain
  changelog_file:
    required: false
    default: CHANGELOG.md
  release_branch_prefix:
    required: false
    default: release-v
  commit:
    description: >-
      Explicit commit to publish (full SHA), with `version`. Set by
      `release-settle` in `direct` mode; leave empty when triggered by the
      settle PR merging. The PR-specific guards (head/base names, author,
      drift marker) do not apply in this mode.
    required: false
    default: ""
  version:
    description: "Version for the explicit-commit mode, X.Y.Z or vX.Y.Z."
    required: false
    default: ""
  pr_author:
    description: >-
      Login the settle PR must have been opened by — the app identity
      `release-settle` runs under. Stops a hand-made `chore/release-settle-*`
      branch from reaching the tag step. Empty disables the check.
    required: false
    default: "mega-maxwell[bot]"
  git_user_name:
    required: false
    default: "mega-maxwell[bot]"
  git_user_email:
    required: false
    default: "290560214+mega-maxwell[bot]@users.noreply.github.com"

outputs:
  version:
    value: ${{ steps.guard.outputs.version }}
  tag:
    value: ${{ steps.tag.outputs.tag }}
  release_url:
    value: ${{ steps.release.outputs.url }}

runs:
  using: composite
  steps:
    - name: Configure git auth
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        NAME: ${{ inputs.git_user_name }}
        EMAIL: ${{ inputs.git_user_email }}
      run: |
        set -euo pipefail
        git config user.name "$NAME"
        git config user.email "$EMAIL"
        # Same mechanism actions/checkout uses, scoped to this clone and
        # removed in the last step. Drop any header a persisted checkout left
        # behind first: git sends every configured extraheader, and two
        # Authorization headers get a 400.
        git config --unset-all "http.https://github.com/.extraheader" || true
        auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
        # The token itself is masked by create-github-app-token; its base64
        # form is not, so mask it too before it can reach a log.
        echo "::add-mask::$auth"
        git config "http.https://github.com/.extraheader" "AUTHORIZATION: basic $auth"

    - name: Guard
      id: guard
      shell: bash
      env:
        MERGED: ${{ github.event.pull_request.merged }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        EXPECTED_AUTHOR: ${{ inputs.pr_author }}
        EXPLICIT_COMMIT: ${{ inputs.commit }}
        EXPLICIT_VERSION: ${{ inputs.version }}
        PREFIX: ${{ inputs.release_branch_prefix }}
        FILE: ${{ inputs.version_file }}
        PATTERN: ${{ inputs.version_pattern }}
        CHANGELOG: ${{ inputs.changelog_file }}
        TOOLS: ${{ github.action_path }}/../release-tools/release_tools.py
      run: |
        set -euo pipefail
        if [[ -n "$EXPLICIT_COMMIT" ]]; then
          # Explicit-commit mode: release-settle (direct) made this commit a
          # moment ago and authorised the actor; only the immutability and
          # content checks below apply.
          if [[ ! "$EXPLICIT_COMMIT" =~ ^[0-9a-f]{40}$ || -z "$EXPLICIT_VERSION" ]]; then
            echo "::error::explicit mode needs a full 40-hex commit and a version"; exit 1
          fi
          version="$(python3 "$TOOLS" normalize "$EXPLICIT_VERSION")"
          MERGE_SHA="$EXPLICIT_COMMIT"
          git fetch --quiet --tags origin "$MERGE_SHA"
        else
          if [[ "$MERGED" != "true" || -z "$MERGE_SHA" ]]; then
            echo "::error::publish runs on a merged settle PR (pull_request closed, merged == true)"; exit 1
          fi
          if [[ "$HEAD_REF" != chore/release-settle-v* ]]; then
            echo "::error::head branch '$HEAD_REF' is not a settle PR"; exit 1
          fi
          if [[ -n "$EXPECTED_AUTHOR" && "$PR_AUTHOR" != "$EXPECTED_AUTHOR" ]]; then
            echo "::error::settle PR #$PR_NUMBER was opened by '$PR_AUTHOR', not by '$EXPECTED_AUTHOR' (the identity release-settle runs under); refusing to publish from it"; exit 1
          fi
          version="$(python3 "$TOOLS" normalize "${HEAD_REF#chore/release-settle-}")"
          if [[ "$BASE_REF" != "${PREFIX}${version}" ]]; then
            echo "::error::settle PR for v$version merged into '$BASE_REF', expected ${PREFIX}${version}"; exit 1
          fi
          git fetch --quiet --tags origin "$MERGE_SHA"
          # Drift guard: the settle PR recorded which commit was settled. The
          # merge commit's parent is the release-branch tip at merge time; if
          # anything landed after the settle PR was opened they differ, and the
          # changelog no longer describes what is being tagged.
          settled="$(grep -oE '<!-- release-settle: v[0-9.]+ [0-9a-f]{40} -->' <<<"$PR_BODY" | head -n1 | grep -oE '[0-9a-f]{40}' || true)"
          if [[ -z "$settled" ]]; then
            echo "::error::settle PR body has no '<!-- release-settle: ... -->' marker; refusing to publish an unverifiable settlement"; exit 1
          fi
          parent="$(git rev-parse "$MERGE_SHA^")"
          if [[ "$parent" != "$settled" ]]; then
            echo "::error::release branch drifted: settle PR settled $settled but the branch tip at merge was $parent. Re-run release-settle on the current tip."; exit 1
          fi
        fi
        if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
          echo "::error::tag v$version already exists; a release is published once"; exit 1
        fi
        actual="$(git show "$MERGE_SHA:$FILE" | python3 "$TOOLS" read-file /dev/stdin "$PATTERN")"
        if [[ "$actual" != "$version" ]]; then
          echo "::error::$FILE at $MERGE_SHA says $actual, expected $version"; exit 1
        fi
        notes="$RUNNER_TEMP/release-notes-v$version.md"
        git show "$MERGE_SHA:$CHANGELOG" > "$RUNNER_TEMP/changelog-at-merge.md"
        python3 "$TOOLS" changelog-extract "$RUNNER_TEMP/changelog-at-merge.md" "$version" > "$notes"
        {
          echo "version=$version"
          echo "merge_sha=$MERGE_SHA"
          echo "notes_file=$notes"
        } >> "$GITHUB_OUTPUT"
        echo "publishing v$version at $MERGE_SHA"; echo "--- notes ---"; cat "$notes"

    - name: Create and push tag
      id: tag
      shell: bash
      env:
        VERSION: ${{ steps.guard.outputs.version }}
        MERGE_SHA: ${{ steps.guard.outputs.merge_sha }}
      run: |
        set -euo pipefail
        tag="v$VERSION"
        git tag -a "$tag" "$MERGE_SHA" -m "Release $tag"
        git push --quiet origin "refs/tags/$tag"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "tagged $MERGE_SHA as $tag"

    - name: Publish GitHub Release
      id: release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TAG: ${{ steps.tag.outputs.tag }}
        NOTES: ${{ steps.guard.outputs.notes_file }}
      run: |
        set -euo pipefail
        url="$(gh release create "$TAG" --verify-tag --latest --title "$TAG" --notes-file "$NOTES")"
        echo "url=$url" >> "$GITHUB_OUTPUT"
        echo "release: $url"

    - name: Remove git auth
      if: always()
      shell: bash
      run: git config --unset-all "http.https://github.com/.extraheader" || true
