name: Release Route
description: >-
  Route a push or manual dispatch to cut, refresh, publish or skip using merged
  release PR metadata. Read-only; uses the job token, not a release App secret.
  Requires a checkout with full history and persist-credentials disabled.

inputs:
  kind:
    description: "Release flow to route: candidate or settle."
    required: true
  github_token:
    description: "Read-only job token with contents and pull-requests read."
    default: ${{ github.token }}
  pr_author:
    description: "Expected author of candidate and settle PRs."
    default: "mega-gutenberg[bot]"
  version_file:
    description: "File holding the release version."
    required: true
  version_pattern:
    description: "Version file format: plain, toml or json."
    default: plain
  release_branch_prefix:
    description: "Release branch prefix before X.Y.Z."
    default: release-v
  version:
    description: "Optional version filter for manual dispatch."
    default: ""

outputs:
  action:
    description: "Next action: cut, refresh, publish or skip; versioned settle dispatch returns publish, refresh or skip."
    value: ${{ steps.route.outputs.action }}
  reason:
    description: "Why this action was selected."
    value: ${{ steps.route.outputs.reason }}
  settle_source:
    description: "Publication source: dispatch for a versioned settle dispatch routed to publish; empty otherwise."
    value: ${{ steps.route.outputs.settle_source }}
  version:
    description: "Normalized release version, when routing one push."
    value: ${{ steps.route.outputs.version }}
  release_branch:
    description: "Release branch for the pushed version."
    value: ${{ steps.route.outputs.release_branch }}
  commit:
    description: "Pushed commit for cut, refresh or publish."
    value: ${{ steps.route.outputs.commit }}
  pr_number:
    description: "Merged release PR number, or candidate PR number for a versioned settle dispatch, when provided."
    value: ${{ steps.route.outputs.pr_number }}
  targets:
    description: "Compact JSON array of refresh targets."
    value: ${{ steps.route.outputs.targets }}

runs:
  using: composite
  steps:
    - name: Route
      id: route
      shell: bash
      env:
        AUTH_WRAPPER: ${{ github.action_path }}/../git-auth/with-github-auth.sh
        GITHUB_AUTH_TOKEN: ${{ inputs.github_token }}
        GH_TOKEN: ${{ inputs.github_token }}
        KIND: ${{ inputs.kind }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        EXPECTED_AUTHOR: ${{ inputs.pr_author }}
        FILE: ${{ inputs.version_file }}
        PATTERN: ${{ inputs.version_pattern }}
        PREFIX: ${{ inputs.release_branch_prefix }}
        DISPATCH_VERSION: ${{ inputs.version }}
        TOOLS: ${{ github.action_path }}/../release-tools/release_tools.py
      run: |
        "$AUTH_WRAPPER" bash --noprofile --norc -e -o pipefail <<'GITHUB_AUTH_COMMAND'
        set -euo pipefail
        if [[ "$(git rev-parse --is-shallow-repository)" == true ]]; then
          echo "::error::release-route needs full history; check out with fetch-depth: 0"; exit 1
        fi
        git rev-parse --verify HEAD >/dev/null
        default="${DEFAULT_BRANCH:-}"
        if [[ -z "$default" ]]; then
          default="$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef -q .defaultBranchRef.name)"
        fi
        git fetch --quiet --tags origin
        # Only vX.Y.Z tags are releases; release_tools names and ignores the
        # rest (v1.2.0-rc1), so such a tag can neither be "the latest" nor fail the route.
        latest="$(git tag -l 'v*' | python3 "$TOOLS" latest-tag)"
        pulls='[]'; branches='[]'; parent=""; actual=""; tag_commit=""
        tag_exists=false; release_exists=false
        # Exit 2 means no matching tag, not a failed remote read.
        has_tag() {
          local status
          if git ls-remote --exit-code --tags origin "refs/tags/$1" >/dev/null; then
            return 0
          else
            status=$?
            [[ "$status" == 2 ]] || exit "$status"
            return 1
          fi
        }
        # Sets $actual to the version at <commit>. A version file that is
        # missing or does not parse is a configuration error, not a candidate
        # that has not landed yet, so it fails the route instead of skipping.
        read_version() { # <commit> <where>
          local text
          if ! text="$(git show "$1:$FILE" 2>/dev/null)"; then
            echo "::error title=Release route::cannot read the version file: $FILE does not exist at $1 ($2); version_file '$FILE' and version_pattern '$PATTERN' must match the release-settle step"
            exit 1
          fi
          if ! actual="$(python3 "$TOOLS" read-file /dev/stdin "$PATTERN" <<< "$text")"; then
            echo "::error title=Release route::cannot read the version file: $FILE at $1 ($2) does not parse with version_pattern '$PATTERN'; version_file and version_pattern must match the release-settle step"
            exit 1
          fi
        }
        if [[ "$GITHUB_EVENT_NAME" == push ]]; then
          parent="$(git rev-parse --verify "$GITHUB_SHA^" 2>/dev/null || true)"
          pulls="$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" |
            jq -ces 'if all(.[]; type == "array") then add else error("pulls API must return arrays") end')"
          # route skips and names a prefix branch whose suffix is not X.Y.Z.
          if [[ "$KIND" == settle && "$GITHUB_REF_NAME" == "$PREFIX"* ]] &&
              version="$(python3 "$TOOLS" normalize "${GITHUB_REF_NAME#"$PREFIX"}" 2>/dev/null)"; then
            tag="v$version"
            # This version's own tag (a publication resuming) is not "newer".
            latest="$(git tag -l 'v*' | python3 "$TOOLS" latest-tag --exclude "$version")"
            if has_tag "$tag"; then
              tag_exists=true
              tag_commit="$(git ls-remote origin "refs/tags/$tag^{}" | cut -f1)"
              if [[ -z "$tag_commit" ]]; then
                tag_commit="$(git ls-remote origin "refs/tags/$tag" | cut -f1)"
              fi
              if gh release view "$tag" --json tagName >/dev/null 2>&1; then release_exists=true; fi
            fi
            if [[ "$release_exists" == false ]]; then
              read_version "$GITHUB_SHA" "$GITHUB_REF_NAME"
            fi
            if [[ "$pulls" == '[]' ]]; then
              pulls="$(gh pr list --state merged --base "$GITHUB_REF_NAME" \
                --head "chore/release-settle-v$version" \
                --json number,mergeCommit,headRefName,baseRefName,author,body,mergedAt |
                jq -ce 'if type != "array" then error("pr list must return an array") else
                  map({number, merge_commit_sha: .mergeCommit.oid, merged_at: .mergedAt,
                    head: {ref: .headRefName}, base: {ref: .baseRefName},
                    user: {login: (if ((.author.login // "") | startswith("app/")) then (.author.login[4:] + "[bot]") else (.author.login // "") end)}, body}) end')"
            fi
          fi
        elif [[ "$KIND" == settle && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
          heads="$(git ls-remote --heads origin "refs/heads/${PREFIX}*")"
          while read -r tip ref; do
            [[ -n "$tip" ]] || continue
            branch="${ref#refs/heads/}"
            if ! version="$(python3 "$TOOLS" normalize "${branch#"$PREFIX"}" 2>/dev/null)"; then
              echo "::notice title=Release route::skipping $branch: not $PREFIX<X.Y.Z>"; continue
            fi
            git fetch --quiet origin "$tip"
            tagged=false; branch_release_exists=false; actual=""
            if has_tag "v$version"; then
              tagged=true
              if gh release view "v$version" --json tagName >/dev/null 2>&1; then branch_release_exists=true; fi
            else
              read_version "$tip" "$branch"
            fi
            candidate_merge_sha=""; candidate_is_ancestor='""'; candidate_pr_number=""
            open_settle_pr=false; published_tag_sha=""
            if [[ -n "$DISPATCH_VERSION" ]]; then
              candidate_pr="$(gh pr list --state merged \
                --head "chore/release-candidate-$version" \
                --json number,mergeCommit,headRefName,baseRefName,author |
                jq -r --arg default "$default" --arg branch "$branch" \
                  '[.[] | select(.baseRefName == $default or .baseRefName == $branch)][0] // {}')"
              candidate_merge_sha="$(jq -r '.mergeCommit.oid // ""' <<< "$candidate_pr")"
              candidate_pr_number="$(jq -r '.number // ""' <<< "$candidate_pr")"
              if [[ -n "$candidate_merge_sha" ]]; then
                candidate_is_ancestor=false
                if git merge-base --is-ancestor "$candidate_merge_sha" "$tip"; then
                  candidate_is_ancestor=true
                fi
              fi
              open_settle_pr="$(gh pr list --state open \
                --head "chore/release-settle-v$version" --json number |
                jq -c 'length > 0')"
              if [[ "$tagged" == true ]]; then
                published_tag_sha="$(git ls-remote origin "refs/tags/v$version^{}" | cut -f1)"
                if [[ -z "$published_tag_sha" ]]; then
                  published_tag_sha="$(git ls-remote origin "refs/tags/v$version" | cut -f1)"
                fi
              fi
            fi
            branches="$(jq -c --arg name "$branch" --arg tip "$tip" --arg actual "$actual" \
              --argjson tagged "$tagged" --argjson release_exists "$branch_release_exists" \
              --arg candidate_pr_number "$candidate_pr_number" \
              --arg candidate_merge_sha "$candidate_merge_sha" --argjson candidate_is_ancestor "$candidate_is_ancestor" \
              --argjson open_settle_pr "$open_settle_pr" --arg published_tag_sha "$published_tag_sha" \
              '. + [{name: $name, tip: $tip, version_at_tip: (if $actual == "" then null else $actual end), tag_exists: $tagged,
                release_exists: $release_exists, candidate_pr_number: $candidate_pr_number,
                candidate_merge_sha: $candidate_merge_sha, candidate_is_ancestor: $candidate_is_ancestor,
                open_settle_pr: $open_settle_pr, published_tag_sha: $published_tag_sha}]' <<< "$branches")"
          done <<< "$heads"
        fi
        if ! decision="$(jq -n --arg kind "$KIND" --arg event "$GITHUB_EVENT_NAME" \
          --arg sha "$GITHUB_SHA" --arg first_parent "$parent" --arg ref_name "$GITHUB_REF_NAME" \
          --arg default_branch "$default" --arg prefix "$PREFIX" --arg pr_author "$EXPECTED_AUTHOR" \
          --arg version_at_sha "$actual" --arg latest_tag "$latest" --arg dispatch_version "$DISPATCH_VERSION" \
          --arg tag_commit "$tag_commit" --argjson pulls "$pulls" --argjson branches "$branches" \
          --argjson tag_exists "$tag_exists" --argjson release_exists "$release_exists" \
          '{kind: $kind, event: $event, sha: $sha, first_parent: $first_parent,
            ref_name: $ref_name, default_branch: $default_branch, prefix: $prefix, pr_author: $pr_author,
            version_at_sha: (if $version_at_sha == "" then null else $version_at_sha end),
            latest_tag: $latest_tag, dispatch_version: $dispatch_version,
            tag_commit: (if $tag_commit == "" then null else $tag_commit end),
            pulls: $pulls, branches: $branches, tag_exists: $tag_exists, release_exists: $release_exists}' |
          python3 "$TOOLS" route)"; then
          echo "::error title=Release route::cannot route $KIND $GITHUB_EVENT_NAME on $GITHUB_REF_NAME; see the release_tools error above"
          exit 1
        fi
        # Multiline output framing also keeps API-supplied reasons from becoming output keys.
        # On dispatch, route() maps candidate_pr_number to pr_number for GITHUB_OUTPUT below.
        while read -r key; do
          delimiter="route_$(openssl rand -hex 16)"
          {
            echo "$key<<$delimiter"
            jq -r --arg key "$key" '.[$key] | if type == "array" then tojson elif . == null then "" else . end' <<< "$decision"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
        done < <(jq -r 'keys[]' <<< "$decision")
        action="$(jq -r .action <<< "$decision")"
        reason="$(jq -r .reason <<< "$decision")"
        if [[ "$action" == skip && "$tag_exists" == true && "$release_exists" == false ]]; then
          echo "::warning::$reason"
        fi
        echo "::notice title=Release route::$action: $reason"
        GITHUB_AUTH_COMMAND
