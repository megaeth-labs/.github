name: Release Settle
description: >-
  Propose settling a release candidate: verify `commit` is the tip of the
  release branch and carries the expected version, generate release notes from
  the commits since the previous tag, write them into the changelog (stamping
  the date onto the candidate's `## vX.Y.Z` entry), and — in the default
  `pr` mode — open a `chore/release-settle-vX.Y.Z` PR onto the release
  branch; merging that PR is the settlement decision and release-publish
  then tags the merge commit once. In `direct` mode the dispatch itself is
  the decision: the dispatching actor must be authorised by `settlers`, the
  changelog commit is pushed straight to the release branch (the app must be
  a bypass actor on that branch's ruleset), and release-publish runs
  immediately on that commit. Run as a step in a job the consumer owns; the
  consumer checks the repository out first (`fetch-depth: 0`,
  `persist-credentials: false`). Needs `gh` and `python3` on the runner.

inputs:
  token:
    description: >-
      GitHub App installation token (e.g. the Maxwell app). Pushes the settle
      branch and opens the PR so that it triggers CI.
    required: true
  version:
    description: "Version being settled, X.Y.Z or vX.Y.Z."
    required: true
  commit:
    description: >-
      Full SHA to settle. Must be the current tip of the release branch: the
      settlement is a statement about a specific commit, and the tip is the
      only commit a later merge can build on.
    required: true
  version_file:
    required: true
  version_pattern:
    required: false
    default: plain
  release_branch:
    description: "Defaults to `<release_branch_prefix>X.Y.Z`."
    required: false
    default: ""
  release_branch_prefix:
    required: false
    default: release-v
  changelog_file:
    required: false
    default: CHANGELOG.md
  settle_mode:
    description: "`pr` (default): open a settle PR. `direct`: settle and publish now, from this dispatch."
    required: false
    default: pr
  settlers:
    description: >-
      Who may settle in `direct` mode: comma-separated GitHub logins, and/or
      the keyword `admin` (the dispatching actor must have admin permission
      on the repository, checked with `github_token`). Required for `direct`.
    required: false
    default: ""
  github_token:
    description: "Job token used for the `admin` permission check in `direct` mode."
    required: false
    default: ${{ github.token }}
  pr_labels:
    description: "Comma-separated labels for the settle PR (for repos whose label gates apply to release branches too)."
    required: false
    default: ""
  git_user_name:
    required: false
    default: "mega-maxwell[bot]"
  git_user_email:
    required: false
    default: "290560214+mega-maxwell[bot]@users.noreply.github.com"

outputs:
  version:
    value: ${{ steps.guard.outputs.version }}
  pr_url:
    description: URL of the settle PR.
    value: ${{ steps.pr.outputs.pr_url }}
  notes_file:
    description: Path of the generated release-notes markdown.
    value: ${{ steps.notes.outputs.notes_file }}
  settled_commit:
    description: "`direct` mode: the changelog commit that was tagged."
    value: ${{ steps.direct.outputs.commit }}
  tag:
    description: "`direct` mode: the tag created."
    value: ${{ steps.publish.outputs.tag }}
  release_url:
    description: "`direct` mode: the GitHub Release created."
    value: ${{ steps.publish.outputs.release_url }}

runs:
  using: composite
  steps:
    - name: Configure git auth
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        NAME: ${{ inputs.git_user_name }}
        EMAIL: ${{ inputs.git_user_email }}
      run: |
        set -euo pipefail
        git config user.name "$NAME"
        git config user.email "$EMAIL"
        # Same mechanism actions/checkout uses, scoped to this clone and
        # removed in the last step. Drop any header a persisted checkout left
        # behind first: git sends every configured extraheader, and two
        # Authorization headers get a 400.
        git config --unset-all "http.https://github.com/.extraheader" || true
        auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
        # The token itself is masked by create-github-app-token; its base64
        # form is not, so mask it too before it can reach a log.
        echo "::add-mask::$auth"
        git config "http.https://github.com/.extraheader" "AUTHORIZATION: basic $auth"

    - name: Guard
      id: guard
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        COMMIT: ${{ inputs.commit }}
        BRANCH_IN: ${{ inputs.release_branch }}
        PREFIX: ${{ inputs.release_branch_prefix }}
        FILE: ${{ inputs.version_file }}
        PATTERN: ${{ inputs.version_pattern }}
        TOOLS: ${{ github.action_path }}/../release-tools/release_tools.py
      run: |
        set -euo pipefail
        version="$(python3 "$TOOLS" normalize "$INPUT_VERSION")"
        branch="${BRANCH_IN:-${PREFIX}${version}}"
        if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::commit must be a full 40-hex SHA, got '$COMMIT'"; exit 1
        fi
        git fetch --quiet --tags origin "+refs/heads/$branch:refs/remotes/origin/$branch" \
          || { echo "::error::release branch $branch does not exist"; exit 1; }
        if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
          echo "::error::tag v$version already exists — this release is settled"; exit 1
        fi
        tip="$(git rev-parse "origin/$branch")"
        if [[ "$tip" != "$COMMIT" ]]; then
          echo "::error::$COMMIT is not the tip of $branch (tip is $tip). Settle the tip, or move the branch first."; exit 1
        fi
        actual="$(git show "$COMMIT:$FILE" | python3 "$TOOLS" read-file /dev/stdin "$PATTERN")"
        if [[ "$actual" != "$version" ]]; then
          echo "::error::$FILE at $COMMIT says $actual, expected $version"; exit 1
        fi
        latest="$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)"
        if ! python3 "$TOOLS" is-greater "$version" "$latest"; then
          echo "::error::$version is not newer than the latest tag ${latest:-<none>}"; exit 1
        fi
        {
          echo "version=$version"
          echo "branch=$branch"
          echo "previous_tag=$latest"
        } >> "$GITHUB_OUTPUT"
        echo "settling v$version at $COMMIT on $branch (previous tag: ${latest:-<none>})"

    - name: Compare workflows with the default branch
      shell: bash
      env:
        COMMIT: ${{ inputs.commit }}
        BRANCH: ${{ steps.guard.outputs.branch }}
        DEFAULT: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        # A `release: published` workflow runs from the tagged commit's tree,
        # not from the default branch, and so does release-publish (it runs on
        # the settle PR's merge into the release branch). A workflow added
        # after this branch was cut is silently absent from the release
        # unless it is brought onto the branch first — so say so now, while
        # there is still time.
        if [[ -z "$DEFAULT" ]]; then echo "default branch unknown; skipping"; exit 0; fi
        git fetch --quiet origin "+refs/heads/$DEFAULT:refs/remotes/origin/$DEFAULT"
        missing="$(comm -23 \
          <(git ls-tree --name-only "origin/$DEFAULT" -- .github/workflows/ | sort) \
          <(git ls-tree --name-only "$COMMIT" -- .github/workflows/ | sort) | tr '\n' ' ')"
        if [[ -n "${missing// /}" ]]; then
          echo "::warning::$BRANCH at $COMMIT lacks workflows that $DEFAULT has: ${missing}— a release-event workflow runs from the tagged commit's tree, so a publish target among them will not run for this release unless it is added to $BRANCH (through its own PR) before settling"
        else
          echo "every workflow on $DEFAULT is present at $COMMIT"
        fi

    - name: Authorise the settler (direct mode)
      if: inputs.settle_mode == 'direct'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        ACTOR: ${{ github.actor }}
        SETTLERS: ${{ inputs.settlers }}
        MODE: ${{ inputs.settle_mode }}
      run: |
        set -euo pipefail
        if [[ -z "$SETTLERS" ]]; then
          echo "::error::settle_mode: direct requires settlers (logins and/or 'admin')"; exit 1
        fi
        ok=false
        IFS=',' read -ra entries <<<"$SETTLERS"
        for e in "${entries[@]}"; do
          e="${e// /}"
          [[ -z "$e" ]] && continue
          if [[ "$e" == "admin" ]]; then
            perm="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" -q .permission 2>/dev/null || true)"
            [[ "$perm" == "admin" ]] && ok=true
          elif [[ "$e" == "$ACTOR" ]]; then
            ok=true
          fi
        done
        if [[ "$ok" != true ]]; then
          echo "::error::$ACTOR is not authorised to settle directly (settlers: $SETTLERS)"; exit 1
        fi
        echo "direct settle authorised for $ACTOR"

    - name: Generate release notes
      id: notes
      shell: bash
      env:
        VERSION: ${{ steps.guard.outputs.version }}
        PREVIOUS: ${{ steps.guard.outputs.previous_tag }}
        COMMIT: ${{ inputs.commit }}
        TOOLS: ${{ github.action_path }}/../release-tools/release_tools.py
      run: |
        set -euo pipefail
        notes="$RUNNER_TEMP/release-notes-v$VERSION.md"
        range="$COMMIT"
        [[ -n "$PREVIOUS" ]] && range="$PREVIOUS..$COMMIT"
        git log --no-merges --format='%H%x09%s' "$range" \
          | python3 "$TOOLS" notes "$GITHUB_REPOSITORY" "$VERSION" "$(date -u +%F)" > "$notes"
        echo "notes_file=$notes" >> "$GITHUB_OUTPUT"
        echo "--- release notes ---"; cat "$notes"

    - name: Write changelog and open settle PR
      if: inputs.settle_mode != 'direct'
      id: pr
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ steps.guard.outputs.version }}
        BRANCH: ${{ steps.guard.outputs.branch }}
        COMMIT: ${{ inputs.commit }}
        CHANGELOG: ${{ inputs.changelog_file }}
        NOTES: ${{ steps.notes.outputs.notes_file }}
        PR_LABELS: ${{ inputs.pr_labels }}
        TOOLS: ${{ github.action_path }}/../release-tools/release_tools.py
      run: |
        set -euo pipefail
        head="chore/release-settle-v$VERSION"
        label_args=()
        IFS=',' read -ra labels <<<"$PR_LABELS"
        for l in "${labels[@]}"; do
          l="${l// /}"
          [[ -n "$l" ]] && label_args+=(--label "$l")
        done
        git checkout --quiet -B "$head" "$COMMIT"
        what="$(python3 "$TOOLS" changelog-insert "$CHANGELOG" "$VERSION" "$NOTES")"
        if git diff --quiet -- "$CHANGELOG"; then
          echo "::error::$CHANGELOG already carries exactly this v$VERSION entry; nothing to settle"; exit 1
        fi
        git add "$CHANGELOG"
        git commit --quiet -m "chore(release): settle v$VERSION" -m "Changelog entry $what for v$VERSION at $COMMIT."
        git push --quiet --force origin "$head"
        body="$RUNNER_TEMP/settle-pr-body.md"
        {
          echo "Settle **v$VERSION** at \`$COMMIT\` (tip of \`$BRANCH\`)."
          echo
          echo "Merging this PR is the settlement decision: \`release-publish\` will tag the merge commit as \`v$VERSION\` and publish the GitHub Release with the notes below. The default branch picks this entry up in the next release candidate PR. If more commits land on \`$BRANCH\` first, this PR goes stale and must be regenerated."
          echo
          echo "<!-- release-settle: v$VERSION $COMMIT -->"
          echo
          cat "$NOTES"
        } > "$body"
        existing="$(gh pr list --head "$head" --base "$BRANCH" --state open --json url -q '.[0].url')"
        if [[ -n "$existing" ]]; then
          gh pr edit "$existing" --body-file "$body" >/dev/null
          url="$existing"
        else
          url="$(gh pr create --base "$BRANCH" --head "$head" --title "chore(release): settle v$VERSION" --body-file "$body" "${label_args[@]}")"
        fi
        echo "pr_url=$url" >> "$GITHUB_OUTPUT"
        echo "settle PR: $url"

    - name: Write changelog onto the release branch (direct mode)
      if: inputs.settle_mode == 'direct'
      id: direct
      shell: bash
      env:
        VERSION: ${{ steps.guard.outputs.version }}
        BRANCH: ${{ steps.guard.outputs.branch }}
        COMMIT: ${{ inputs.commit }}
        CHANGELOG: ${{ inputs.changelog_file }}
        NOTES: ${{ steps.notes.outputs.notes_file }}
        TOOLS: ${{ github.action_path }}/../release-tools/release_tools.py
      run: |
        set -euo pipefail
        git checkout --quiet -B "$BRANCH" "$COMMIT"
        what="$(python3 "$TOOLS" changelog-insert "$CHANGELOG" "$VERSION" "$NOTES")"
        if git diff --quiet -- "$CHANGELOG"; then
          echo "::error::$CHANGELOG already carries exactly this v$VERSION entry; nothing to settle"; exit 1
        fi
        git add "$CHANGELOG"
        git commit --quiet -m "chore(release): settle v$VERSION" -m "Changelog entry $what for v$VERSION at $COMMIT (direct settle)."
        # Fast-forward the protected branch; the app must be a bypass actor on
        # its ruleset, and the tip must still be the settled commit.
        if ! git push --quiet origin "HEAD:refs/heads/$BRANCH"; then
          echo "::error::could not push the settle commit to $BRANCH — the branch moved since $COMMIT, or the app is not a bypass actor on its ruleset"; exit 1
        fi
        echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "settle commit $(git rev-parse --short HEAD) pushed to $BRANCH"

    - name: Remove git auth
      if: always()
      shell: bash
      run: git config --unset-all "http.https://github.com/.extraheader" || true

    - name: Tag and publish (direct mode)
      if: inputs.settle_mode == 'direct'
      id: publish
      uses: megaeth-labs/.github/.github/actions/release-publish@main
      with:
        token: ${{ inputs.token }}
        commit: ${{ steps.direct.outputs.commit }}
        version: ${{ steps.guard.outputs.version }}
        version_file: ${{ inputs.version_file }}
        version_pattern: ${{ inputs.version_pattern }}
        changelog_file: ${{ inputs.changelog_file }}
        release_branch_prefix: ${{ inputs.release_branch_prefix }}
        git_user_name: ${{ inputs.git_user_name }}
        git_user_email: ${{ inputs.git_user_email }}
