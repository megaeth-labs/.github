name: Release Settle
description: >-
  Maintain a settle PR for a release candidate: verify `commit` is the tip of the
  release branch and carries the expected version, generate release notes from
  the commits since the previous tag, write them into the changelog (stamping
  the date onto the candidate's `## vX.Y.Z` entry), and open or refresh a
  `chore/release-settle-vX.Y.Z` PR onto the release branch without rewriting
  its history. New commits on the release branch refresh this PR automatically;
  merging it is the settlement decision and release-publish then tags the merge
  commit once. Run as a step in a job the consumer owns;
  consumer checks the repository out first (`fetch-depth: 0`,
  `persist-credentials: false`). Needs `gh` and `python3` on the runner.
  Guide: .github/actions/RELEASE.md in megaeth-labs/.github.

inputs:
  token:
    description: >-
      mega-gutenberg GitHub App installation token. Pushes the settle branch
      and opens or refreshes the PR so that it triggers CI.
    required: true
  version:
    description: "Version being settled, X.Y.Z or vX.Y.Z."
    required: true
  commit:
    description: >-
      Full SHA to settle. Must be the current tip of the release branch: the
      settlement is a statement about a specific commit, and the tip is the
      only commit a later merge can build on.
    required: true
  version_file:
    description: "File holding the version (VERSION, Cargo.toml, pyproject.toml, package.json); the same value as in release-candidate."
    required: true
  version_pattern:
    description: "How the version is stored in `version_file`: plain, toml or json."
    required: false
    default: plain
  release_branch:
    description: "Defaults to `<release_branch_prefix>X.Y.Z`."
    required: false
    default: ""
  release_branch_prefix:
    description: "Release branch name prefix; the branch is `<prefix>X.Y.Z`."
    required: false
    default: release-v
  changelog_file:
    description: "Changelog the entry is written to (Keep-a-Changelog style, newest first)."
    required: false
    default: CHANGELOG.md
  pr_author:
    description: "Author of the bot-maintained settle PR; PRs by other authors are superseded."
    required: false
    default: "mega-gutenberg[bot]"
  pr_labels:
    description: "Comma-separated labels for the settle PR (for repos whose label gates apply to release branches too)."
    required: false
    default: ""
  git_user_name:
    description: "Committer identity for the commits this action makes."
    required: false
    default: "mega-gutenberg[bot]"
  git_user_email:
    description: "Committer email for the commits this action makes."
    required: false
    default: "348780249+mega-gutenberg[bot]@users.noreply.github.com"

outputs:
  version:
    description: "The normalised version, X.Y.Z."
    value: ${{ steps.guard.outputs.version }}
  pr_url:
    description: URL of the settle PR.
    value: ${{ steps.pr.outputs.pr_url }}
  notes_file:
    description: Path of the generated release-notes markdown.
    value: ${{ steps.notes.outputs.notes_file }}

runs:
  using: composite
  steps:
    - name: Configure git identity
      shell: bash
      env:
        NAME: ${{ inputs.git_user_name }}
        EMAIL: ${{ inputs.git_user_email }}
      run: |
        git config user.name "$NAME"
        git config user.email "$EMAIL"

    - name: Guard
      id: guard
      shell: bash
      env:
        AUTH_WRAPPER: ${{ github.action_path }}/../git-auth/with-github-auth.sh
        GITHUB_AUTH_TOKEN: ${{ inputs.token }}
        INPUT_VERSION: ${{ inputs.version }}
        COMMIT: ${{ inputs.commit }}
        BRANCH_IN: ${{ inputs.release_branch }}
        PREFIX: ${{ inputs.release_branch_prefix }}
        FILE: ${{ inputs.version_file }}
        PATTERN: ${{ inputs.version_pattern }}
        TOOLS: ${{ github.action_path }}/../release-tools/release_tools.py
      run: |
        "$AUTH_WRAPPER" bash --noprofile --norc -e -o pipefail <<'GITHUB_AUTH_COMMAND'
        set -euo pipefail
        version="$(python3 "$TOOLS" normalize "$INPUT_VERSION")"
        branch="${BRANCH_IN:-${PREFIX}${version}}"
        if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::commit must be a full 40-hex SHA, got '$COMMIT'"; exit 1
        fi
        git fetch --quiet --tags origin "+refs/heads/$branch:refs/remotes/origin/$branch" \
          || { echo "::error::release branch $branch does not exist"; exit 1; }
        if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
          echo "::error::tag v$version already exists — this release is settled"; exit 1
        fi
        tip="$(git rev-parse "origin/$branch")"
        if [[ "$tip" != "$COMMIT" ]]; then
          echo "::error::$COMMIT is not the tip of $branch (tip is $tip). Settle the tip, or move the branch first."; exit 1
        fi
        actual="$(git show "$COMMIT:$FILE" | python3 "$TOOLS" read-file /dev/stdin "$PATTERN")"
        if [[ "$actual" != "$version" ]]; then
          echo "::error::$FILE at $COMMIT says $actual, expected $version"; exit 1
        fi
        latest="$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)"
        if ! python3 "$TOOLS" is-greater "$version" "$latest"; then
          echo "::error::$version is not newer than the latest tag ${latest:-<none>}"; exit 1
        fi
        {
          echo "version=$version"
          echo "branch=$branch"
          echo "previous_tag=$latest"
        } >> "$GITHUB_OUTPUT"
        echo "settling v$version at $COMMIT on $branch (previous tag: ${latest:-<none>})"
        GITHUB_AUTH_COMMAND

    - name: Compare workflows with the default branch
      shell: bash
      env:
        AUTH_WRAPPER: ${{ github.action_path }}/../git-auth/with-github-auth.sh
        GITHUB_AUTH_TOKEN: ${{ inputs.token }}
        COMMIT: ${{ inputs.commit }}
        BRANCH: ${{ steps.guard.outputs.branch }}
        DEFAULT: ${{ github.event.repository.default_branch }}
      run: |
        "$AUTH_WRAPPER" bash --noprofile --norc -e -o pipefail <<'GITHUB_AUTH_COMMAND'
        set -euo pipefail
        # A `release: published` workflow runs from the tagged commit's tree,
        # not from the default branch, and so does release-publish (it runs on
        # the settle PR's merge into the release branch). A workflow added
        # after this branch was cut is silently absent from the release
        # unless it is brought onto the branch first — so say so now, while
        # there is still time.
        if [[ -z "$DEFAULT" ]]; then echo "default branch unknown; skipping"; exit 0; fi
        git fetch --quiet origin "+refs/heads/$DEFAULT:refs/remotes/origin/$DEFAULT"
        missing="$(comm -23 \
          <(git ls-tree --name-only "origin/$DEFAULT" -- .github/workflows/ | sort) \
          <(git ls-tree --name-only "$COMMIT" -- .github/workflows/ | sort) | tr '\n' ' ')"
        if [[ -n "${missing// /}" ]]; then
          echo "::warning::$BRANCH at $COMMIT lacks workflows that $DEFAULT has: ${missing}— a release-event workflow runs from the tagged commit's tree, so a publish target among them will not run for this release unless it is added to $BRANCH (through its own PR) before settling"
        else
          echo "every workflow on $DEFAULT is present at $COMMIT"
        fi
        GITHUB_AUTH_COMMAND

    - name: Generate release notes
      id: notes
      shell: bash
      env:
        VERSION: ${{ steps.guard.outputs.version }}
        PREVIOUS: ${{ steps.guard.outputs.previous_tag }}
        COMMIT: ${{ inputs.commit }}
        TOOLS: ${{ github.action_path }}/../release-tools/release_tools.py
      run: |
        set -euo pipefail
        notes="$RUNNER_TEMP/release-notes-v$VERSION.md"
        range="$COMMIT"
        [[ -n "$PREVIOUS" ]] && range="$PREVIOUS..$COMMIT"
        git log --no-merges --format='%H%x09%s' "$range" \
          | python3 "$TOOLS" notes "$GITHUB_REPOSITORY" "$VERSION" "$(date -u +%F)" > "$notes"
        echo "notes_file=$notes" >> "$GITHUB_OUTPUT"
        echo "--- release notes ---"; cat "$notes"

    - name: Ensure the settle PR
      id: pr
      shell: bash
      env:
        AUTH_WRAPPER: ${{ github.action_path }}/../git-auth/with-github-auth.sh
        GITHUB_AUTH_TOKEN: ${{ inputs.token }}
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ steps.guard.outputs.version }}
        BRANCH: ${{ steps.guard.outputs.branch }}
        COMMIT: ${{ inputs.commit }}
        CHANGELOG: ${{ inputs.changelog_file }}
        NOTES: ${{ steps.notes.outputs.notes_file }}
        PR_LABELS: ${{ inputs.pr_labels }}
        PR_AUTHOR: ${{ inputs.pr_author }}
        TOOLS: ${{ github.action_path }}/../release-tools/release_tools.py
      run: |
        "$AUTH_WRAPPER" bash --noprofile --norc -e -o pipefail <<'GITHUB_AUTH_COMMAND'
        set -euo pipefail
        head="chore/release-settle-v$VERSION"
        prs="$RUNNER_TEMP/settle-prs.json"
        gh pr list --head "$head" --base "$BRANCH" --state open --json number,author,body,url > "$prs"
        python3 - "$prs" "$VERSION" > "$RUNNER_TEMP/settle-prs.tsv" <<'PY'
        import json, re, sys

        for pr in json.load(open(sys.argv[1])):
            marker = re.search(r"<!-- release-settle: v" + re.escape(sys.argv[2]) + r" ([0-9a-f]{40}) -->", pr["body"])
            print(pr["number"], pr["author"]["login"], pr["url"], marker[1] if marker else "-", sep="\t")
        PY
        pr=""; pr_url=""; old_marker=""
        while IFS=$'\t' read -r number author url marker; do
          if [[ "$author" != "$PR_AUTHOR" ]]; then
            gh pr close "$number" --comment "Superseded: the settle PR is now maintained by mega-gutenberg." >/dev/null
          else
            pr="$number"; pr_url="$url"; old_marker="$marker"
          fi
        done < "$RUNNER_TEMP/settle-prs.tsv"

        label_args=()
        IFS=',' read -ra labels <<<"$PR_LABELS"
        for l in "${labels[@]}"; do
          l="${l// /}"
          [[ -n "$l" ]] && label_args+=(--label "$l")
        done
        body="$RUNNER_TEMP/settle-pr-body.md"
        {
          echo "Settle **v$VERSION** at \`$COMMIT\` (tip of \`$BRANCH\`)."
          echo
          echo "Merging this PR is the settlement decision: \`release-publish\` will tag the merge commit as \`v$VERSION\` and publish the GitHub Release with the notes below. The default branch picks this entry up in the next release candidate PR. New commits on the release branch refresh this PR automatically; merging it is the settlement decision"
          echo
          echo "<!-- release-settle: v$VERSION $COMMIT -->"
          echo
          cat "$NOTES"
        } > "$body"
        if [[ -n "$pr" ]]; then
          git fetch --quiet origin "+refs/heads/$head:refs/remotes/origin/$head"
          git checkout --quiet -B "$head" "origin/$head"
          changed=false
          if ! git merge-base --is-ancestor "$COMMIT" HEAD; then
            if ! git merge --no-ff --no-edit "$COMMIT"; then
              git merge --abort
              echo "::error::could not merge $COMMIT into $head; close the settle PR so the next run recreates it"; exit 1
            fi
            changed=true
          fi
          what="$(python3 "$TOOLS" changelog-insert "$CHANGELOG" "$VERSION" "$NOTES")"
          if ! git diff --quiet -- "$CHANGELOG"; then
            git add "$CHANGELOG"
            git commit --quiet -m "chore(release): refresh settle v$VERSION" -m "Changelog entry $what for v$VERSION at $COMMIT."
            changed=true
          fi
          if [[ "$changed" == false && "$old_marker" == "$COMMIT" ]]; then
            echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
            echo "::notice::settle PR is up to date: $pr_url"
            exit 0
          fi
          git push --quiet origin "$head"
          gh pr edit "$pr" --body-file "$body"
        else
          # A closed, merged, or superseded PR leaves no maintained history.
          if git ls-remote --exit-code --heads origin "refs/heads/$head" >/dev/null; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$head" >/dev/null
          fi
          git checkout --quiet -B "$head" "$COMMIT"
          what="$(python3 "$TOOLS" changelog-insert "$CHANGELOG" "$VERSION" "$NOTES")"
          if git diff --quiet -- "$CHANGELOG"; then
            git commit --quiet --allow-empty -m "chore(release): settle v$VERSION" \
              -m "Changelog already current at $COMMIT; this PR records the settlement decision."
          else
            git add "$CHANGELOG"
            git commit --quiet -m "chore(release): settle v$VERSION" -m "Changelog entry $what for v$VERSION at $COMMIT."
          fi
          git push --quiet origin "$head"
          pr_url="$(gh pr create --base "$BRANCH" --head "$head" --title "chore(release): settle v$VERSION" --body-file "$body" "${label_args[@]}")"
        fi
        echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
        echo "settle PR: $pr_url"
        GITHUB_AUTH_COMMAND
