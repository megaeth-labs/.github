name: Release · Upload Artifact
description: >-
  Upload one file to Google Artifact Registry (generic repository) or a Cloud
  Storage bucket, idempotently: if the destination already holds a file, its
  hash is compared — identical means "already there" (success, nothing
  uploaded), different means failure, never a silent overwrite. Every
  destination is an input; nothing is defaulted. Authentication is the
  caller's job: run `google-github-actions/auth` (service-account key or
  Workload Identity Federation) before this step so `gcloud` is
  authenticated. `dry_run` computes the checksum and checks the destination
  but uploads nothing.
  Guide: .github/actions/RELEASE.md in megaeth-labs/.github.

inputs:
  file:
    description: "Path of the file to upload."
    required: true
  kind:
    description: "`artifact-registry` (generic repository) or `gcs` (bucket object)."
    required: true
  dry_run:
    required: false
    default: "false"
  # --- artifact-registry
  project:
    description: "GCP project id (artifact-registry)."
    required: false
    default: ""
  location:
    description: "Registry location, e.g. asia-northeast1 (artifact-registry)."
    required: false
    default: ""
  repository:
    description: "Generic repository name (artifact-registry)."
    required: false
    default: ""
  package:
    description: "Package name (artifact-registry)."
    required: false
    default: ""
  version:
    description: "Package version (artifact-registry); a leading `v` is stripped, so the tag can be passed."
    required: false
    default: ""
  path:
    description: "Optional folder inside the package version (artifact-registry)."
    required: false
    default: ""
  # --- gcs
  bucket:
    description: "Bucket name, without gs:// (gcs)."
    required: false
    default: ""
  object:
    description: "Object path inside the bucket (gcs)."
    required: false
    default: ""

outputs:
  sha256:
    value: ${{ steps.hash.outputs.sha256 }}
  uri:
    description: "Where the file lives (or would live) after this step."
    value: ${{ steps.upload.outputs.uri }}
  status:
    description: "`uploaded`, `exists` (identical file already there) or `dry-run`."
    value: ${{ steps.upload.outputs.status }}

runs:
  using: composite
  steps:
    - name: Validate inputs and hash the file
      id: hash
      shell: bash
      env:
        FILE: ${{ inputs.file }}
        KIND: ${{ inputs.kind }}
        PROJECT: ${{ inputs.project }}
        LOCATION: ${{ inputs.location }}
        REPOSITORY: ${{ inputs.repository }}
        PACKAGE: ${{ inputs.package }}
        VERSION: ${{ inputs.version }}
        BUCKET: ${{ inputs.bucket }}
        OBJECT: ${{ inputs.object }}
      run: |
        set -euo pipefail
        [[ -f "$FILE" ]] || { echo "::error::file not found: $FILE"; exit 1; }
        case "$KIND" in
          artifact-registry)
            for v in PROJECT LOCATION REPOSITORY PACKAGE VERSION; do
              [[ -n "${!v}" ]] || { echo "::error::$v is required for kind artifact-registry"; exit 1; }
            done ;;
          gcs)
            for v in BUCKET OBJECT; do
              [[ -n "${!v}" ]] || { echo "::error::$v is required for kind gcs"; exit 1; }
            done ;;
          *) echo "::error::kind must be artifact-registry or gcs, got '$KIND'"; exit 1 ;;
        esac
        command -v gcloud >/dev/null || { echo "::error::gcloud is not on this runner"; exit 1; }
        # google-github-actions/auth exports CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE;
        # gcloud honours it without an "active account", so test the credential
        # itself rather than `gcloud auth list`. If the override is present but
        # not picked up, log in with it explicitly.
        if ! gcloud auth print-access-token >/dev/null 2>&1; then
          if [[ -n "${CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE:-}" ]]; then
            gcloud auth login --brief --cred-file="$CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE" >/dev/null 2>&1 || true
          fi
        fi
        if ! gcloud auth print-access-token >/dev/null 2>&1; then
          echo "::error::gcloud is not authenticated — run google-github-actions/auth before this step"; exit 1
        fi
        account="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' 2>/dev/null | head -n1)"
        : "${account:=credential file override}"
        sha="$(sha256sum "$FILE" | cut -d' ' -f1)"
        echo "sha256=$sha" >> "$GITHUB_OUTPUT"
        echo "$(basename "$FILE"): sha256 $sha ($(stat -c %s "$FILE") bytes), gcloud as $account"

    - name: Upload
      id: upload
      shell: bash
      env:
        FILE: ${{ inputs.file }}
        KIND: ${{ inputs.kind }}
        DRY_RUN: ${{ inputs.dry_run }}
        SHA: ${{ steps.hash.outputs.sha256 }}
        PROJECT: ${{ inputs.project }}
        LOCATION: ${{ inputs.location }}
        REPOSITORY: ${{ inputs.repository }}
        PACKAGE: ${{ inputs.package }}
        VERSION: ${{ inputs.version }}
        DEST_PATH: ${{ inputs.path }}
        BUCKET: ${{ inputs.bucket }}
        OBJECT: ${{ inputs.object }}
      run: |
        set -euo pipefail
        name="$(basename "$FILE")"
        VERSION="${VERSION#v}"
        if [[ "$KIND" == "artifact-registry" ]]; then
          rel="${DEST_PATH:+${DEST_PATH%/}/}$name"
          uri="https://${LOCATION}-generic.pkg.dev/${PROJECT}/${REPOSITORY}/${PACKAGE}/${VERSION}/${rel}"
          # Does this exact file already exist under the version? Compare bytes, not names.
          existing="$(gcloud artifacts files list --project="$PROJECT" --location="$LOCATION" \
            --repository="$REPOSITORY" --package="$PACKAGE" --version="$VERSION" \
            --format='value(name)' 2>/dev/null | grep -F "/${rel//\//%2F}" || true)"
          if [[ -n "$existing" ]]; then
            tmp="$(mktemp -d)"
            gcloud artifacts generic download --project="$PROJECT" --location="$LOCATION" \
              --repository="$REPOSITORY" --package="$PACKAGE" --version="$VERSION" \
              --name="$rel" --destination="$tmp" >/dev/null 2>&1
            have="$(sha256sum "$tmp/$name" | cut -d' ' -f1)"
            if [[ "$have" == "$SHA" ]]; then
              echo "::notice::$uri already holds an identical file (sha256 $SHA) — nothing to do"
              { echo "uri=$uri"; echo "status=exists"; } >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::error::$uri already exists with a DIFFERENT file (sha256 $have vs $SHA); versions are immutable — refusing"; exit 1
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "::notice::dry run — would upload $name (sha256 $SHA) to $uri"
            { echo "uri=$uri"; echo "status=dry-run"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          args=(artifacts generic upload --project="$PROJECT" --location="$LOCATION"
                --repository="$REPOSITORY" --package="$PACKAGE" --version="$VERSION" --source="$FILE")
          [[ -n "$DEST_PATH" ]] && args+=(--destination-path="$DEST_PATH")
          gcloud "${args[@]}"
        else
          uri="gs://${BUCKET}/${OBJECT}"
          if gcloud storage ls "$uri" >/dev/null 2>&1; then
            tmp="$(mktemp -d)"
            gcloud storage cp "$uri" "$tmp/$name" >/dev/null 2>&1
            have="$(sha256sum "$tmp/$name" | cut -d' ' -f1)"
            if [[ "$have" == "$SHA" ]]; then
              echo "::notice::$uri already holds an identical file (sha256 $SHA) — nothing to do"
              { echo "uri=$uri"; echo "status=exists"; } >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::error::$uri already exists with a DIFFERENT file (sha256 $have vs $SHA) — refusing to overwrite a published artifact"; exit 1
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "::notice::dry run — would upload $name (sha256 $SHA) to $uri"
            { echo "uri=$uri"; echo "status=dry-run"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          gcloud storage cp "$FILE" "$uri"
        fi
        { echo "uri=$uri"; echo "status=uploaded"; } >> "$GITHUB_OUTPUT"
        echo "uploaded $name (sha256 $SHA) to $uri"
