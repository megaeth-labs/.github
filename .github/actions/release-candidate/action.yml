name: Release Candidate
description: >-
  Start a release (trunk-first). `stage: propose` bumps the version file on the
  default branch, drafts this release's changelog entry (dated at settle) from the
  commits since the previous tag, syncs the previous release's entry from its
  tag, and opens a `chore/release-candidate-vX.Y.Z` PR; `stage: cut`,
  run when that PR merges, creates `release-vX.Y.Z` at the merge commit. No tag
  is created at either stage — tags come from release-publish, once, at
  settlement. `base_commit` releases a commit that is not the tip of the
  default branch: `propose` cuts the release branch there itself and points the
  candidate PR at it, leaving `cut` nothing to do. Run as a step in a job the
  consumer owns; the consumer checks the repository out first
  (`fetch-depth: 0`, `persist-credentials: false`).
  Guide: .github/actions/RELEASE.md in megaeth-labs/.github.

inputs:
  stage:
    description: "`propose` (on workflow_dispatch) or `cut` (on the candidate PR merging)."
    required: true
  token:
    description: >-
      Token that authors the PR and creates the branch. Must be a GitHub App
      installation token (e.g. the Maxwell app) so the PR triggers CI; the
      job's GITHUB_TOKEN does not.
    required: true
  version:
    description: "Version to release, X.Y.Z or vX.Y.Z. Required for `propose`."
    required: false
    default: ""
  base_commit:
    description: >-
      The commit to release, for `propose`, when it must not be the tip of the
      default branch. Any commit-ish the checkout can resolve (a full SHA, a
      tag, `origin/main~3`), and it must be reachable from the default branch
      — a release still ships code that went through trunk. Empty (the
      default) is the trunk-first flow: the candidate PR merges into the
      default branch and `cut` creates the release branch at that merge commit.
      Set, `propose` creates the release branch at this commit and opens the
      candidate PR against that branch, because merging it into the default
      branch would take the commits this release is leaving out; the default
      branch is then untouched and `cut` never runs. The version must still be
      newer than the newest `v*` tag in the repository.
    required: false
    default: ""
  version_file:
    description: "File holding the version (VERSION, Cargo.toml, pyproject.toml, package.json)."
    required: true
  version_pattern:
    description: "How the version is stored in `version_file`: plain, toml or json."
    required: false
    default: plain
  bump_command:
    description: >-
      Optional shell command run after `version_file` is rewritten, for
      anything else that must move with the version: lockfiles
      (`cargo update --workspace`), path-dependency versions, generated
      files. Runs with `OLD_VERSION` and `NEW_VERSION` in the environment,
      in the repository root, under `bash -euo pipefail`. Whatever it
      changes is committed with the bump. Install any toolchain it needs in
      the calling job before this action.
    required: false
    default: ""
  release_branch_prefix:
    description: "Release branch name prefix; the branch is `<prefix>X.Y.Z`."
    required: false
    default: release-v
  changelog_file:
    description: >-
      Changelog to draft into (Keep-a-Changelog style, newest first). Empty
      disables changelog handling.
    required: false
    default: CHANGELOG.md
  pr_labels:
    description: "Comma-separated labels for the candidate PR."
    required: false
    default: ""
  pr_author:
    description: >-
      Login the candidate PR must have been opened by for `cut` to proceed —
      the app identity `propose` runs under. Stops a hand-made
      `chore/release-candidate-*` branch from driving the cut. Empty disables
      the check.
    required: false
    default: "mega-maxwell[bot]"
  git_user_name:
    description: "Committer identity for the bump commit."
    required: false
    default: "mega-maxwell[bot]"
  git_user_email:
    description: "Committer email for the commits this action makes."
    required: false
    default: "290560214+mega-maxwell[bot]@users.noreply.github.com"

outputs:
  version:
    description: Normalised X.Y.Z.
    value: ${{ steps.version.outputs.version }}
  pr_url:
    description: "`propose`: URL of the candidate PR."
    value: ${{ steps.pr.outputs.pull-request-url }}
  release_branch:
    description: "The release branch: created by `cut`, or by `propose` when `base_commit` is set."
    value: ${{ steps.cut.outputs.release_branch || steps.branch.outputs.release_branch }}
  base_commit:
    description: "`propose` with `base_commit`: that commit-ish resolved to a full SHA."
    value: ${{ steps.guard.outputs.base }}

runs:
  using: composite
  steps:
    - name: Resolve version
      id: version
      shell: bash
      env:
        STAGE: ${{ inputs.stage }}
        INPUT_VERSION: ${{ inputs.version }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        TOOLS: ${{ github.action_path }}/../release-tools/release_tools.py
      run: |
        set -euo pipefail
        case "$STAGE" in
          propose) raw="$INPUT_VERSION" ;;
          cut)     raw="${HEAD_REF#chore/release-candidate-}" ;;
          *) echo "::error::stage must be propose or cut, got '$STAGE'"; exit 1 ;;
        esac
        version="$(python3 "$TOOLS" normalize "$raw")"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "release version: $version"

    - name: Configure git auth
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        NAME: ${{ inputs.git_user_name }}
        EMAIL: ${{ inputs.git_user_email }}
      run: |
        set -euo pipefail
        git config user.name "$NAME"
        git config user.email "$EMAIL"
        # Same mechanism actions/checkout uses, scoped to this clone and
        # removed in the last step. Drop any header a persisted checkout left
        # behind first: git sends every configured extraheader, and two
        # Authorization headers get a 400.
        git config --unset-all "http.https://github.com/.extraheader" || true
        auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
        # The token itself is masked by create-github-app-token; its base64
        # form is not, so mask it too before it can reach a log.
        echo "::add-mask::$auth"
        git config "http.https://github.com/.extraheader" "AUTHORIZATION: basic $auth"

    # ---------------------------------------------------------------- propose
    - name: Guard (propose)
      if: inputs.stage == 'propose'
      id: guard
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ steps.version.outputs.version }}
        PREFIX: ${{ inputs.release_branch_prefix }}
        BASE_COMMIT: ${{ inputs.base_commit }}
        TOOLS: ${{ github.action_path }}/../release-tools/release_tools.py
      run: |
        set -euo pipefail
        default="$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef -q .defaultBranchRef.name)"
        if [[ "$GITHUB_REF_NAME" != "$default" ]]; then
          echo "::error::release candidates start from the default branch ($default); this run is on $GITHUB_REF_NAME"
          exit 1
        fi
        git fetch --quiet --tags origin
        latest="$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)"
        if ! python3 "$TOOLS" is-greater "$VERSION" "$latest"; then
          echo "::error::$VERSION is not newer than the latest tag ${latest:-<none>}"
          exit 1
        fi
        if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
          echo "::error::tag v$VERSION already exists"; exit 1
        fi
        branch="${PREFIX}${VERSION}"
        # An explicit commit is the release. Resolve it here so everything
        # downstream works on a full SHA, and refuse anything the default
        # branch cannot reach: a release ships code that went through trunk.
        base=""
        if [[ -n "$BASE_COMMIT" ]]; then
          git fetch --quiet origin "+refs/heads/$default:refs/remotes/origin/$default"
          base="$(git rev-parse --verify --quiet "${BASE_COMMIT}^{commit}" || true)"
          if [[ -z "$base" ]]; then
            echo "::error::base_commit $BASE_COMMIT is not a commit in this checkout; check the repository out with fetch-depth: 0"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$base" "origin/$default"; then
            echo "::error::base_commit $base is not reachable from the default branch ($default); a release must ship code that landed on trunk"
            exit 1
          fi
          echo "base commit: $BASE_COMMIT -> $base"
        fi
        # The release branch must not exist yet. One exception: with an
        # explicit commit, propose creates that branch before it opens the PR,
        # so a re-dispatch after a failed attempt finds its own branch still
        # sitting on the requested commit, with nothing merged into it.
        existing="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
        if [[ -n "$existing" ]]; then
          if [[ -n "$base" && "$existing" == "$base" ]]; then
            echo "::notice title=Reusing the release branch::$branch already exists at $base, from an earlier attempt at this candidate"
          else
            echo "::error::branch $branch already exists"; exit 1
          fi
        fi
        {
          echo "base=$base"
          echo "branch=$branch"
        } >> "$GITHUB_OUTPUT"

    # With an explicit base commit the candidate PR cannot target the default
    # branch: merging it there would take the commits this release is
    # deliberately leaving out. So the release branch is cut here instead of at
    # `cut`, and the PR targets it. Checking it out also means the bump and the
    # changelog below are drafted over what this release contains.
    - name: Cut the release branch at the base commit (propose)
      if: inputs.stage == 'propose' && inputs.base_commit != ''
      id: branch
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BRANCH: ${{ steps.guard.outputs.branch }}
        BASE: ${{ steps.guard.outputs.base }}
      run: |
        set -euo pipefail
        if ! git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null; then
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$BASE" >/dev/null
          echo "created $BRANCH at $BASE"
        fi
        git checkout --quiet -B "$BRANCH" "$BASE"
        echo "release_branch=$BRANCH" >> "$GITHUB_OUTPUT"
        echo "candidate PR will target $BRANCH"

    - name: Bump version file
      if: inputs.stage == 'propose'
      id: bump
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
        FILE: ${{ inputs.version_file }}
        PATTERN: ${{ inputs.version_pattern }}
        TOOLS: ${{ github.action_path }}/../release-tools/release_tools.py
      run: |
        set -euo pipefail
        old="$(python3 "$TOOLS" bump-file "$FILE" "$PATTERN" "$VERSION")"
        echo "old=$old" >> "$GITHUB_OUTPUT"
        echo "$FILE: $old -> $VERSION"
        git diff --stat

    - name: Run bump command
      if: inputs.stage == 'propose' && inputs.bump_command != ''
      shell: bash
      env:
        OLD_VERSION: ${{ steps.bump.outputs.old }}
        NEW_VERSION: ${{ steps.version.outputs.version }}
        BUMP_COMMAND: ${{ inputs.bump_command }}
        FILE: ${{ inputs.version_file }}
        PATTERN: ${{ inputs.version_pattern }}
        TOOLS: ${{ github.action_path }}/../release-tools/release_tools.py
      run: |
        set -euo pipefail
        echo "bump command: $BUMP_COMMAND"
        bash -euo pipefail -c "$BUMP_COMMAND"
        # The command must not undo the version-file rewrite.
        actual="$(python3 "$TOOLS" read-file "$FILE" "$PATTERN")"
        if [[ "$actual" != "$NEW_VERSION" ]]; then
          echo "::error::after bump_command, $FILE reads $actual, expected $NEW_VERSION"; exit 1
        fi
        git diff --stat

    - name: Draft changelog
      if: inputs.stage == 'propose' && inputs.changelog_file != ''
      id: changelog
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
        CHANGELOG: ${{ inputs.changelog_file }}
        TOOLS: ${{ github.action_path }}/../release-tools/release_tools.py
      run: |
        set -euo pipefail
        latest="$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)"
        # 1. Sync the previous release's entry from its tag. Settle stamped
        #    the date (and any drift) on the release branch and nothing
        #    back-merges it: this PR is where the default branch catches up.
        synced="none"
        if [[ -n "$latest" ]] && git show "$latest:$CHANGELOG" > "$RUNNER_TEMP/changelog-$latest.md" 2>/dev/null; then
          synced="$(python3 "$TOOLS" changelog-copy "$RUNNER_TEMP/changelog-$latest.md" "$CHANGELOG" "$latest")"
        fi
        # 2. Draft this release's entry from the commits since that tag. The
        #    heading carries the version only; settle stamps the date.
        range="HEAD"
        [[ -n "$latest" ]] && range="$latest..HEAD"
        notes="$RUNNER_TEMP/release-notes-v$VERSION.md"
        git log --no-merges --format='%H%x09%s' "$range" \
          | python3 "$TOOLS" notes "$GITHUB_REPOSITORY" "$VERSION" "" > "$notes"
        drafted="$(python3 "$TOOLS" changelog-insert "$CHANGELOG" "$VERSION" "$notes")"
        {
          echo "synced=$synced"
          echo "drafted=$drafted"
        } >> "$GITHUB_OUTPUT"
        echo "changelog: previous entry ${latest:-<none>} $synced; v$VERSION entry $drafted"
        git diff --stat

    # create-pull-request authenticates its own push with the token input;
    # hand it a clone without our header so the two never overlap.
    - name: Remove git auth before opening the PR
      if: inputs.stage == 'propose'
      shell: bash
      run: git config --unset-all "http.https://github.com/.extraheader" || true

    - name: Drop a stale candidate branch
      if: inputs.stage == 'propose'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        set -euo pipefail
        head="chore/release-candidate-$VERSION"
        # A previous candidate for this version whose PR is closed/merged may
        # have left its branch behind (repos without "auto-delete head
        # branches"). create-pull-request would force-push it, which a
        # no-force-push ruleset rejects. Remove it unless a PR is still open.
        if git ls-remote --exit-code --heads origin "refs/heads/$head" >/dev/null; then
          open="$(gh pr list --head "$head" --state open --json number -q 'length')"
          if [[ "$open" == "0" ]]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$head" >/dev/null
            echo "deleted stale branch $head (no open PR)"
          else
            echo "$head has an open PR; it will be updated"
          fi
        fi

    - name: Open candidate PR
      if: inputs.stage == 'propose'
      id: pr
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
      with:
        token: ${{ inputs.token }}
        branch: chore/release-candidate-${{ steps.version.outputs.version }}
        # Empty means the branch this job checked out, i.e. the default
        # branch; set, it is the release branch cut above.
        base: ${{ steps.branch.outputs.release_branch }}
        delete-branch: true
        commit-message: "chore(release): candidate v${{ steps.version.outputs.version }}"
        committer: "${{ inputs.git_user_name }} <${{ inputs.git_user_email }}>"
        author: "${{ inputs.git_user_name }} <${{ inputs.git_user_email }}>"
        title: "chore(release): candidate v${{ steps.version.outputs.version }}"
        labels: ${{ inputs.pr_labels }}
        body: |
          Release candidate **v${{ steps.version.outputs.version }}** (was ${{ steps.bump.outputs.old }}).

          ${{ steps.branch.outputs.release_branch && format('Cut from `{0}`, which is not the tip of the default branch: `{1}` already exists at that commit, and merging this PR puts the version bump and the changelog entry on it. The default branch is left untouched — the next candidate syncs this entry back from the tag.', steps.guard.outputs.base, steps.branch.outputs.release_branch) || format('Merging this PR creates the release branch `{0}{1}` at the merge commit.', inputs.release_branch_prefix, steps.version.outputs.version) }}

          It creates **no tag**; the tag is cut once, at settlement, by `release-settle` → `release-publish`.

          Changelog: this release's entry drafted under `## v${{ steps.version.outputs.version }}` (settle stamps the date on the release branch);
          previous release's entry synced from its tag: ${{ steps.changelog.outputs.synced || 'n/a' }}.

          <!-- release-candidate: v${{ steps.version.outputs.version }} -->

    # -------------------------------------------------------------------- cut
    - name: Cut release branch
      if: inputs.stage == 'cut'
      id: cut
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ steps.version.outputs.version }}
        PREFIX: ${{ inputs.release_branch_prefix }}
        FILE: ${{ inputs.version_file }}
        PATTERN: ${{ inputs.version_pattern }}
        MERGED: ${{ github.event.pull_request.merged }}
        MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        EXPECTED_AUTHOR: ${{ inputs.pr_author }}
        TOOLS: ${{ github.action_path }}/../release-tools/release_tools.py
      run: |
        set -euo pipefail
        if [[ "$MERGED" != "true" || -z "$MERGE_SHA" ]]; then
          echo "::error::cut runs on a merged candidate PR (pull_request closed, merged == true)"; exit 1
        fi
        if [[ -n "$EXPECTED_AUTHOR" && "$PR_AUTHOR" != "$EXPECTED_AUTHOR" ]]; then
          echo "::error::candidate PR #$PR_NUMBER was opened by '$PR_AUTHOR', not by '$EXPECTED_AUTHOR' (the identity propose runs under); refusing to cut a release branch from it"; exit 1
        fi
        git fetch --quiet origin "$MERGE_SHA"
        actual="$(git show "$MERGE_SHA:$FILE" | python3 "$TOOLS" read-file /dev/stdin "$PATTERN")"
        if [[ "$actual" != "$VERSION" ]]; then
          echo "::error::$FILE at $MERGE_SHA says $actual, expected $VERSION"; exit 1
        fi
        branch="${PREFIX}${VERSION}"
        # A candidate that targeted the release branch was proposed with an
        # explicit base commit: propose already cut the branch there, this
        # merge landed the bump on it, and there is nothing left to create.
        if [[ "$BASE_REF" == "$branch" ]]; then
          echo "release_branch=$branch" >> "$GITHUB_OUTPUT"
          echo "::notice title=Release branch already cut::$branch was created by propose at the requested base commit and this candidate merged into it"
          exit 0
        fi
        if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
          echo "::error::branch $branch already exists"; exit 1
        fi
        gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$branch" -f sha="$MERGE_SHA" >/dev/null
        echo "release_branch=$branch" >> "$GITHUB_OUTPUT"
        echo "created $branch at $MERGE_SHA"

    - name: Remove git auth
      if: always()
      shell: bash
      run: git config --unset-all "http.https://github.com/.extraheader" || true
