name: Release Candidate
description: >-
  Start a release (trunk-first). `stage: propose` bumps the version file on the
  default branch, drafts this release's undated changelog entry from the
  commits since the previous tag, syncs the previous release's entry from its
  tag, and opens a `chore/release-candidate-X.Y.Z` PR. `stage: refresh`
  merges an open candidate PR's own base into its head and re-drafts the
  changelog without rewriting history; any push requires renewed approval.
  `stage: cut`,
  run on the push that merged that PR (the consumer passes the `commit` and
  `pr_number` outputs of `release-route`), re-reads the PR through the API,
  refuses anything but a merged, gutenberg-authored candidate into the default
  branch, and creates `release-vX.Y.Z` at the merge commit (a retry that
  finds it already there is a no-op; at any other commit it refuses). No tag
  is created at any stage — tags come from release-publish, once, at
  settlement. `base_commit` releases a commit that is not the tip of the
  default branch: `propose` cuts the release branch there itself, carries the
  default branch's release workflows onto it, and points the candidate PR at
  it; that PR merges into the release branch, so `cut` never runs for it. Run
  as a step in a job the consumer owns; the organization-level
  `MEGA_GUTENBERG_CLIENT_ID` and `MEGA_GUTENBERG_PK` provide the app
  credentials. The one-reviewer `release` environment gates only tagging,
  Release creation and artifact upload. The consumer checks the repository
  out first (`fetch-depth: 0`,
  `persist-credentials: false`).
  Guide: .github/actions/RELEASE.md in megaeth-labs/.github.

inputs:
  stage:
    description: "`propose` (on workflow_dispatch), `refresh` (an open candidate), or `cut` (on the candidate PR merging)."
    required: true
  token:
    description: >-
      mega-gutenberg installation token (contents, pull-requests, workflows
      write) from organization-level `MEGA_GUTENBERG_CLIENT_ID` and
      `MEGA_GUTENBERG_PK`; it pushes the candidate branch, opens the PR
      (so CI runs) and creates the release branch. The one-reviewer `release`
      environment gates only tagging, Release creation and artifact upload.
    required: true
  dependency_token:
    description: >-
      Read-only token for bump_command's private dependencies. Required when
      bump_command is set; it never falls back to token, so the command does
      not run with the release token.
    required: false
    default: ""
  commit:
    description: >-
      The merge commit of the candidate PR (the `commit` output of
      `release-route`). Required for `cut`; the release branch is created at it.
    required: false
    default: ""
  pr_number:
    description: >-
      The candidate PR number (the `pr_number` output of `release-route`).
      Required for `cut`; the PR is re-read through the API, not trusted from
      the event.
    required: false
    default: ""
  release_workflows:
    description: >-
      Newline- or space-separated workflow paths `propose` with `base_commit` copies from
      the default branch onto the old tree (a path absent on the default branch
      is skipped), and it deletes `.github/workflows/release-publish.yml`.
      Workflows run from the pushed ref's tree, so a branch cut at an older
      commit would otherwise run pre-migration release workflows.
    required: false
    default: ".github/workflows/release-settle.yml .github/workflows/on-release.yml"
  version:
    description: "Version to release, X.Y.Z or vX.Y.Z. Required for `propose` and `refresh`."
    required: false
    default: ""
  base_commit:
    description: >-
      The commit to release, for `propose`, when it must not be the tip of the
      default branch. Any commit-ish the checkout can resolve (a full SHA, a
      tag, `origin/main~3`). It must be reachable from the default branch, or
      sit on the latest `v*` release line (from the merge-base with trunk
      through that tag), so a hotfix of the current tag works even though
      settlement left the tag off trunk. Empty (the
      default) is the trunk-first flow: the candidate PR merges into the
      default branch and `cut` creates the release branch at that merge commit.
      Set, `propose` creates the release branch at this commit and opens the
      candidate PR against that branch, because merging it into the default
      branch would take the commits this release is leaving out; the default
      branch is then untouched and `cut` never runs. The version must still be
      newer than the newest `v*` tag in the repository.
    required: false
    default: ""
  version_file:
    description: "File holding the version (VERSION, Cargo.toml, pyproject.toml, package.json)."
    required: true
  version_pattern:
    description: "How the version is stored in `version_file`: plain, toml or json."
    required: false
    default: plain
  bump_command:
    description: >-
      Optional shell command run after `version_file` is rewritten, for
      anything else that must move with the version: lockfiles
      (`cargo update --workspace`), path-dependency versions, generated
      files. Runs with `OLD_VERSION` and `NEW_VERSION` in the environment,
      in the repository root, under `bash -euo pipefail`. Whatever it
      changes is committed with the bump. Install any toolchain it needs in
      the calling job before this action.
    required: false
    default: ""
  release_branch_prefix:
    description: "Release branch name prefix; the branch is `<prefix>X.Y.Z`."
    required: false
    default: release-v
  changelog_file:
    description: >-
      Changelog to draft into (Keep-a-Changelog style, newest first). Empty
      disables changelog handling.
    required: false
    default: CHANGELOG.md
  pr_labels:
    description: "Comma-separated labels for the candidate PR."
    required: false
    default: ""
  pr_author:
    description: >-
      Login the candidate PR must have been opened by for `cut` or `refresh` to proceed —
      the app identity `propose` runs under. Stops a hand-made
      `chore/release-candidate-*` branch from driving the cut. Empty disables
      the check for `cut`; `refresh` always requires a bot PR and uses
      mega-gutenberg[bot] when empty.
    required: false
    default: "mega-gutenberg[bot]"
  git_user_name:
    description: "Committer identity for the bump commit."
    required: false
    default: "mega-gutenberg[bot]"
  git_user_email:
    description: "Committer email for the commits this action makes."
    required: false
    default: "348780249+mega-gutenberg[bot]@users.noreply.github.com"

outputs:
  version:
    description: Normalised X.Y.Z.
    value: ${{ steps.version.outputs.version }}
  pr_url:
    description: "`propose` or `refresh`: URL of the candidate PR."
    value: ${{ steps.pr.outputs.pr_url || steps.refresh.outputs.pr_url }}
  release_branch:
    description: "The release branch: created by `cut`, or by `propose` when `base_commit` is set."
    value: ${{ steps.cut.outputs.release_branch || steps.branch.outputs.release_branch }}
  base_commit:
    description: "`propose` with `base_commit`: that commit-ish resolved to a full SHA."
    value: ${{ steps.guard.outputs.base }}

runs:
  using: composite
  steps:
    - name: Resolve version
      id: version
      shell: bash
      env:
        STAGE: ${{ inputs.stage }}
        INPUT_VERSION: ${{ inputs.version }}
        PR_NUMBER: ${{ inputs.pr_number }}
        GH_TOKEN: ${{ inputs.token }}
        TOOLS: ${{ github.action_path }}/../release-tools/release_tools.py
      run: |
        set -euo pipefail
        case "$STAGE" in
          propose|refresh) raw="$INPUT_VERSION" ;;
          cut)
            if [[ -z "$PR_NUMBER" ]]; then
              echo "::error::cut needs the pr_number input (the release-route output)"; exit 1
            fi
            head_ref="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" | python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["ref"])')"
            raw="${head_ref#chore/release-candidate-}"
            ;;
          *) echo "::error::stage must be propose, refresh or cut, got '$STAGE'"; exit 1 ;;
        esac
        version="$(python3 "$TOOLS" normalize "$raw")"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "release version: $version"

    - name: Configure git identity
      shell: bash
      env:
        NAME: ${{ inputs.git_user_name }}
        EMAIL: ${{ inputs.git_user_email }}
      run: |
        git config user.name "$NAME"
        git config user.email "$EMAIL"

    # ---------------------------------------------------------------- propose
    - name: Guard (propose)
      if: inputs.stage == 'propose'
      id: guard
      shell: bash
      env:
        AUTH_WRAPPER: ${{ github.action_path }}/../git-auth/with-github-auth.sh
        GITHUB_AUTH_TOKEN: ${{ inputs.token }}
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ steps.version.outputs.version }}
        PREFIX: ${{ inputs.release_branch_prefix }}
        BASE_COMMIT: ${{ inputs.base_commit }}
        TOOLS: ${{ github.action_path }}/../release-tools/release_tools.py
      run: |
        "$AUTH_WRAPPER" bash --noprofile --norc -e -o pipefail <<'GITHUB_AUTH_COMMAND'
        set -euo pipefail
        default="$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef -q .defaultBranchRef.name)"
        if [[ "$GITHUB_REF_NAME" != "$default" ]]; then
          echo "::error::release candidates start from the default branch ($default); this run is on $GITHUB_REF_NAME"
          exit 1
        fi
        git fetch --quiet --tags origin
        latest="$(git tag -l 'v*' | python3 "$TOOLS" latest-tag)"
        if ! python3 "$TOOLS" is-greater "$VERSION" "$latest"; then
          echo "::error::$VERSION is not newer than the latest tag ${latest:-<none>}"
          exit 1
        fi
        if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
          echo "::error::tag v$VERSION already exists"; exit 1
        fi
        branch="${PREFIX}${VERSION}"
        # An explicit commit is the release. Resolve it here so everything
        # downstream works on a full SHA, and refuse anything the default
        # branch cannot reach: a release ships code that went through trunk.
        base=""
        if [[ -n "$BASE_COMMIT" ]]; then
          git fetch --quiet origin "+refs/heads/$default:refs/remotes/origin/$default"
          base="$(git rev-parse --verify --quiet "${BASE_COMMIT}^{commit}" || true)"
          if [[ -z "$base" ]]; then
            echo "::error::base_commit $BASE_COMMIT is not a commit in this checkout; check the repository out with fetch-depth: 0"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$base" "origin/$default"; then
            # Settlement leaves the latest tag off trunk (bump + dated
            # changelog). A hotfix of that tag is still the current line,
            # not a random side branch.
            latest="$(git tag -l 'v*' | python3 "$TOOLS" latest-tag)"
            on_release_line=0
            if [[ -n "$latest" ]]; then
              latest_sha="$(git rev-parse --verify --quiet "${latest}^{commit}" || true)"
              if [[ -n "$latest_sha" ]]; then
                mb="$(git merge-base "$latest_sha" "origin/$default" || true)"
                if [[ -n "$mb" ]] \
                  && git merge-base --is-ancestor "$mb" "$base" \
                  && git merge-base --is-ancestor "$base" "$latest_sha"; then
                  on_release_line=1
                fi
              fi
            fi
            if [[ "$on_release_line" -ne 1 ]]; then
              echo "::error::base_commit $base is not reachable from the default branch ($default); a release must ship code that landed on trunk"
              exit 1
            fi
            echo "base commit $base is on the latest release line (${latest}), not on $default"
          fi
          echo "base commit: $BASE_COMMIT -> $base"
        fi
        # The release branch must not exist yet, except with an explicit
        # commit: propose creates it, so a re-dispatch may find it still on
        # that commit, or already ahead with hotfix PRs. Sit on the tip in
        # that case (do not reset to base_commit). A branch that does not
        # contain base_commit is someone else's and is refused.
        existing="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
        checkout="$base"
        if [[ -n "$existing" ]]; then
          if [[ -z "$base" ]]; then
            echo "::error::branch $branch already exists: v$VERSION was already cut from its merged candidate, so there is nothing left to propose; settle it from $branch"; exit 1
          fi
          git fetch --quiet origin "+refs/heads/$branch:refs/remotes/origin/$branch"
          if [[ "$existing" == "$base" ]]; then
            echo "::notice title=Reusing the release branch::$branch already exists at $base, from an earlier attempt at this candidate"
          elif git merge-base --is-ancestor "$base" "$existing"; then
            echo "::notice title=Reusing the release branch::$branch already has commits on top of $base; proposing from $existing"
            checkout="$existing"
          else
            echo "::error::branch $branch already exists at $existing, which does not contain base_commit $base"
            exit 1
          fi
        fi
        {
          echo "base=$base"
          echo "branch=$branch"
          echo "checkout=$checkout"
        } >> "$GITHUB_OUTPUT"
        GITHUB_AUTH_COMMAND

    # With an explicit base commit the candidate PR cannot target the default
    # branch: merging it there would take the commits this release is
    # deliberately leaving out. So the release branch is cut here instead of at
    # `cut`, and the PR targets it. Checking it out also means the bump and the
    # changelog below are drafted over what this release contains.

    - name: Cut the release branch at the base commit (propose)
      if: inputs.stage == 'propose' && inputs.base_commit != ''
      id: branch
      shell: bash
      env:
        AUTH_WRAPPER: ${{ github.action_path }}/../git-auth/with-github-auth.sh
        GITHUB_AUTH_TOKEN: ${{ inputs.token }}
        GH_TOKEN: ${{ inputs.token }}
        BRANCH: ${{ steps.guard.outputs.branch }}
        BASE: ${{ steps.guard.outputs.base }}
        CHECKOUT: ${{ steps.guard.outputs.checkout }}
      run: |
        "$AUTH_WRAPPER" bash --noprofile --norc -e -o pipefail <<'GITHUB_AUTH_COMMAND'
        set -euo pipefail
        checkout="${CHECKOUT:-$BASE}"
        if ! git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null; then
          if gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$checkout" >/dev/null; then
            echo "created $BRANCH at $checkout"
          else
            # Lost a race to a concurrent propose: only the same commit is ours.
            raced="$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)"
            if [[ "$raced" != "$checkout" ]]; then
              echo "::error::could not create $BRANCH at $checkout (it is now at '${raced:-<absent>}')"; exit 1
            fi
            echo "::notice title=Reusing the release branch::$BRANCH was created at $checkout by a concurrent run"
          fi
        fi
        git fetch --quiet origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
        git checkout --quiet -B "$BRANCH" "$checkout"
        echo "release_branch=$BRANCH" >> "$GITHUB_OUTPUT"
        echo "candidate PR will target $BRANCH at $checkout"
        GITHUB_AUTH_COMMAND

    # Workflows run from the pushed ref's tree, so a release branch cut at an
    # older base commit would run pre-migration release workflows, and the tag
    # cut from it would carry a pre-migration on-release.yml. The candidate
    # commit carries the default branch's copies, so merging it into the
    # release branch migrates the branch.

    - name: Carry the release workflows (propose)
      if: inputs.stage == 'propose' && inputs.base_commit != ''
      shell: bash
      env:
        AUTH_WRAPPER: ${{ github.action_path }}/../git-auth/with-github-auth.sh
        GITHUB_AUTH_TOKEN: ${{ inputs.token }}
        GH_TOKEN: ${{ inputs.token }}
        RELEASE_WORKFLOWS: ${{ inputs.release_workflows }}
      run: |
        "$AUTH_WRAPPER" bash --noprofile --norc -e -o pipefail <<'GITHUB_AUTH_COMMAND'
        set -euo pipefail
        default="$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef -q .defaultBranchRef.name)"
        git fetch --quiet origin "+refs/heads/$default:refs/remotes/origin/$default"
        set -f
        for path in $RELEASE_WORKFLOWS; do
          if git cat-file -e "origin/$default:$path" 2>/dev/null; then
            git checkout --quiet "origin/$default" -- "$path"
            echo "carried $path from $default"
          else
            echo "skipped $path: not on $default"
          fi
        done
        set +f
        if [[ -e .github/workflows/release-publish.yml ]]; then
          git rm --quiet -f .github/workflows/release-publish.yml
          echo "deleted .github/workflows/release-publish.yml"
        fi
        git status --short
        GITHUB_AUTH_COMMAND

    - name: Bump version file
      if: inputs.stage == 'propose'
      id: bump
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
        FILE: ${{ inputs.version_file }}
        PATTERN: ${{ inputs.version_pattern }}
        TOOLS: ${{ github.action_path }}/../release-tools/release_tools.py
      run: |
        set -euo pipefail
        old="$(python3 "$TOOLS" read-file "$FILE" "$PATTERN")"
        if [[ "$old" == "$VERSION" ]]; then
          echo "old=$old" >> "$GITHUB_OUTPUT"
          echo "skipped=true" >> "$GITHUB_OUTPUT"
          echo "$FILE already $VERSION; skipping bump"
          exit 0
        fi
        python3 "$TOOLS" bump-file "$FILE" "$PATTERN" "$VERSION" >/dev/null
        echo "old=$old" >> "$GITHUB_OUTPUT"
        echo "skipped=false" >> "$GITHUB_OUTPUT"
        echo "$FILE: $old -> $VERSION"
        git diff --stat

    - name: Run bump command
      if: inputs.stage == 'propose' && inputs.bump_command != '' && steps.bump.outputs.skipped != 'true'
      shell: bash
      env:
        AUTH_WRAPPER: ${{ github.action_path }}/../git-auth/with-github-auth.sh
        GITHUB_AUTH_TOKEN: ${{ inputs.dependency_token }}
        DEPENDENCY_TOKEN: ${{ inputs.dependency_token }}
        OLD_VERSION: ${{ steps.bump.outputs.old }}
        NEW_VERSION: ${{ steps.version.outputs.version }}
        BUMP_COMMAND: ${{ inputs.bump_command }}
        FILE: ${{ inputs.version_file }}
        PATTERN: ${{ inputs.version_pattern }}
        TOOLS: ${{ github.action_path }}/../release-tools/release_tools.py
      run: |
        if [[ -z "$DEPENDENCY_TOKEN" ]]; then
          echo "::error::bump_command needs a separate dependency_token, so the command never runs with the release token"
          exit 1
        fi
        "$AUTH_WRAPPER" bash --noprofile --norc -e -o pipefail <<'GITHUB_AUTH_COMMAND'
        set -euo pipefail
        echo "bump command: $BUMP_COMMAND"
        bash -euo pipefail -c "$BUMP_COMMAND"
        # The command must not undo the version-file rewrite.
        actual="$(python3 "$TOOLS" read-file "$FILE" "$PATTERN")"
        if [[ "$actual" != "$NEW_VERSION" ]]; then
          echo "::error::after bump_command, $FILE reads $actual, expected $NEW_VERSION"; exit 1
        fi
        git diff --stat
        GITHUB_AUTH_COMMAND

    # Refresh keeps the existing PR and head history, unlike a new proposal.
    # Validate ownership and the unpublished version before touching the tree.
    - name: Prepare candidate refresh
      if: inputs.stage == 'refresh'
      id: refresh
      shell: bash
      env:
        AUTH_WRAPPER: ${{ github.action_path }}/../git-auth/with-github-auth.sh
        GITHUB_AUTH_TOKEN: ${{ inputs.token }}
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ steps.version.outputs.version }}
        EXPECTED_AUTHOR: ${{ inputs.pr_author }}
      run: |
        "$AUTH_WRAPPER" bash --noprofile --norc -e -o pipefail <<'GITHUB_AUTH_COMMAND'
        set -euo pipefail
        head="chore/release-candidate-$VERSION"
        prs="$(gh pr list --head "$head" --state open --json number,isCrossRepository \
          | python3 -c 'import json,sys; print("\n".join(str(p["number"]) for p in json.load(sys.stdin) if not p.get("isCrossRepository")))')"
        if [[ -z "$prs" || "$prs" == *$'\n'* ]]; then
          echo "::error::refresh needs exactly one open candidate PR for v$VERSION"; exit 1
        fi
        pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$prs")"
        pr_field() { python3 -c 'import functools,json,sys; v=functools.reduce(lambda d,k: d.get(k) if isinstance(d,dict) else None, sys.argv[1].split("."), json.load(sys.stdin)); print("" if v is None else v)' "$1" <<< "$pr_json"; }
        author="${EXPECTED_AUTHOR:-mega-gutenberg[bot]}"
        if [[ "$(pr_field state)" != "open" || "$(pr_field head.ref)" != "$head" \
          || "$(pr_field head.repo.full_name)" != "$GITHUB_REPOSITORY" \
          || "$(pr_field user.login)" != "$author" || "$(pr_field user.type)" != "Bot" ]]; then
          echo "::error::refresh requires an open, app-authored candidate PR from this repository ($author)"; exit 1
        fi
        if [[ -n "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]]; then
          echo "::error::tag v$VERSION already exists; refusing to refresh a published version"; exit 1
        fi
        base="$(pr_field base.ref)"
        git fetch --quiet --tags origin \
          "refs/heads/$head:refs/remotes/origin/$head" \
          "refs/heads/$base:refs/remotes/origin/$base"
        original="$(git rev-parse "origin/$head")"
        git checkout --quiet --detach "$original"
        git merge "origin/$base" --no-edit
        {
          echo "head=$head"
          echo "original=$original"
          echo "pr_url=$(pr_field html_url)"
        } >> "$GITHUB_OUTPUT"
        GITHUB_AUTH_COMMAND

    - name: Draft changelog
      if: inputs.changelog_file != '' && (inputs.stage == 'refresh' || (inputs.stage == 'propose' && steps.bump.outputs.skipped != 'true'))
      id: changelog
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
        CHANGELOG: ${{ inputs.changelog_file }}
        TOOLS: ${{ github.action_path }}/../release-tools/release_tools.py
      run: |
        set -euo pipefail
        latest="$(git tag -l 'v*' | python3 "$TOOLS" latest-tag)"
        # 1. Sync the previous release's entry verbatim from its tag:
        #    this PR is where the default branch catches up.
        synced="none"
        if [[ -n "$latest" ]] && git show "$latest:$CHANGELOG" > "$RUNNER_TEMP/changelog-$latest.md" 2>/dev/null; then
          synced="$(python3 "$TOOLS" changelog-copy "$RUNNER_TEMP/changelog-$latest.md" "$CHANGELOG" "$latest")"
        fi
        # 2. Draft this release's entry from the commits since that tag. The
        #    heading carries the version only and remains undated.
        range="HEAD"
        [[ -n "$latest" ]] && range="$latest..HEAD"
        notes="$RUNNER_TEMP/release-notes-v$VERSION.md"
        git log --no-merges --format='%H%x09%s' "$range" \
          | python3 "$TOOLS" notes "$GITHUB_REPOSITORY" "$VERSION" "" > "$notes"
        drafted="$(python3 "$TOOLS" changelog-insert "$CHANGELOG" "$VERSION" "$notes")"
        {
          echo "synced=$synced"
          echo "drafted=$drafted"
        } >> "$GITHUB_OUTPUT"
        echo "changelog: previous entry ${latest:-<none>} $synced; v$VERSION entry $drafted"
        git diff --stat

    - name: Push candidate refresh
      if: inputs.stage == 'refresh'
      shell: bash
      env:
        AUTH_WRAPPER: ${{ github.action_path }}/../git-auth/with-github-auth.sh
        GITHUB_AUTH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ steps.version.outputs.version }}
        CHANGELOG: ${{ inputs.changelog_file }}
        HEAD_REF: ${{ steps.refresh.outputs.head }}
        ORIGINAL: ${{ steps.refresh.outputs.original }}
      run: |
        "$AUTH_WRAPPER" bash --noprofile --norc -e -o pipefail <<'GITHUB_AUTH_COMMAND'
        set -euo pipefail
        if [[ -n "$CHANGELOG" ]]; then
          git add -- "$CHANGELOG"
          if ! git diff --cached --quiet; then
            git commit --quiet -m "chore(release): refresh candidate v$VERSION"
          fi
        fi
        if [[ "$(git rev-parse HEAD)" != "$ORIGINAL" ]]; then
          git push --quiet origin "HEAD:refs/heads/$HEAD_REF"
          echo "refreshed $HEAD_REF; the candidate PR must be re-approved after this push"
        else
          echo "candidate v$VERSION is already current; nothing pushed"
        fi
        GITHUB_AUTH_COMMAND

    # The candidate branch is never rewritten. A re-dispatch supersedes the
    # open candidate instead: it closes that PR with a comment, deletes the
    # branch, pushes a fresh one as a new ref and opens a fresh PR, so this
    # works under a ruleset that bans force pushes on every branch. Each state
    # a retry or a concurrent run can leave behind (a PR already closed, a ref
    # already gone, a branch or PR another run created first) converges to
    # one branch and one open PR.
    - name: Open candidate PR
      if: inputs.stage == 'propose'
      id: pr
      shell: bash
      env:
        AUTH_WRAPPER: ${{ github.action_path }}/../git-auth/with-github-auth.sh
        GITHUB_AUTH_TOKEN: ${{ inputs.token }}
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ steps.version.outputs.version }}
        OLD_VERSION: ${{ steps.bump.outputs.old }}
        # Empty means the branch this job checked out, i.e. the default
        # branch; set, it is the release branch cut above.
        RELEASE_BRANCH: ${{ steps.branch.outputs.release_branch }}
        BASE_COMMIT: ${{ steps.guard.outputs.base }}
        PREFIX: ${{ inputs.release_branch_prefix }}
        SYNCED: ${{ steps.changelog.outputs.synced || 'n/a' }}
        PR_LABELS: ${{ inputs.pr_labels }}
        GIT_AUTHOR_NAME: ${{ inputs.git_user_name }}
        GIT_AUTHOR_EMAIL: ${{ inputs.git_user_email }}
        GIT_COMMITTER_NAME: ${{ inputs.git_user_name }}
        GIT_COMMITTER_EMAIL: ${{ inputs.git_user_email }}
      run: |
        "$AUTH_WRAPPER" bash --noprofile --norc -e -o pipefail <<'GITHUB_AUTH_COMMAND'
        set -euo pipefail
        head="chore/release-candidate-$VERSION"
        title="chore(release): candidate v$VERSION"
        default="$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef -q .defaultBranchRef.name)"
        base="${RELEASE_BRANCH:-$default}"
        # Open PRs from this repository's $head, as "number<TAB>url" lines.
        open_prs() {
          gh pr list --head "$head" --state open --json number,url,isCrossRepository \
            | python3 -c 'import json,sys; [print(p["number"], p["url"], sep="\t") for p in json.load(sys.stdin) if not p.get("isCrossRepository")]'
        }
        remote_head() { git ls-remote --heads origin "refs/heads/$head" | cut -f1; }

        # 1. The candidate commit, local only until the old candidate is gone.
        git checkout --quiet -B "$head"
        git add -A
        if git diff --cached --quiet; then
          echo "::notice title=Nothing to propose::$base already carries v$VERSION; no candidate PR opened, nothing pushed"
          echo "pr_url=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git commit --quiet -m "$title"
        candidate="$(git rev-parse HEAD)"
        echo "candidate commit $candidate on $(git rev-parse HEAD~1)"

        # 2. Close every open candidate PR for this version. One a concurrent
        #    run or a retry closed first is already where this wants it.
        open_prs > "$RUNNER_TEMP/candidate-prs.tsv"
        while IFS=$'\t' read -r number url; do
          if gh pr close "$number" --comment "Superseded: a fresh candidate for v$VERSION replaces this PR. Its branch \`$head\` is deleted and pushed again as a new ref, never force-pushed." >/dev/null; then
            echo "closed superseded candidate PR #$number ($url)"
          elif ! open_prs | cut -f1 | grep -qxF "$number"; then
            echo "::notice::candidate PR #$number was already closed"
          else
            echo "::error::could not close the open candidate PR #$number ($url)"; exit 1
          fi
        done < "$RUNNER_TEMP/candidate-prs.tsv"

        # 3. Delete the old branch, so the push below creates a new ref.
        racer=""
        if [[ -n "$(remote_head)" ]]; then
          if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$head" >/dev/null; then
            echo "deleted the old $head"
          elif [[ -z "$(remote_head)" ]]; then
            # 404/422: a retry or a concurrent run already removed it.
            echo "::notice::$head was already deleted"
          elif [[ -n "$(open_prs)" ]]; then
            racer=1
          else
            echo "::error::could not delete $head, and no open PR owns it"; exit 1
          fi
        fi

        # 4. Push it as a new ref: a plain push, which never rewrites one. A
        #    rejection means a concurrent run created $head after the delete;
        #    its branch is then the candidate and this run only makes sure it
        #    has a PR.
        if [[ -z "$racer" ]]; then
          if git push --quiet origin "$candidate:refs/heads/$head"; then
            echo "pushed $head at $candidate as a new ref"
          elif [[ -n "$(remote_head)" ]]; then
            racer=1
          else
            echo "::error::could not push $head"; exit 1
          fi
        fi
        if [[ -n "$racer" ]]; then
          echo "::notice title=Concurrent candidate::$head was created at $(remote_head) by a concurrent run; keeping it rather than replacing it"
        fi

        # 5. One open PR on that branch, opened here or by the concurrent run.
        pr_url="$(open_prs | head -n1 | cut -f2)"
        if [[ -n "$pr_url" ]]; then
          echo "::notice::candidate PR $pr_url was opened by a concurrent run"
        else
          body="$RUNNER_TEMP/candidate-pr-body.md"
          {
            echo "Release candidate **v$VERSION** (was $OLD_VERSION)."
            echo
            if [[ -n "$RELEASE_BRANCH" ]]; then
              echo "Cut from \`$BASE_COMMIT\`, which is not the tip of the default branch: \`$RELEASE_BRANCH\` already exists at that commit, and merging this PR puts the version bump and the changelog entry on it. The default branch is left untouched — the next candidate syncs this entry back from the tag."
            else
              echo "Merging this PR creates the release branch \`$PREFIX$VERSION\` at the merge commit."
            fi
            echo
            echo "It creates **no tag**; the tag is cut once, at settlement, by \`release-settle\` → \`release-publish\`."
            echo
            echo "Changelog: this release's entry is undated under \`## v$VERSION\`; the GitHub Release body is the file's section verbatim."
            echo "previous release's entry synced from its tag: $SYNCED."
            echo
            echo "A refresh pushes a commit and therefore clears approvals under \`require_last_push_approval\`, so the merge must be re-approved afterwards."
            echo
            echo "<!-- release-candidate: v$VERSION -->"
          } > "$body"
          if pr_url="$(gh pr create --base "$base" --head "$head" --title "$title" --body-file "$body")"; then
            echo "opened candidate PR $pr_url"
            labels=()
            IFS=',' read -ra wanted <<<"$PR_LABELS"
            for l in "${wanted[@]}"; do
              l="${l// /}"
              [[ -n "$l" ]] && labels+=(-f "labels[]=$l")
            done
            if [[ "${#labels[@]}" -gt 0 ]]; then
              # The issues API creates a label the repository does not have yet.
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/${pr_url##*/}/labels" "${labels[@]}" >/dev/null
            fi
          else
            pr_url="$(open_prs | head -n1 | cut -f2)"
            [[ -n "$pr_url" ]] || { echo "::error::could not open the candidate PR for $head"; exit 1; }
            echo "::notice::candidate PR $pr_url was opened by a concurrent run"
          fi
        fi
        echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

        # Nothing in this action deletes the branch once the PR merges; say
        # what does, if anything.
        if [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .delete_branch_on_merge 2>/dev/null || true)" == "true" ]]; then
          echo "$head is deleted when the PR merges, by the repository's 'Automatically delete head branches' setting"
        else
          echo "::notice::$head stays after the PR merges: 'Automatically delete head branches' is off (or not visible to this token). It is never reused; a later propose of v$VERSION deletes it before pushing."
        fi
        GITHUB_AUTH_COMMAND

    # -------------------------------------------------------------------- cut
    - name: Cut release branch
      if: inputs.stage == 'cut'
      id: cut
      shell: bash
      env:
        AUTH_WRAPPER: ${{ github.action_path }}/../git-auth/with-github-auth.sh
        GITHUB_AUTH_TOKEN: ${{ inputs.token }}
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ steps.version.outputs.version }}
        PREFIX: ${{ inputs.release_branch_prefix }}
        FILE: ${{ inputs.version_file }}
        PATTERN: ${{ inputs.version_pattern }}
        COMMIT: ${{ inputs.commit }}
        PR_NUMBER: ${{ inputs.pr_number }}
        EXPECTED_AUTHOR: ${{ inputs.pr_author }}
        TOOLS: ${{ github.action_path }}/../release-tools/release_tools.py
      run: |
        "$AUTH_WRAPPER" bash --noprofile --norc -e -o pipefail <<'GITHUB_AUTH_COMMAND'
        set -euo pipefail
        if [[ -z "$COMMIT" || -z "$PR_NUMBER" ]]; then
          echo "::error::cut needs the commit and pr_number inputs (the release-route outputs)"; exit 1
        fi
        # The PR is re-read through the API: the push event says which commit
        # landed, not whether it was a merged candidate.
        pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
        pr_field() { python3 -c 'import functools,json,sys; v=functools.reduce(lambda d,k: d.get(k) if isinstance(d,dict) else None, sys.argv[1].split("."), json.load(sys.stdin)); print("" if v is None else v)' "$1" <<< "$pr_json"; }
        merged_at="$(pr_field merged_at)"
        merge_sha="$(pr_field merge_commit_sha)"
        head_ref="$(pr_field head.ref)"
        base_ref="$(pr_field base.ref)"
        pr_author="$(pr_field user.login)"
        if [[ -z "$merged_at" ]]; then
          echo "::error::candidate PR #$PR_NUMBER has not been merged; cut only runs for a merged candidate"; exit 1
        fi
        if [[ "$merge_sha" != "$COMMIT" ]]; then
          echo "::error::candidate PR #$PR_NUMBER merged as '$merge_sha', not the pushed commit '$COMMIT'; refusing to cut a release branch at it"; exit 1
        fi
        if [[ "$head_ref" != "chore/release-candidate-"* ]]; then
          echo "::error::PR #$PR_NUMBER head '$head_ref' is not a chore/release-candidate-* branch"; exit 1
        fi
        default="$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef -q .defaultBranchRef.name)"
        if [[ "$base_ref" != "$default" ]]; then
          echo "::error::candidate PR #$PR_NUMBER targets '$base_ref', not the default branch '$default'; a release branch is cut only from a candidate merged into the default branch"; exit 1
        fi
        if [[ -n "$EXPECTED_AUTHOR" && "$pr_author" != "$EXPECTED_AUTHOR" ]]; then
          echo "::error::candidate PR #$PR_NUMBER was opened by '$pr_author', not by '$EXPECTED_AUTHOR' (the identity propose runs under); refusing to cut a release branch from it"; exit 1
        fi
        git fetch --quiet origin "$COMMIT"
        actual="$(git show "$COMMIT:$FILE" | python3 "$TOOLS" read-file /dev/stdin "$PATTERN")"
        if [[ "$actual" != "$VERSION" ]]; then
          echo "::error::$FILE at $COMMIT says $actual, expected $VERSION"; exit 1
        fi
        branch="${PREFIX}${VERSION}"
        # A retry of a cut that already succeeded, or a run that lost the race
        # to create the ref, finds the branch. At this merge commit it is this
        # cut, already done; anywhere else it is not ours and is refused.
        existing="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
        if [[ -z "$existing" ]]; then
          if gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$branch" -f sha="$COMMIT" >/dev/null; then
            echo "created $branch at $COMMIT"
          else
            existing="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
            [[ -n "$existing" ]] || { echo "::error::could not create $branch at $COMMIT"; exit 1; }
          fi
        fi
        if [[ -n "$existing" && "$existing" != "$COMMIT" ]]; then
          echo "::error::branch $branch already exists at $existing, not at the candidate merge commit $COMMIT; refusing to move it"; exit 1
        fi
        if [[ "$existing" == "$COMMIT" ]]; then
          echo "::notice title=Release branch already cut::$branch already exists at $COMMIT (an earlier or concurrent cut of PR #$PR_NUMBER); nothing to do"
        fi
        echo "release_branch=$branch" >> "$GITHUB_OUTPUT"
        GITHUB_AUTH_COMMAND
