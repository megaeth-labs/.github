# Shared, org-wide PR linting.
#
# This is a *reusable* workflow (`on: workflow_call`). Consumer repos call it
# from a thin stub that owns the `pull_request` trigger, e.g.:
#
#   # <consumer>/.github/workflows/pr-lint.yml
#   name: PR Lint
#   on:
#     pull_request:
#       types: [opened, reopened, edited, synchronize]
#     merge_group:
#   jobs:
#     pr-lint:
#       uses: megaeth-labs/.github/.github/workflows/pr-lint.yml@<sha>   # pin to a SHA
#
# Keep this workflow the single source of truth for PR-level lint rules that
# apply across the org. It currently lints the PR title against Conventional
# Commits; additional PR lint jobs (body checks, size limits, etc.) can be added
# here as separate jobs so every consumer picks them up automatically.
name: PR Lint

on:
  workflow_call:
    inputs:
      types:
        description: |
          Newline-separated list of allowed Conventional Commit types for the PR
          title. Defaults to the MegaETH org convention. Override only when a repo
          genuinely needs a different set.
        required: false
        type: string
        default: |
          feat
          fix
          chore
          test
          bench
          perf
          refactor
          docs
          ci
          revert
          deps

permissions:
  pull-requests: read
  contents: read

jobs:
  conventional-title:
    name: Validate PR title is Conventional Commit
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Skip for merge queue
        if: github.event_name == 'merge_group'
        run: echo "Skipping PR title check in merge queue (already validated on PR)"

      - name: Check title
        if: github.event_name == 'pull_request'
        id: lint_pr_title
        uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: ${{ inputs.types }}
        continue-on-error: true

      - name: Add PR Comment for Invalid Title
        if: github.event_name == 'pull_request' && steps.lint_pr_title.outcome == 'failure'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: pr-title-lint-error
          message: |
            Your PR title doesn't follow the Conventional Commit guidelines.

            **Example of valid titles:**
            - `feat: add new user login`
            - `fix: correct button size`
            - `docs: update README`

            **Usage:**
            - `feat`: Introduces a new feature
            - `fix`: Patches a bug
            - `chore`: General maintenance tasks or updates
            - `test`: Adding new tests or modifying existing tests
            - `bench`: Adding new benchmarks or modifying existing benchmarks
            - `perf`: Performance improvements
            - `refactor`: Changes to improve code structure
            - `docs`: Documentation updates
            - `ci`: Changes to CI/CD configurations
            - `revert`: Reverts a previously merged PR
            - `deps`: Updates dependencies

            **Breaking Changes**

            Breaking changes are noted by using an exclamation mark. For example:
            - `feat!: changed the API`
            - `chore(node)!: Removed unused public function`

            **Help**

            For more information, follow the guidelines here: https://www.conventionalcommits.org/en/v1.0.0/

      - name: Remove Comment for Valid Title
        if: github.event_name == 'pull_request' && steps.lint_pr_title.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: pr-title-lint-error
          delete: true

      - name: Fail workflow if title invalid
        if: github.event_name == 'pull_request' && steps.lint_pr_title.outcome == 'failure'
        run: exit 1
