# Shared, org-wide PR linting.
#
# This is a *reusable* workflow (`on: workflow_call`). Consumer repos call it
# from a thin stub that owns the `pull_request` trigger, e.g.:
#
#   # <consumer>/.github/workflows/pr-lint.yml
#   name: PR Lint
#   on:
#     pull_request:
#       types: [opened, reopened, edited, synchronize]
#     merge_group:
#   jobs:
#     pr-lint:
#       uses: megaeth-labs/.github/.github/workflows/pr-lint.yml@<sha>   # pin to a SHA
#
# Keep this workflow the single source of truth for PR-level lint rules that
# apply across the org. It currently lints the PR title against Conventional
# Commits; additional PR lint jobs (body checks, size limits, etc.) can be added
# here as separate jobs so every consumer picks them up automatically.
name: PR Lint

on:
  workflow_call:
    inputs:
      types:
        description: |
          Newline-separated list of allowed Conventional Commit types for the PR
          title. Defaults to the MegaETH org convention. Override only when a repo
          genuinely needs a different set.
        required: false
        type: string
        default: |
          feat
          fix
          chore
          test
          bench
          perf
          refactor
          docs
          ci
          revert
          deps

permissions:
  pull-requests: read
  contents: read

jobs:
  conventional-title:
    name: Validate PR title is Conventional Commit
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # Delegates to the pr-title-lint composite action so the check logic lives
      # in exactly one place. Repos whose required-check name must stay exactly
      # "Validate PR title is Conventional Commit" should call that composite
      # action directly from a job they name, rather than calling this workflow
      # (a reusable-workflow check is always prefixed with the caller job name).
      - name: Lint PR title
        uses: megaeth-labs/.github/.github/actions/pr-title-lint@main
        with:
          types: ${{ inputs.types }}
