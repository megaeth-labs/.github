name: Actions

# These composite actions are consumed at @main by every repo in the org, so a
# merge here ships to all of them at once with no consumer-side review. This
# workflow is the only gate between a bad edit and every consumer's CI.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Test PR review pipeline
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover \
            -s .github/actions/claude-pr-review \
            -p 'test_*.py' \
            -v

      - name: Test release tools
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover \
            -s .github/actions/release-tools \
            -p 'test_*.py' \
            -v

  # release-verify-version is bash inside a composite action; drive it with
  # fake binaries and check each outcome the README promises.
  verify-version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fake binaries
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\necho "my-tool 1.2.3"\n' > "$RUNNER_TEMP/bin/my-tool"
          printf '#!/bin/sh\necho "v1.2.3"\n' > "$RUNNER_TEMP/bin/vee"
          printf '#!/bin/sh\necho "cannot load shared library" >&2\nexit 127\n' > "$RUNNER_TEMP/bin/broken"
          chmod +x "$RUNNER_TEMP"/bin/*

      - name: Match (default expected = name + version, v stripped)
        id: match
        uses: ./.github/actions/release-verify-version
        with:
          command: ${{ runner.temp }}/bin/my-tool --version
          version: v1.2.3

      - name: Custom expected
        id: custom
        uses: ./.github/actions/release-verify-version
        with:
          command: ${{ runner.temp }}/bin/vee --version
          version: "1.2.3"
          expected: "v{version}"

      - name: Mismatch on a dry run warns and carries on
        id: mismatch-dry
        uses: ./.github/actions/release-verify-version
        with:
          command: ${{ runner.temp }}/bin/my-tool --version
          version: v9.9.9
          dry_run: "true"

      - name: Mismatch on a release stops
        id: mismatch
        continue-on-error: true
        uses: ./.github/actions/release-verify-version
        with:
          command: ${{ runner.temp }}/bin/my-tool --version
          version: v9.9.9

      - name: A probe that cannot run stops even on a dry run
        id: broken
        continue-on-error: true
        uses: ./.github/actions/release-verify-version
        with:
          command: ${{ runner.temp }}/bin/broken --version
          version: v1.2.3
          dry_run: "true"

      - name: Check outcomes
        env:
          MATCH: ${{ steps.match.outputs.actual }}
          MISMATCH: ${{ steps.mismatch.outcome }}
          BROKEN: ${{ steps.broken.outcome }}
        run: |
          set -euo pipefail
          [[ "$MATCH" == "my-tool 1.2.3" ]] || { echo "actual output not exported: '$MATCH'"; exit 1; }
          [[ "$MISMATCH" == "failure" ]] || { echo "mismatch on a release should fail, got $MISMATCH"; exit 1; }
          [[ "$BROKEN" == "failure" ]] || { echo "a broken probe should fail on a dry run too, got $BROKEN"; exit 1; }
          echo "all outcomes as documented"

  # release-snapshot: resolve a ref with and without the branch guard, refuse
  # a commit that is not on an allowed branch, and write the summary.
  snapshot:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve main, guarded by main
        id: main
        uses: ./.github/actions/release-snapshot
        with:
          stage: resolve
          ref: main
          allowed_branches: main

      - name: Resolve the run's own commit, no guard, profiling
        id: own
        uses: ./.github/actions/release-snapshot
        with:
          stage: resolve
          profile: profiling

      - name: A commit off every allowed branch is refused
        id: refused
        continue-on-error: true
        uses: ./.github/actions/release-snapshot
        with:
          stage: resolve
          allowed_branches: no-such-branch

      - name: Check the coordinates
        env:
          MAIN_COMMIT: ${{ steps.main.outputs.commit }}
          MAIN_BRANCH: ${{ steps.main.outputs.branch }}
          MAIN_PATH: ${{ steps.main.outputs.path }}
          OWN_COMMIT: ${{ steps.own.outputs.commit }}
          OWN_VERSION: ${{ steps.own.outputs.version }}
          OWN_PATH: ${{ steps.own.outputs.path }}
          REFUSED: ${{ steps.refused.outcome }}
        run: |
          set -euo pipefail
          [[ "$MAIN_COMMIT" == "$(git rev-parse origin/main)" ]] || { echo "main resolved to $MAIN_COMMIT"; exit 1; }
          [[ "$MAIN_BRANCH" == "main" && "$MAIN_PATH" == "release/latest" ]] || { echo "branch=$MAIN_BRANCH path=$MAIN_PATH"; exit 1; }
          [[ "$OWN_COMMIT" == "$GITHUB_SHA" && "$OWN_VERSION" == "$GITHUB_SHA" ]] || { echo "own commit=$OWN_COMMIT version=$OWN_VERSION"; exit 1; }
          [[ "$OWN_PATH" == "profiling/latest" ]] || { echo "own path=$OWN_PATH"; exit 1; }
          [[ "$REFUSED" == "failure" ]] || { echo "an off-branch commit should be refused, got $REFUSED"; exit 1; }
          echo "coordinates as documented"

      - name: Summary of a rehearsal
        id: summary
        uses: ./.github/actions/release-snapshot
        with:
          stage: summary
          commit: ${{ steps.own.outputs.commit }}
          profile: profiling
          entries: |
            my-binary https://example.invalid/my-binary 0123abcd dry-run
            my-tool https://example.invalid/my-tool 4567ef01 dry-run
          dry_run: "true"

      # GITHUB_STEP_SUMMARY is a per-step file, so the summary itself cannot be
      # read back here; the manifest output carries the same entries.
      - name: Check the manifest output
        env:
          PACKAGES: ${{ steps.summary.outputs.packages }}
          MANIFEST: ${{ steps.summary.outputs.manifest }}
        run: |
          set -euo pipefail
          [[ "$PACKAGES" == "my-binary,my-tool" ]] || { echo "packages=$PACKAGES"; exit 1; }
          expected="$(printf 'my-binary:\n  commit: "%s"\n  version: "latest"\n  profile: "profiling"\nmy-tool:\n  commit: "%s"\n  version: "latest"\n  profile: "profiling"\n' "$GITHUB_SHA" "$GITHUB_SHA")"
          [[ "$MANIFEST" == "$expected" ]] || { echo "manifest differs:"; diff <(echo "$expected") <(echo "$MANIFEST") || true; exit 1; }
          echo "manifest entries as documented"

  # git-credentials rewrites URLs in the runner's global git config; drive
  # set, replace, and unset with a fake token and read the config back.
  git-credentials:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set
        id: set
        uses: ./.github/actions/git-credentials
        with:
          token: fake-token-1
          rewrite_ssh: "true"
          safe_directory: "true"

      - name: Replace with a new token
        uses: ./.github/actions/git-credentials
        with:
          token: fake-token-2

      - name: Check the rewrite (one token, the new one; SSH gone with the replace)
        env:
          REWRITE: ${{ steps.set.outputs.rewrite }}
        run: |
          set -euo pipefail
          [[ "$REWRITE" == "url.https://x-access-token:***@github.com/.insteadOf" ]] || { echo "unexpected rewrite output: $REWRITE"; exit 1; }
          rewrites="$(git config --global --get-regexp '^url\..*\.insteadof$')"
          echo "$rewrites" | sed 's/fake-token-[0-9]/<token>/'
          grep -q 'fake-token-2@github.com/.insteadof https://github.com/' <<<"$rewrites" || { echo "new token not set"; exit 1; }
          grep -q 'fake-token-1' <<<"$rewrites" && { echo "old token still present"; exit 1; }
          [[ "$(git config --global --get-all safe.directory)" == "*" ]] || { echo "safe.directory not set"; exit 1; }
          echo "rewrite as documented"

      - name: Unset
        uses: ./.github/actions/git-credentials
        with:
          mode: unset

      - name: Check nothing is left
        run: |
          if git config --global --get-regexp '^url\..*\.insteadof$'; then echo "rewrite still present after unset"; exit 1; fi
          echo "clean"

      - name: A token with URL characters is refused
        id: bad
        continue-on-error: true
        uses: ./.github/actions/git-credentials
        with:
          token: "not/a token"

      - name: Check the refusal
        env:
          BAD: ${{ steps.bad.outcome }}
        run: |
          [[ "$BAD" == "failure" ]] || { echo "a token with URL characters should be refused, got $BAD"; exit 1; }

  # export-env loads a dotenv file into the next steps; check parsing,
  # prefix handling and that the outputs report what was loaded.
  export-env:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fixture
        run: |
          printf '%s\n' '# a comment' 'FOO=bar' 'export QUOTED="hello world"' "SINGLE='x y'" 'APP_NAME=demo' 'APP_SECRET=supersecretvalue' 'EMPTY=' '  SPACED = padded  ' > "$RUNNER_TEMP/test.env"

      - name: Load everything
        id: all
        uses: ./.github/actions/export-env
        with:
          file: ${{ runner.temp }}/test.env
          mask: "true"

      - name: Check the environment
        env:
          KEYS: ${{ steps.all.outputs.keys }}
          COUNT: ${{ steps.all.outputs.count }}
        run: |
          set -euo pipefail
          [[ "$FOO" == "bar" ]] || { echo "FOO=$FOO"; exit 1; }
          [[ "$QUOTED" == "hello world" ]] || { echo "QUOTED=$QUOTED"; exit 1; }
          [[ "$SINGLE" == "x y" ]] || { echo "SINGLE=$SINGLE"; exit 1; }
          [[ "$SPACED" == "padded" ]] || { echo "SPACED=$SPACED"; exit 1; }
          [[ "${EMPTY+set}" == "set" && -z "$EMPTY" ]] || { echo "EMPTY not exported as empty"; exit 1; }
          [[ "$COUNT" == "7" ]] || { echo "count=$COUNT"; exit 1; }
          [[ "$KEYS" == "FOO,QUOTED,SINGLE,APP_NAME,APP_SECRET,EMPTY,SPACED" ]] || { echo "keys=$KEYS"; exit 1; }
          echo "all seven loaded; APP_SECRET is $APP_SECRET (masked in the log if masking works)"

      - name: Load one namespace as JSON, prefix stripped
        id: app
        uses: ./.github/actions/export-env
        with:
          file: ${{ runner.temp }}/test.env
          target: json
          prefix: APP_
          strip_prefix: "true"

      - name: Check the JSON output
        env:
          NAME: ${{ fromJSON(steps.app.outputs.json).NAME }}
          COUNT: ${{ steps.app.outputs.count }}
        run: |
          [[ "$NAME" == "demo" && "$COUNT" == "2" ]] || { echo "NAME=$NAME count=$COUNT"; exit 1; }
          echo "prefix handling as documented"

      - name: A missing file is an error by default
        id: missing
        continue-on-error: true
        uses: ./.github/actions/export-env
        with:
          file: ${{ runner.temp }}/none.env

      - name: A missing file is fine when not required
        uses: ./.github/actions/export-env
        with:
          file: ${{ runner.temp }}/none.env
          required: "false"

      - name: Check the missing-file outcomes
        env:
          MISSING: ${{ steps.missing.outcome }}
        run: |
          [[ "$MISSING" == "failure" ]] || { echo "a missing required file should fail, got $MISSING"; exit 1; }

  # notify-lark posts to a webhook; stand in for Lark with a local server
  # that records the request and answers like the real bot does.
  notify-lark:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fake Lark
        run: |
          cat > "$RUNNER_TEMP/lark.py" <<'PY'
          import json, sys, http.server
          LOG = sys.argv[2]
          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  body = self.rfile.read(int(self.headers.get('Content-Length', 0)))
                  with open(LOG, 'a') as f: f.write(self.path + ' ' + body.decode() + '\n')
                  reply = {"code": 0, "msg": "success"} if self.path == '/ok' else {"code": 19001, "msg": "param invalid"}
                  self.send_response(200); self.send_header('Content-Type', 'application/json'); self.end_headers()
                  self.wfile.write(json.dumps(reply).encode())
              def log_message(self, *a): pass
          http.server.HTTPServer(('127.0.0.1', int(sys.argv[1])), H).serve_forever()
          PY
          nohup python3 "$RUNNER_TEMP/lark.py" 18765 "$RUNNER_TEMP/requests.log" >/dev/null 2>&1 &
          until curl -s -o /dev/null http://127.0.0.1:18765/ok; do sleep 0.2; done

      - name: Text message
        id: text
        uses: ./.github/actions/notify-lark
        with:
          webhook_url: http://127.0.0.1:18765/ok
          message: hello from actions-test

      - name: Rich text with a signature
        uses: ./.github/actions/notify-lark
        with:
          webhook_url: http://127.0.0.1:18765/ok
          msg_type: post
          title: Build failed
          message: |
            line one
            line two
          secret: s3cret

      - name: Raw payload
        uses: ./.github/actions/notify-lark
        with:
          webhook_url: http://127.0.0.1:18765/ok
          payload: '{"msg_type":"interactive","card":{"header":{"title":{"tag":"plain_text","content":"x"}}}}'

      - name: A Lark error is a warning when fail_on_error is false
        id: soft
        uses: ./.github/actions/notify-lark
        with:
          webhook_url: http://127.0.0.1:18765/bad
          message: oops
          fail_on_error: "false"

      - name: A Lark error fails the step by default
        id: hard
        continue-on-error: true
        uses: ./.github/actions/notify-lark
        with:
          webhook_url: http://127.0.0.1:18765/bad
          message: oops

      - name: Check what Lark received and the outcomes
        env:
          TEXT_CODE: ${{ steps.text.outputs.code }}
          SOFT_CODE: ${{ steps.soft.outputs.code }}
          HARD: ${{ steps.hard.outcome }}
        run: |
          set -euo pipefail
          [[ "$TEXT_CODE" == "0" ]] || { echo "text code=$TEXT_CODE"; exit 1; }
          [[ "$SOFT_CODE" == "19001" ]] || { echo "soft code=$SOFT_CODE"; exit 1; }
          [[ "$HARD" == "failure" ]] || { echo "a Lark error should fail by default, got $HARD"; exit 1; }
          python3 - "$RUNNER_TEMP/requests.log" <<'PY'
          import json, sys, hmac, hashlib, base64
          reqs = [json.loads(l.split(' ', 1)[1]) for l in open(sys.argv[1]) if l.split(' ', 1)[1].strip()]
          assert len(reqs) == 5, len(reqs)
          assert reqs[0] == {"msg_type": "text", "content": {"text": "hello from actions-test"}}, reqs[0]
          post = reqs[1]
          assert post["msg_type"] == "post" and post["content"]["post"]["zh_cn"]["title"] == "Build failed", post
          assert [p[0]["text"] for p in post["content"]["post"]["zh_cn"]["content"]] == ["line one", "line two"], post
          key = (post["timestamp"] + "\n" + "s3cret").encode()
          assert post["sign"] == base64.b64encode(hmac.new(key, b"", hashlib.sha256).digest()).decode(), "bad signature"
          assert reqs[2]["msg_type"] == "interactive", reqs[2]
          print("five requests, bodies and signature as documented")
          PY

  # merge-queue-skipper can only say "true" inside a merge queue; outside one
  # it must say "false" and expose empty parse outputs.
  merge-queue-skipper:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Outside a merge queue
        id: skip
        uses: ./.github/actions/merge-queue-skipper

      - name: Check
        env:
          SKIP: ${{ steps.skip.outputs.skip-check }}
          PR: ${{ steps.skip.outputs.pr_number }}
        run: |
          [[ "$SKIP" == "false" && -z "$PR" ]] || { echo "skip-check=$SKIP pr_number=$PR"; exit 1; }
          echo "false outside a queue, as documented"

  # The generated parts of every action README (inputs, outputs, steps,
  # errors) and the catalogue come from action.yml; stale docs fail here.
  docs:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check generated action documentation
        run: |
          python3 -m pip install --quiet pyyaml
          python3 .github/scripts/action_docs.py --check
