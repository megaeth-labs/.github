name: Actions

# These composite actions are consumed at @main by every repo in the org, so a
# merge here ships to all of them at once with no consumer-side review. This
# workflow is the only gate between a bad edit and every consumer's CI.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Test PR review pipeline
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover \
            -s .github/actions/claude-pr-review \
            -p 'test_*.py' \
            -v

      - name: Test release tools
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover \
            -s .github/actions/release-tools \
            -p 'test_*.py' \
            -v

  # release-verify-version is bash inside a composite action; drive it with
  # fake binaries and check each outcome the README promises.
  verify-version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fake binaries
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\necho "my-tool 1.2.3"\n' > "$RUNNER_TEMP/bin/my-tool"
          printf '#!/bin/sh\necho "v1.2.3"\n' > "$RUNNER_TEMP/bin/vee"
          printf '#!/bin/sh\necho "cannot load shared library" >&2\nexit 127\n' > "$RUNNER_TEMP/bin/broken"
          chmod +x "$RUNNER_TEMP"/bin/*

      - name: Match (default expected = name + version, v stripped)
        id: match
        uses: ./.github/actions/release-verify-version
        with:
          command: ${{ runner.temp }}/bin/my-tool --version
          version: v1.2.3

      - name: Custom expected
        id: custom
        uses: ./.github/actions/release-verify-version
        with:
          command: ${{ runner.temp }}/bin/vee --version
          version: "1.2.3"
          expected: "v{version}"

      - name: Mismatch on a dry run warns and carries on
        id: mismatch-dry
        uses: ./.github/actions/release-verify-version
        with:
          command: ${{ runner.temp }}/bin/my-tool --version
          version: v9.9.9
          dry_run: "true"

      - name: Mismatch on a release stops
        id: mismatch
        continue-on-error: true
        uses: ./.github/actions/release-verify-version
        with:
          command: ${{ runner.temp }}/bin/my-tool --version
          version: v9.9.9

      - name: A probe that cannot run stops even on a dry run
        id: broken
        continue-on-error: true
        uses: ./.github/actions/release-verify-version
        with:
          command: ${{ runner.temp }}/bin/broken --version
          version: v1.2.3
          dry_run: "true"

      - name: Check outcomes
        env:
          MATCH: ${{ steps.match.outputs.actual }}
          MISMATCH: ${{ steps.mismatch.outcome }}
          BROKEN: ${{ steps.broken.outcome }}
        run: |
          set -euo pipefail
          [[ "$MATCH" == "my-tool 1.2.3" ]] || { echo "actual output not exported: '$MATCH'"; exit 1; }
          [[ "$MISMATCH" == "failure" ]] || { echo "mismatch on a release should fail, got $MISMATCH"; exit 1; }
          [[ "$BROKEN" == "failure" ]] || { echo "a broken probe should fail on a dry run too, got $BROKEN"; exit 1; }
          echo "all outcomes as documented"

  # release-snapshot: resolve a ref with and without the branch guard, refuse
  # a commit that is not on an allowed branch, and write the summary.
  snapshot:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve main, guarded by main
        id: main
        uses: ./.github/actions/release-snapshot
        with:
          stage: resolve
          ref: main
          allowed_branches: main

      - name: Resolve the run's own commit, no guard, profiling
        id: own
        uses: ./.github/actions/release-snapshot
        with:
          stage: resolve
          profile: profiling

      - name: A commit off every allowed branch is refused
        id: refused
        continue-on-error: true
        uses: ./.github/actions/release-snapshot
        with:
          stage: resolve
          allowed_branches: no-such-branch

      - name: Check the coordinates
        env:
          MAIN_COMMIT: ${{ steps.main.outputs.commit }}
          MAIN_BRANCH: ${{ steps.main.outputs.branch }}
          MAIN_PATH: ${{ steps.main.outputs.path }}
          OWN_COMMIT: ${{ steps.own.outputs.commit }}
          OWN_VERSION: ${{ steps.own.outputs.version }}
          OWN_PATH: ${{ steps.own.outputs.path }}
          REFUSED: ${{ steps.refused.outcome }}
        run: |
          set -euo pipefail
          [[ "$MAIN_COMMIT" == "$(git rev-parse origin/main)" ]] || { echo "main resolved to $MAIN_COMMIT"; exit 1; }
          [[ "$MAIN_BRANCH" == "main" && "$MAIN_PATH" == "release/latest" ]] || { echo "branch=$MAIN_BRANCH path=$MAIN_PATH"; exit 1; }
          [[ "$OWN_COMMIT" == "$GITHUB_SHA" && "$OWN_VERSION" == "$GITHUB_SHA" ]] || { echo "own commit=$OWN_COMMIT version=$OWN_VERSION"; exit 1; }
          [[ "$OWN_PATH" == "profiling/latest" ]] || { echo "own path=$OWN_PATH"; exit 1; }
          [[ "$REFUSED" == "failure" ]] || { echo "an off-branch commit should be refused, got $REFUSED"; exit 1; }
          echo "coordinates as documented"

      - name: Summary of a rehearsal
        id: summary
        uses: ./.github/actions/release-snapshot
        with:
          stage: summary
          commit: ${{ steps.own.outputs.commit }}
          profile: profiling
          entries: |
            my-binary https://example.invalid/my-binary 0123abcd dry-run
            my-tool https://example.invalid/my-tool 4567ef01 dry-run
          dry_run: "true"

      # GITHUB_STEP_SUMMARY is a per-step file, so the summary itself cannot be
      # read back here; the manifest output carries the same entries.
      - name: Check the manifest output
        env:
          PACKAGES: ${{ steps.summary.outputs.packages }}
          MANIFEST: ${{ steps.summary.outputs.manifest }}
        run: |
          set -euo pipefail
          [[ "$PACKAGES" == "my-binary,my-tool" ]] || { echo "packages=$PACKAGES"; exit 1; }
          expected="$(printf 'my-binary:\n  commit: "%s"\n  version: "latest"\n  profile: "profiling"\nmy-tool:\n  commit: "%s"\n  version: "latest"\n  profile: "profiling"\n' "$GITHUB_SHA" "$GITHUB_SHA")"
          [[ "$MANIFEST" == "$expected" ]] || { echo "manifest differs:"; diff <(echo "$expected") <(echo "$MANIFEST") || true; exit 1; }
          echo "manifest entries as documented"

  # git-credentials rewrites URLs in the runner's global git config; drive
  # set, replace, and unset with a fake token and read the config back.
  git-credentials:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set
        id: set
        uses: ./.github/actions/git-credentials
        with:
          token: fake-token-1
          rewrite_ssh: "true"
          safe_directory: "true"

      - name: Replace with a new token
        uses: ./.github/actions/git-credentials
        with:
          token: fake-token-2

      - name: Check the rewrite (one token, the new one; SSH gone with the replace)
        env:
          REWRITE: ${{ steps.set.outputs.rewrite }}
        run: |
          set -euo pipefail
          [[ "$REWRITE" == "url.https://x-access-token:***@github.com/.insteadOf" ]] || { echo "unexpected rewrite output: $REWRITE"; exit 1; }
          rewrites="$(git config --global --get-regexp '^url\..*\.insteadof$')"
          echo "$rewrites" | sed 's/fake-token-[0-9]/<token>/'
          grep -q 'fake-token-2@github.com/.insteadof https://github.com/' <<<"$rewrites" || { echo "new token not set"; exit 1; }
          grep -q 'fake-token-1' <<<"$rewrites" && { echo "old token still present"; exit 1; }
          [[ "$(git config --global --get-all safe.directory)" == "*" ]] || { echo "safe.directory not set"; exit 1; }
          echo "rewrite as documented"

      - name: Unset
        uses: ./.github/actions/git-credentials
        with:
          mode: unset

      - name: Check nothing is left
        run: |
          if git config --global --get-regexp '^url\..*\.insteadof$'; then echo "rewrite still present after unset"; exit 1; fi
          echo "clean"

      - name: A token with URL characters is refused
        id: bad
        continue-on-error: true
        uses: ./.github/actions/git-credentials
        with:
          token: "not/a token"

      - name: Check the refusal
        env:
          BAD: ${{ steps.bad.outcome }}
        run: |
          [[ "$BAD" == "failure" ]] || { echo "a token with URL characters should be refused, got $BAD"; exit 1; }

  # export-env loads a dotenv file into the next steps; check parsing,
  # prefix handling and that the outputs report what was loaded.
  export-env:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fixture
        run: |
          printf '%s\n' '# a comment' 'FOO=bar' 'export QUOTED="hello world"' "SINGLE='x y'" 'APP_NAME=demo' 'APP_SECRET=supersecretvalue' 'EMPTY=' '  SPACED = padded  ' > "$RUNNER_TEMP/test.env"

      - name: Load everything
        id: all
        uses: ./.github/actions/export-env
        with:
          file: ${{ runner.temp }}/test.env
          mask: "true"

      - name: Check the environment
        env:
          KEYS: ${{ steps.all.outputs.keys }}
          COUNT: ${{ steps.all.outputs.count }}
        run: |
          set -euo pipefail
          [[ "$FOO" == "bar" ]] || { echo "FOO=$FOO"; exit 1; }
          [[ "$QUOTED" == "hello world" ]] || { echo "QUOTED=$QUOTED"; exit 1; }
          [[ "$SINGLE" == "x y" ]] || { echo "SINGLE=$SINGLE"; exit 1; }
          [[ "$SPACED" == "padded" ]] || { echo "SPACED=$SPACED"; exit 1; }
          [[ "${EMPTY+set}" == "set" && -z "$EMPTY" ]] || { echo "EMPTY not exported as empty"; exit 1; }
          [[ "$COUNT" == "7" ]] || { echo "count=$COUNT"; exit 1; }
          [[ "$KEYS" == "FOO,QUOTED,SINGLE,APP_NAME,APP_SECRET,EMPTY,SPACED" ]] || { echo "keys=$KEYS"; exit 1; }
          echo "all seven loaded; APP_SECRET is $APP_SECRET (masked in the log if masking works)"

      - name: Load one namespace as JSON, prefix stripped
        id: app
        uses: ./.github/actions/export-env
        with:
          file: ${{ runner.temp }}/test.env
          target: json
          prefix: APP_
          strip_prefix: "true"

      - name: Check the JSON output
        env:
          NAME: ${{ fromJSON(steps.app.outputs.json).NAME }}
          COUNT: ${{ steps.app.outputs.count }}
        run: |
          [[ "$NAME" == "demo" && "$COUNT" == "2" ]] || { echo "NAME=$NAME count=$COUNT"; exit 1; }
          echo "prefix handling as documented"

      - name: A missing file is an error by default
        id: missing
        continue-on-error: true
        uses: ./.github/actions/export-env
        with:
          file: ${{ runner.temp }}/none.env

      - name: A missing file is fine when not required
        uses: ./.github/actions/export-env
        with:
          file: ${{ runner.temp }}/none.env
          required: "false"

      - name: Check the missing-file outcomes
        env:
          MISSING: ${{ steps.missing.outcome }}
        run: |
          [[ "$MISSING" == "failure" ]] || { echo "a missing required file should fail, got $MISSING"; exit 1; }

  # notify-lark posts to a webhook; stand in for Lark with a local server
  # that records the request and answers like the real bot does.
  notify-lark:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fake Lark
        run: |
          cat > "$RUNNER_TEMP/lark.py" <<'PY'
          import json, sys, http.server
          LOG = sys.argv[2]
          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  body = self.rfile.read(int(self.headers.get('Content-Length', 0)))
                  with open(LOG, 'a') as f: f.write(self.path + ' ' + body.decode() + '\n')
                  reply = {"code": 0, "msg": "success"} if self.path == '/ok' else {"code": 19001, "msg": "param invalid"}
                  self.send_response(200); self.send_header('Content-Type', 'application/json'); self.end_headers()
                  self.wfile.write(json.dumps(reply).encode())
              def log_message(self, *a): pass
          http.server.HTTPServer(('127.0.0.1', int(sys.argv[1])), H).serve_forever()
          PY
          nohup python3 "$RUNNER_TEMP/lark.py" 18765 "$RUNNER_TEMP/requests.log" >/dev/null 2>&1 &
          until curl -s -o /dev/null http://127.0.0.1:18765/ok; do sleep 0.2; done

      - name: Text message
        id: text
        uses: ./.github/actions/notify-lark
        with:
          webhook_url: http://127.0.0.1:18765/ok
          message: hello from actions-test

      - name: Rich text with a signature
        uses: ./.github/actions/notify-lark
        with:
          webhook_url: http://127.0.0.1:18765/ok
          msg_type: post
          title: Build failed
          message: |
            line one
            line two
          secret: s3cret

      - name: Raw payload
        uses: ./.github/actions/notify-lark
        with:
          webhook_url: http://127.0.0.1:18765/ok
          payload: '{"msg_type":"interactive","card":{"header":{"title":{"tag":"plain_text","content":"x"}}}}'

      - name: A Lark error is a warning when fail_on_error is false
        id: soft
        uses: ./.github/actions/notify-lark
        with:
          webhook_url: http://127.0.0.1:18765/bad
          message: oops
          fail_on_error: "false"

      - name: A Lark error fails the step by default
        id: hard
        continue-on-error: true
        uses: ./.github/actions/notify-lark
        with:
          webhook_url: http://127.0.0.1:18765/bad
          message: oops

      - name: Check what Lark received and the outcomes
        env:
          TEXT_CODE: ${{ steps.text.outputs.code }}
          SOFT_CODE: ${{ steps.soft.outputs.code }}
          HARD: ${{ steps.hard.outcome }}
        run: |
          set -euo pipefail
          [[ "$TEXT_CODE" == "0" ]] || { echo "text code=$TEXT_CODE"; exit 1; }
          [[ "$SOFT_CODE" == "19001" ]] || { echo "soft code=$SOFT_CODE"; exit 1; }
          [[ "$HARD" == "failure" ]] || { echo "a Lark error should fail by default, got $HARD"; exit 1; }
          python3 - "$RUNNER_TEMP/requests.log" <<'PY'
          import json, sys, hmac, hashlib, base64
          reqs = [json.loads(l.split(' ', 1)[1]) for l in open(sys.argv[1]) if l.split(' ', 1)[1].strip()]
          assert len(reqs) == 5, len(reqs)
          assert reqs[0] == {"msg_type": "text", "content": {"text": "hello from actions-test"}}, reqs[0]
          post = reqs[1]
          assert post["msg_type"] == "post" and post["content"]["post"]["zh_cn"]["title"] == "Build failed", post
          assert [p[0]["text"] for p in post["content"]["post"]["zh_cn"]["content"]] == ["line one", "line two"], post
          key = (post["timestamp"] + "\n" + "s3cret").encode()
          assert post["sign"] == base64.b64encode(hmac.new(key, b"", hashlib.sha256).digest()).decode(), "bad signature"
          assert reqs[2]["msg_type"] == "interactive", reqs[2]
          print("five requests, bodies and signature as documented")
          PY

  # merge-queue-skipper can only say "true" inside a merge queue; outside one
  # it must say "false" and expose empty parse outputs.
  merge-queue-skipper:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Outside a merge queue
        id: skip
        uses: ./.github/actions/merge-queue-skipper

      - name: Check
        env:
          SKIP: ${{ steps.skip.outputs.skip-check }}
          PR: ${{ steps.skip.outputs.pr_number }}
        run: |
          [[ "$SKIP" == "false" && -z "$PR" ]] || { echo "skip-check=$SKIP pr_number=$PR"; exit 1; }
          echo "false outside a queue, as documented"

  # release-candidate's propose shell runs at the start of every release in
  # every repository, and a real run needs an app token and a live remote.
  # Drive the shipped script instead — extracted from action.yml, never copied
  # — against a throwaway repository shaped like a settled release line, with
  # a fake `gh` for the default-branch lookup and the ref call.
  release-candidate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    env:
      TOOLS: ${{ github.workspace }}/.github/actions/release-tools/release_tools.py
      ACTION: ${{ github.workspace }}/.github/actions/release-candidate/action.yml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # `runner` is not a context a job-level `env:` may read, so the paths
      # the steps below share are set here instead.
      - name: Where the rehearsal lives
        run: |
          set -euo pipefail
          {
            echo "REPO=$RUNNER_TEMP/repo"
            echo "SH=$RUNNER_TEMP/sh"
            echo "OUT=$RUNNER_TEMP/step-output"
          } >> "$GITHUB_ENV"

      - name: The shell under test, taken from the action
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          mkdir -p "$SH"
          python3 - "$ACTION" "$SH" <<'PY'
          import pathlib, sys, yaml

          want = {
              "Guard (propose)": "guard.sh",
              "Cut the release branch at the base commit (propose)": "cut-branch.sh",
              "Draft changelog": "changelog.sh",
          }
          steps = yaml.safe_load(open(sys.argv[1]))["runs"]["steps"]
          found = {s["name"]: s["run"] for s in steps if s.get("name") in want}
          missing = sorted(set(want) - set(found))
          if missing:
              sys.exit(f"action.yml has no step named {missing}; this job drives them by name")
          for name, script in found.items():
              pathlib.Path(sys.argv[2], want[name]).write_text(script)
              print(f"extracted {name!r} -> {want[name]}")
          PY
          cat > "$SH/helpers.sh" <<'SH'
          # Run the guard the way the action's step does.
          guard() { # <version> [base_commit] [ref_name]
            : > "$OUT"
            ( cd "$REPO" && env \
                GH_TOKEN=fake \
                GITHUB_REPOSITORY=megaeth-labs/fake \
                GITHUB_REF_NAME="${3:-main}" \
                GITHUB_OUTPUT="$OUT" \
                VERSION="$1" \
                PREFIX=release-v \
                BASE_COMMIT="${2:-}" \
                TOOLS="$TOOLS" \
                bash "$SH/guard.sh" )
          }

          expect_output() { # <exact line the step should have written>
            grep -qxF "$1" "$OUT" || { echo "no '$1' in the step output:"; cat "$OUT"; exit 1; }
          }

          refuse() { # <version> <base_commit> <message fragment> [ref_name]
            local log="$RUNNER_TEMP/refused.log"
            if guard "$1" "$2" "${4:-main}" > "$log" 2>&1; then
              echo "expected a refusal for version=$1 base=$2"; cat "$log"; exit 1
            fi
            grep -qF "$3" "$log" || { echo "refused, but not for '$3':"; cat "$log"; exit 1; }
          }
          SH

      - name: A fake gh
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/gh" <<'SH'
          #!/usr/bin/env bash
          # Only what the shell under test calls: the default branch, and
          # creating a ref, which here is a push into the throwaway remote.
          set -euo pipefail
          case "${1:-}" in
            repo)
              echo "main"
              ;;
            api)
              ref=""; sha=""
              while [[ $# -gt 0 ]]; do
                if [[ "$1" == "-f" ]]; then
                  case "${2:-}" in
                    ref=*) ref="${2#ref=}" ;;
                    sha=*) sha="${2#sha=}" ;;
                  esac
                  shift 2 || break
                else
                  shift
                fi
              done
              if [[ -n "$ref" && -n "$sha" ]]; then
                git push --quiet origin "$sha:$ref"
              fi
              ;;
          esac
          SH
          chmod +x "$RUNNER_TEMP/bin/gh"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: A repository shaped like a settled release line
        run: |
          set -euo pipefail
          git config --global user.name tester
          git config --global user.email tester@example.invalid
          git config --global init.defaultBranch main
          git init --quiet --bare "$REPO.git"
          git clone --quiet "$REPO.git" "$REPO" 2>/dev/null
          cd "$REPO"
          echo 1.0.0 > VERSION
          printf '# Changelog\n\n## v1.0.0 (2024-01-01)\n\n- shipped in 1.0.0\n' > CHANGELOG.md
          git add -A && git commit --quiet -m "feat: the first release"
          git commit --quiet --allow-empty -m "feat: two"
          git commit --quiet --allow-empty -m "fix: three"
          git rev-parse HEAD > "$RUNNER_TEMP/base"
          git commit --quiet --allow-empty -m "feat: not shipping this"
          git commit --quiet --allow-empty -m "feat: nor this"
          git push --quiet -u origin main
          # v1.0.0 sits on its own release branch, off trunk, exactly where
          # settlement leaves it.
          git checkout --quiet -b release-v1.0.0 "$(git rev-list --max-parents=0 HEAD)"
          git commit --quiet --allow-empty -m "chore(release): settle v1.0.0"
          git tag -a v1.0.0 -m v1.0.0
          git push --quiet origin release-v1.0.0 --tags
          git checkout --quiet main
          git branch --quiet -D release-v1.0.0
          # A commit the default branch cannot reach.
          git checkout --quiet -b side
          git commit --quiet --allow-empty -m "feat: never reviewed"
          git rev-parse HEAD > "$RUNNER_TEMP/unreachable"
          git checkout --quiet main
          echo "base commit $(cat "$RUNNER_TEMP/base")"

      - name: The trunk-first path is unchanged
        run: |
          set -euo pipefail
          source "$SH/helpers.sh"
          guard 1.1.0
          expect_output "base="
          expect_output "branch=release-v1.1.0"
          echo "no base commit still means the default-branch flow"

      - name: An explicit commit resolves, however it was written
        run: |
          set -euo pipefail
          source "$SH/helpers.sh"
          base="$(cat "$RUNNER_TEMP/base")"
          guard 1.1.0 "$base"
          expect_output "base=$base"
          guard 1.1.0 "origin/main~2"
          expect_output "base=$base"
          echo "a full SHA and a relative ref both resolve to $base"

      - name: A commit the default branch cannot reach is refused
        run: |
          set -euo pipefail
          source "$SH/helpers.sh"
          refuse 1.1.0 "$(cat "$RUNNER_TEMP/unreachable")" "not reachable from the default branch"
          refuse 1.1.0 v1.0.0 "not reachable from the default branch"
          refuse 1.1.0 0000000000000000000000000000000000000000 "is not a commit in this checkout"
          echo "an off-trunk commit, a release tag and nonsense are all refused"

      - name: The rules that were already there still apply
        run: |
          set -euo pipefail
          source "$SH/helpers.sh"
          refuse 1.1.0 "" "release candidates start from the default branch" some-branch
          refuse 1.1.0 "$(cat "$RUNNER_TEMP/base")" "release candidates start from the default branch" some-branch
          refuse 0.9.0 "" "is not newer than the latest tag"
          refuse 0.9.0 "$(cat "$RUNNER_TEMP/base")" "is not newer than the latest tag"
          echo "the default-branch and version rules come first, with or without a base commit"

      - name: The release branch is cut at the commit, and the notes stop there
        run: |
          set -euo pipefail
          source "$SH/helpers.sh"
          base="$(cat "$RUNNER_TEMP/base")"
          guard 1.1.0 "$base"
          : > "$OUT"
          ( cd "$REPO" && env \
              GH_TOKEN=fake \
              GITHUB_REPOSITORY=megaeth-labs/fake \
              GITHUB_OUTPUT="$OUT" \
              BRANCH=release-v1.1.0 \
              BASE="$base" \
              bash "$SH/cut-branch.sh" )
          expect_output "release_branch=release-v1.1.0"
          [[ "$(git -C "$REPO" rev-parse HEAD)" == "$base" ]] \
            || { echo "HEAD is not the base commit"; exit 1; }
          [[ "$(git -C "$REPO" symbolic-ref --short HEAD)" == "release-v1.1.0" ]] \
            || { echo "the job is not on the release branch"; exit 1; }
          [[ "$(git -C "$REPO" ls-remote --heads origin refs/heads/release-v1.1.0 | cut -f1)" == "$base" ]] \
            || { echo "the remote branch is not at the base commit"; exit 1; }
          # The changelog step itself is untouched by this change; run it to
          # prove the entry covers what ships, not what is on the trunk tip.
          ( cd "$REPO" && env \
              VERSION=1.1.0 \
              CHANGELOG=CHANGELOG.md \
              GITHUB_REPOSITORY=megaeth-labs/fake \
              GITHUB_OUTPUT="$OUT" \
              TOOLS="$TOOLS" \
              bash "$SH/changelog.sh" )
          entry="$(sed -n '/^## v1.1.0/,/^## v1.0.0/p' "$REPO/CHANGELOG.md")"
          echo "$entry"
          grep -q '^- two' <<< "$entry" || { echo "a commit that ships is missing"; exit 1; }
          grep -q '^- three' <<< "$entry" || { echo "a commit that ships is missing"; exit 1; }
          ! grep -q 'not shipping' <<< "$entry" || { echo "a commit past the base is in the entry"; exit 1; }
          echo "release-v1.1.0 cut at $base, notes stop there"

      - name: A re-dispatch reuses its own branch, and nothing else
        run: |
          set -euo pipefail
          source "$SH/helpers.sh"
          base="$(cat "$RUNNER_TEMP/base")"
          guard 1.1.0 "$base"
          expect_output "base=$base"
          refuse 1.1.0 "origin/main~1" "already exists"
          refuse 1.1.0 "" "already exists"
          echo "the same commit is reused; a different one, and the trunk flow, are refused"

  # The generated parts of every action README (inputs, outputs, steps,
  # errors) and the catalogue come from action.yml; stale docs fail here.
  docs:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check generated action documentation
        run: |
          python3 -m pip install --quiet pyyaml
          python3 .github/scripts/action_docs.py --check
