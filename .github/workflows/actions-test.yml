name: Actions

# These composite actions are consumed at @main by every repo in the org, so a
# merge here ships to all of them at once with no consumer-side review. This
# workflow is the only gate between a bad edit and every consumer's CI.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  git-auth:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise Git HTTPS authentication without credential files
        run: python3 .github/actions/git-auth/test_git_auth.py

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Test PR review pipeline
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover \
            -s .github/actions/claude-pr-review \
            -p 'test_*.py' \
            -v

      - name: Test release tools
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover \
            -s .github/actions/release-tools \
            -p 'test_*.py' \
            -v

      - name: Test app-token-lint
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -m unittest discover \
            -s .github/scripts \
            -p 'test_*.py' \
            -v

      - name: Lint workflow templates for App token usage
        run: python3 .github/scripts/app_token_lint.py --repo my-repo workflow-templates/

  # release-verify-version is bash inside a composite action; drive it with
  # fake binaries and check each outcome the README promises.
  verify-version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fake binaries
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\necho "my-tool 1.2.3"\n' > "$RUNNER_TEMP/bin/my-tool"
          printf '#!/bin/sh\necho "v1.2.3"\n' > "$RUNNER_TEMP/bin/vee"
          printf '#!/bin/sh\necho "cannot load shared library" >&2\nexit 127\n' > "$RUNNER_TEMP/bin/broken"
          chmod +x "$RUNNER_TEMP"/bin/*

      - name: Match (default expected = name + version, v stripped)
        id: match
        uses: ./.github/actions/release-verify-version
        with:
          command: ${{ runner.temp }}/bin/my-tool --version
          version: v1.2.3

      - name: Custom expected
        id: custom
        uses: ./.github/actions/release-verify-version
        with:
          command: ${{ runner.temp }}/bin/vee --version
          version: "1.2.3"
          expected: "v{version}"

      - name: Mismatch on a dry run warns and carries on
        id: mismatch-dry
        uses: ./.github/actions/release-verify-version
        with:
          command: ${{ runner.temp }}/bin/my-tool --version
          version: v9.9.9
          dry_run: "true"

      - name: Mismatch on a release stops
        id: mismatch
        continue-on-error: true
        uses: ./.github/actions/release-verify-version
        with:
          command: ${{ runner.temp }}/bin/my-tool --version
          version: v9.9.9

      - name: A probe that cannot run stops even on a dry run
        id: broken
        continue-on-error: true
        uses: ./.github/actions/release-verify-version
        with:
          command: ${{ runner.temp }}/bin/broken --version
          version: v1.2.3
          dry_run: "true"

      - name: Check outcomes
        env:
          MATCH: ${{ steps.match.outputs.actual }}
          MISMATCH: ${{ steps.mismatch.outcome }}
          BROKEN: ${{ steps.broken.outcome }}
        run: |
          set -euo pipefail
          [[ "$MATCH" == "my-tool 1.2.3" ]] || { echo "actual output not exported: '$MATCH'"; exit 1; }
          [[ "$MISMATCH" == "failure" ]] || { echo "mismatch on a release should fail, got $MISMATCH"; exit 1; }
          [[ "$BROKEN" == "failure" ]] || { echo "a broken probe should fail on a dry run too, got $BROKEN"; exit 1; }
          echo "all outcomes as documented"

  # release-snapshot: resolve a ref with and without the branch guard, refuse
  # a commit that is not on an allowed branch, and write the summary.
  snapshot:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve main, guarded by main
        id: main
        uses: ./.github/actions/release-snapshot
        with:
          stage: resolve
          ref: main
          allowed_branches: main

      - name: Resolve the run's own commit, no guard, profiling
        id: own
        uses: ./.github/actions/release-snapshot
        with:
          stage: resolve
          profile: profiling

      - name: A commit off every allowed branch is refused
        id: refused
        continue-on-error: true
        uses: ./.github/actions/release-snapshot
        with:
          stage: resolve
          allowed_branches: no-such-branch

      - name: Check the coordinates
        env:
          MAIN_COMMIT: ${{ steps.main.outputs.commit }}
          MAIN_BRANCH: ${{ steps.main.outputs.branch }}
          MAIN_PATH: ${{ steps.main.outputs.path }}
          OWN_COMMIT: ${{ steps.own.outputs.commit }}
          OWN_VERSION: ${{ steps.own.outputs.version }}
          OWN_PATH: ${{ steps.own.outputs.path }}
          REFUSED: ${{ steps.refused.outcome }}
        run: |
          set -euo pipefail
          [[ "$MAIN_COMMIT" == "$(git rev-parse origin/main)" ]] || { echo "main resolved to $MAIN_COMMIT"; exit 1; }
          [[ "$MAIN_BRANCH" == "main" && "$MAIN_PATH" == "release/latest" ]] || { echo "branch=$MAIN_BRANCH path=$MAIN_PATH"; exit 1; }
          [[ "$OWN_COMMIT" == "$GITHUB_SHA" && "$OWN_VERSION" == "$GITHUB_SHA" ]] || { echo "own commit=$OWN_COMMIT version=$OWN_VERSION"; exit 1; }
          [[ "$OWN_PATH" == "profiling/latest" ]] || { echo "own path=$OWN_PATH"; exit 1; }
          [[ "$REFUSED" == "failure" ]] || { echo "an off-branch commit should be refused, got $REFUSED"; exit 1; }
          echo "coordinates as documented"

      - name: Summary of a rehearsal
        id: summary
        uses: ./.github/actions/release-snapshot
        with:
          stage: summary
          commit: ${{ steps.own.outputs.commit }}
          profile: profiling
          entries: |
            my-binary https://example.invalid/my-binary 0123abcd dry-run
            my-tool https://example.invalid/my-tool 4567ef01 dry-run
          dry_run: "true"

      # GITHUB_STEP_SUMMARY is a per-step file, so the summary itself cannot be
      # read back here; the manifest output carries the same entries.
      - name: Check the manifest output
        env:
          PACKAGES: ${{ steps.summary.outputs.packages }}
          MANIFEST: ${{ steps.summary.outputs.manifest }}
        run: |
          set -euo pipefail
          [[ "$PACKAGES" == "my-binary,my-tool" ]] || { echo "packages=$PACKAGES"; exit 1; }
          expected="$(printf 'my-binary:\n  commit: "%s"\n  version: "latest"\n  profile: "profiling"\nmy-tool:\n  commit: "%s"\n  version: "latest"\n  profile: "profiling"\n' "$GITHUB_SHA" "$GITHUB_SHA")"
          [[ "$MANIFEST" == "$expected" ]] || { echo "manifest differs:"; diff <(echo "$expected") <(echo "$MANIFEST") || true; exit 1; }
          echo "manifest entries as documented"

  # git-credentials rewrites URLs in the runner's global git config; drive
  # set, replace, and unset with a fake token and read the config back.
  git-credentials:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set
        id: set
        uses: ./.github/actions/git-credentials
        with:
          token: fake-token-1
          rewrite_ssh: "true"
          safe_directory: "true"

      - name: Replace with a new token
        uses: ./.github/actions/git-credentials
        with:
          token: fake-token-2

      - name: Check the rewrite (one token, the new one; SSH gone with the replace)
        env:
          REWRITE: ${{ steps.set.outputs.rewrite }}
        run: |
          set -euo pipefail
          [[ "$REWRITE" == "url.https://x-access-token:***@github.com/.insteadOf" ]] || { echo "unexpected rewrite output: $REWRITE"; exit 1; }
          rewrites="$(git config --global --get-regexp '^url\..*\.insteadof$')"
          echo "$rewrites" | sed 's/fake-token-[0-9]/<token>/'
          grep -q 'fake-token-2@github.com/.insteadof https://github.com/' <<<"$rewrites" || { echo "new token not set"; exit 1; }
          grep -q 'fake-token-1' <<<"$rewrites" && { echo "old token still present"; exit 1; }
          [[ "$(git config --global --get-all safe.directory)" == "*" ]] || { echo "safe.directory not set"; exit 1; }
          echo "rewrite as documented"

      - name: Unset
        uses: ./.github/actions/git-credentials
        with:
          mode: unset

      - name: Check nothing is left
        run: |
          if git config --global --get-regexp '^url\..*\.insteadof$'; then echo "rewrite still present after unset"; exit 1; fi
          echo "clean"

      - name: A token with URL characters is refused
        id: bad
        continue-on-error: true
        uses: ./.github/actions/git-credentials
        with:
          token: "not/a token"

      - name: Check the refusal
        env:
          BAD: ${{ steps.bad.outcome }}
        run: |
          [[ "$BAD" == "failure" ]] || { echo "a token with URL characters should be refused, got $BAD"; exit 1; }

  # export-env loads a dotenv file into the next steps; check parsing,
  # prefix handling and that the outputs report what was loaded.
  export-env:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fixture
        run: |
          printf '%s\n' '# a comment' 'FOO=bar' 'export QUOTED="hello world"' "SINGLE='x y'" 'APP_NAME=demo' 'APP_SECRET=supersecretvalue' 'EMPTY=' '  SPACED = padded  ' > "$RUNNER_TEMP/test.env"

      - name: Load everything
        id: all
        uses: ./.github/actions/export-env
        with:
          file: ${{ runner.temp }}/test.env
          mask: "true"

      - name: Check the environment
        env:
          KEYS: ${{ steps.all.outputs.keys }}
          COUNT: ${{ steps.all.outputs.count }}
        run: |
          set -euo pipefail
          [[ "$FOO" == "bar" ]] || { echo "FOO=$FOO"; exit 1; }
          [[ "$QUOTED" == "hello world" ]] || { echo "QUOTED=$QUOTED"; exit 1; }
          [[ "$SINGLE" == "x y" ]] || { echo "SINGLE=$SINGLE"; exit 1; }
          [[ "$SPACED" == "padded" ]] || { echo "SPACED=$SPACED"; exit 1; }
          [[ "${EMPTY+set}" == "set" && -z "$EMPTY" ]] || { echo "EMPTY not exported as empty"; exit 1; }
          [[ "$COUNT" == "7" ]] || { echo "count=$COUNT"; exit 1; }
          [[ "$KEYS" == "FOO,QUOTED,SINGLE,APP_NAME,APP_SECRET,EMPTY,SPACED" ]] || { echo "keys=$KEYS"; exit 1; }
          echo "all seven loaded; APP_SECRET is $APP_SECRET (masked in the log if masking works)"

      - name: Load one namespace as JSON, prefix stripped
        id: app
        uses: ./.github/actions/export-env
        with:
          file: ${{ runner.temp }}/test.env
          target: json
          prefix: APP_
          strip_prefix: "true"

      - name: Check the JSON output
        env:
          NAME: ${{ fromJSON(steps.app.outputs.json).NAME }}
          COUNT: ${{ steps.app.outputs.count }}
        run: |
          [[ "$NAME" == "demo" && "$COUNT" == "2" ]] || { echo "NAME=$NAME count=$COUNT"; exit 1; }
          echo "prefix handling as documented"

      - name: A missing file is an error by default
        id: missing
        continue-on-error: true
        uses: ./.github/actions/export-env
        with:
          file: ${{ runner.temp }}/none.env

      - name: A missing file is fine when not required
        uses: ./.github/actions/export-env
        with:
          file: ${{ runner.temp }}/none.env
          required: "false"

      - name: Check the missing-file outcomes
        env:
          MISSING: ${{ steps.missing.outcome }}
        run: |
          [[ "$MISSING" == "failure" ]] || { echo "a missing required file should fail, got $MISSING"; exit 1; }

  # notify-lark posts to a webhook; stand in for Lark with a local server
  # that records the request and answers like the real bot does.
  notify-lark:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fake Lark
        run: |
          cat > "$RUNNER_TEMP/lark.py" <<'PY'
          import json, sys, http.server
          LOG = sys.argv[2]
          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  body = self.rfile.read(int(self.headers.get('Content-Length', 0)))
                  with open(LOG, 'a') as f: f.write(self.path + ' ' + body.decode() + '\n')
                  reply = {"code": 0, "msg": "success"} if self.path == '/ok' else {"code": 19001, "msg": "param invalid"}
                  self.send_response(200); self.send_header('Content-Type', 'application/json'); self.end_headers()
                  self.wfile.write(json.dumps(reply).encode())
              def log_message(self, *a): pass
          http.server.HTTPServer(('127.0.0.1', int(sys.argv[1])), H).serve_forever()
          PY
          nohup python3 "$RUNNER_TEMP/lark.py" 18765 "$RUNNER_TEMP/requests.log" >/dev/null 2>&1 &
          until curl -s -o /dev/null http://127.0.0.1:18765/ok; do sleep 0.2; done

      - name: Text message
        id: text
        uses: ./.github/actions/notify-lark
        with:
          webhook_url: http://127.0.0.1:18765/ok
          message: hello from actions-test

      - name: Rich text with a signature
        uses: ./.github/actions/notify-lark
        with:
          webhook_url: http://127.0.0.1:18765/ok
          msg_type: post
          title: Build failed
          message: |
            line one
            line two
          secret: s3cret

      - name: Raw payload
        uses: ./.github/actions/notify-lark
        with:
          webhook_url: http://127.0.0.1:18765/ok
          payload: '{"msg_type":"interactive","card":{"header":{"title":{"tag":"plain_text","content":"x"}}}}'

      - name: A Lark error is a warning when fail_on_error is false
        id: soft
        uses: ./.github/actions/notify-lark
        with:
          webhook_url: http://127.0.0.1:18765/bad
          message: oops
          fail_on_error: "false"

      - name: A Lark error fails the step by default
        id: hard
        continue-on-error: true
        uses: ./.github/actions/notify-lark
        with:
          webhook_url: http://127.0.0.1:18765/bad
          message: oops

      - name: Check what Lark received and the outcomes
        env:
          TEXT_CODE: ${{ steps.text.outputs.code }}
          SOFT_CODE: ${{ steps.soft.outputs.code }}
          HARD: ${{ steps.hard.outcome }}
        run: |
          set -euo pipefail
          [[ "$TEXT_CODE" == "0" ]] || { echo "text code=$TEXT_CODE"; exit 1; }
          [[ "$SOFT_CODE" == "19001" ]] || { echo "soft code=$SOFT_CODE"; exit 1; }
          [[ "$HARD" == "failure" ]] || { echo "a Lark error should fail by default, got $HARD"; exit 1; }
          python3 - "$RUNNER_TEMP/requests.log" <<'PY'
          import json, sys, hmac, hashlib, base64
          reqs = [json.loads(l.split(' ', 1)[1]) for l in open(sys.argv[1]) if l.split(' ', 1)[1].strip()]
          assert len(reqs) == 5, len(reqs)
          assert reqs[0] == {"msg_type": "text", "content": {"text": "hello from actions-test"}}, reqs[0]
          post = reqs[1]
          assert post["msg_type"] == "post" and post["content"]["post"]["zh_cn"]["title"] == "Build failed", post
          assert [p[0]["text"] for p in post["content"]["post"]["zh_cn"]["content"]] == ["line one", "line two"], post
          key = (post["timestamp"] + "\n" + "s3cret").encode()
          assert post["sign"] == base64.b64encode(hmac.new(key, b"", hashlib.sha256).digest()).decode(), "bad signature"
          assert reqs[2]["msg_type"] == "interactive", reqs[2]
          print("five requests, bodies and signature as documented")
          PY

  # merge-queue-skipper can only say "true" inside a merge queue; outside one
  # it must say "false" and expose empty parse outputs.
  merge-queue-skipper:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Outside a merge queue
        id: skip
        uses: ./.github/actions/merge-queue-skipper

      - name: Check
        env:
          SKIP: ${{ steps.skip.outputs.skip-check }}
          PR: ${{ steps.skip.outputs.pr_number }}
        run: |
          [[ "$SKIP" == "false" && -z "$PR" ]] || { echo "skip-check=$SKIP pr_number=$PR"; exit 1; }
          echo "false outside a queue, as documented"

  # release-candidate's propose shell runs at the start of every release in
  # every repository, and a real run needs an app token and a live remote.
  # Drive the shipped script instead — extracted from action.yml, never copied
  # — against a throwaway repository shaped like a settled release line, with
  # a fake `gh` for the default-branch lookup and the ref call.
  release-candidate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    env:
      TOOLS: ${{ github.workspace }}/.github/actions/release-tools/release_tools.py
      ACTION: ${{ github.workspace }}/.github/actions/release-candidate/action.yml
      AUTH_WRAPPER: ${{ github.workspace }}/.github/actions/git-auth/with-github-auth.sh
      GITHUB_AUTH_TOKEN: fixture-token
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # `runner` is not a context a job-level `env:` may read, so the paths
      # the steps below share are set here instead.
      - name: Where the rehearsal lives
        run: |
          set -euo pipefail
          {
            echo "REPO=$RUNNER_TEMP/repo"
            echo "SH=$RUNNER_TEMP/sh"
            echo "OUT=$RUNNER_TEMP/step-output"
          } >> "$GITHUB_ENV"

      - name: The shell under test, taken from the action
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          mkdir -p "$SH"
          python3 - "$ACTION" "$SH" <<'PY'
          import pathlib, sys, yaml

          want = {
              "Guard (propose)": "guard.sh",
              "Cut the release branch at the base commit (propose)": "cut-branch.sh",
              "Carry the release workflows (propose)": "carry.sh",
              "Run bump command": "bump.sh",
              "Draft changelog": "changelog.sh",
              "Resolve version": "version.sh",
              "Cut release branch": "cut.sh",
          }
          steps = yaml.safe_load(open(sys.argv[1]))["runs"]["steps"]
          found = {s["name"]: s["run"] for s in steps if s.get("name") in want}
          missing = sorted(set(want) - set(found))
          if missing:
              sys.exit(f"action.yml has no step named {missing}; this job drives them by name")
          for name, script in found.items():
              pathlib.Path(sys.argv[2], want[name]).write_text(script)
              print(f"extracted {name!r} -> {want[name]}")
          # The carry step's shipped default is part of what is under test.
          default = yaml.safe_load(open(sys.argv[1]))["inputs"]["release_workflows"]["default"]
          pathlib.Path(sys.argv[2], "release_workflows.default").write_text(default)
          PY
          cat > "$SH/helpers.sh" <<'SH'
          # Run the guard the way the action's step does.
          guard() { # <version> [base_commit] [ref_name]
            : > "$OUT"
            ( cd "$REPO" && env \
                GH_TOKEN=fake \
                GITHUB_REPOSITORY=megaeth-labs/fake \
                GITHUB_REF_NAME="${3:-main}" \
                GITHUB_OUTPUT="$OUT" \
                VERSION="$1" \
                PREFIX=release-v \
                BASE_COMMIT="${2:-}" \
                TOOLS="$TOOLS" \
                bash "$SH/guard.sh" )
          }

          expect_output() { # <exact line the step should have written>
            grep -qxF "$1" "$OUT" || { echo "no '$1' in the step output:"; cat "$OUT"; exit 1; }
          }

          refuse() { # <version> <base_commit> <message fragment> [ref_name]
            local log="$RUNNER_TEMP/refused.log"
            if guard "$1" "$2" "${4:-main}" > "$log" 2>&1; then
              echo "expected a refusal for version=$1 base=$2"; cat "$log"; exit 1
            fi
            grep -qF "$3" "$log" || { echo "refused, but not for '$3':"; cat "$log"; exit 1; }
          }
          SH

      - name: A fake gh
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/gh" <<'SH'
          #!/usr/bin/env bash
          # Only what the shell under test calls: the default branch, and
          # creating a ref, which here is a push into the throwaway remote.
          set -euo pipefail
          case "${1:-}" in
            repo)
              echo "main"
              ;;
            api)
              # A pull request read: the fixture the case wrote for that number.
              if [[ "${2:-}" == repos/*/pulls/* ]]; then
                cat "$RUNNER_TEMP/pr/${2##*/}.json"
                exit 0
              fi
              ref=""; sha=""
              while [[ $# -gt 0 ]]; do
                if [[ "$1" == "-f" ]]; then
                  case "${2:-}" in
                    ref=*) ref="${2#ref=}" ;;
                    sha=*) sha="${2#sha=}" ;;
                  esac
                  shift 2 || break
                else
                  shift
                fi
              done
              if [[ -n "$ref" && -n "$sha" ]]; then
                git push --quiet origin "$sha:$ref"
              fi
              ;;
          esac
          SH
          chmod +x "$RUNNER_TEMP/bin/gh"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: A repository shaped like a settled release line
        run: |
          set -euo pipefail
          git config --global user.name tester
          git config --global user.email tester@example.invalid
          git config --global init.defaultBranch main
          git init --quiet --bare "$REPO.git"
          git clone --quiet "$REPO.git" "$REPO" 2>/dev/null
          cd "$REPO"
          echo 1.0.0 > VERSION
          printf '# Changelog\n\n## v1.0.0 (2024-01-01)\n\n- shipped in 1.0.0\n' > CHANGELOG.md
          git add -A && git commit --quiet -m "feat: the first release"
          git commit --quiet --allow-empty -m "feat: two"
          git commit --quiet --allow-empty -m "fix: three"
          git rev-parse HEAD > "$RUNNER_TEMP/base"
          git commit --quiet --allow-empty -m "feat: not shipping this"
          git commit --quiet --allow-empty -m "feat: nor this"
          git push --quiet -u origin main
          # v1.0.0 sits on its own release branch, off trunk, exactly where
          # settlement leaves it.
          git checkout --quiet -b release-v1.0.0 "$(git rev-list --max-parents=0 HEAD)"
          git commit --quiet --allow-empty -m "chore(release): settle v1.0.0"
          git tag -a v1.0.0 -m v1.0.0
          git push --quiet origin release-v1.0.0 --tags
          git checkout --quiet main
          git branch --quiet -D release-v1.0.0
          # A commit the default branch cannot reach.
          git checkout --quiet -b side
          git commit --quiet --allow-empty -m "feat: never reviewed"
          git rev-parse HEAD > "$RUNNER_TEMP/unreachable"
          git checkout --quiet main
          echo "base commit $(cat "$RUNNER_TEMP/base")"

      - name: The trunk-first path is unchanged
        run: |
          set -euo pipefail
          source "$SH/helpers.sh"
          guard 1.1.0
          expect_output "base="
          expect_output "branch=release-v1.1.0"
          echo "no base commit still means the default-branch flow"

      - name: An explicit commit resolves, however it was written
        run: |
          set -euo pipefail
          source "$SH/helpers.sh"
          base="$(cat "$RUNNER_TEMP/base")"
          guard 1.1.0 "$base"
          expect_output "base=$base"
          guard 1.1.0 "origin/main~2"
          expect_output "base=$base"
          echo "a full SHA and a relative ref both resolve to $base"

      - name: A commit the default branch cannot reach is refused
        run: |
          set -euo pipefail
          source "$SH/helpers.sh"
          refuse 1.1.0 "$(cat "$RUNNER_TEMP/unreachable")" "not reachable from the default branch"
          refuse 1.1.0 0000000000000000000000000000000000000000 "is not a commit in this checkout"
          echo "an off-trunk commit and nonsense are refused"

      - name: The latest release tag is an allowed base
        run: |
          set -euo pipefail
          source "$SH/helpers.sh"
          latest="$(git -C "$REPO" rev-parse 'v1.0.0^{commit}')"
          guard 1.1.0 v1.0.0
          expect_output "base=$latest"
          guard 1.1.0 "$latest"
          expect_output "base=$latest"
          echo "a hotfix of the current tag starts from that tag"

      - name: The rules that were already there still apply
        run: |
          set -euo pipefail
          source "$SH/helpers.sh"
          refuse 1.1.0 "" "release candidates start from the default branch" some-branch
          refuse 1.1.0 "$(cat "$RUNNER_TEMP/base")" "release candidates start from the default branch" some-branch
          refuse 0.9.0 "" "is not newer than the latest tag"
          refuse 0.9.0 "$(cat "$RUNNER_TEMP/base")" "is not newer than the latest tag"
          echo "the default-branch and version rules come first, with or without a base commit"

      - name: The release branch is cut at the commit, and the notes stop there
        run: |
          set -euo pipefail
          source "$SH/helpers.sh"
          base="$(cat "$RUNNER_TEMP/base")"
          guard 1.1.0 "$base"
          : > "$OUT"
          ( cd "$REPO" && env \
              GH_TOKEN=fake \
              GITHUB_REPOSITORY=megaeth-labs/fake \
              GITHUB_OUTPUT="$OUT" \
              BRANCH=release-v1.1.0 \
              BASE="$base" \
              bash "$SH/cut-branch.sh" )
          expect_output "release_branch=release-v1.1.0"
          [[ "$(git -C "$REPO" rev-parse HEAD)" == "$base" ]] \
            || { echo "HEAD is not the base commit"; exit 1; }
          [[ "$(git -C "$REPO" symbolic-ref --short HEAD)" == "release-v1.1.0" ]] \
            || { echo "the job is not on the release branch"; exit 1; }
          [[ "$(git -C "$REPO" ls-remote --heads origin refs/heads/release-v1.1.0 | cut -f1)" == "$base" ]] \
            || { echo "the remote branch is not at the base commit"; exit 1; }
          # The changelog step itself is untouched by this change; run it to
          # prove the entry covers what ships, not what is on the trunk tip.
          ( cd "$REPO" && env \
              VERSION=1.1.0 \
              CHANGELOG=CHANGELOG.md \
              GITHUB_REPOSITORY=megaeth-labs/fake \
              GITHUB_OUTPUT="$OUT" \
              TOOLS="$TOOLS" \
              bash "$SH/changelog.sh" )
          entry="$(sed -n '/^## v1.1.0/,/^## v1.0.0/p' "$REPO/CHANGELOG.md")"
          echo "$entry"
          grep -q '^- two' <<< "$entry" || { echo "a commit that ships is missing"; exit 1; }
          grep -q '^- three' <<< "$entry" || { echo "a commit that ships is missing"; exit 1; }
          ! grep -q 'not shipping' <<< "$entry" || { echo "a commit past the base is in the entry"; exit 1; }
          echo "release-v1.1.0 cut at $base, notes stop there"

      - name: A re-dispatch reuses its own branch, and nothing else
        run: |
          set -euo pipefail
          source "$SH/helpers.sh"
          base="$(cat "$RUNNER_TEMP/base")"
          guard 1.1.0 "$base"
          expect_output "base=$base"
          expect_output "checkout=$base"
          refuse 1.1.0 "origin/main~1" "already exists"
          refuse 1.1.0 "" "already exists"
          echo "the same commit is reused; a different one, and the trunk flow, are refused"

      - name: A hotfix branch that already moved is reused at its tip
        run: |
          set -euo pipefail
          source "$SH/helpers.sh"
          base="$(cat "$RUNNER_TEMP/base")"
          git -C "$REPO" checkout --quiet release-v1.1.0
          git -C "$REPO" commit --quiet --allow-empty -m "fix: already on the release branch"
          git -C "$REPO" push --quiet origin release-v1.1.0
          tip="$(git -C "$REPO" rev-parse HEAD)"
          git -C "$REPO" checkout --quiet main
          guard 1.1.0 "$base"
          expect_output "base=$base"
          expect_output "checkout=$tip"
          : > "$OUT"
          ( cd "$REPO" && env \
              GH_TOKEN=fake \
              GITHUB_REPOSITORY=megaeth-labs/fake \
              GITHUB_OUTPUT="$OUT" \
              BRANCH=release-v1.1.0 \
              BASE="$base" \
              CHECKOUT="$tip" \
              bash "$SH/cut-branch.sh" )
          expect_output "release_branch=release-v1.1.0"
          [[ "$(git -C "$REPO" rev-parse HEAD)" == "$tip" ]] \
            || { echo "HEAD was reset to the base commit, dropping hotfix commits"; exit 1; }
          echo "propose sits on $tip, not $base"

      # Workflows run from the pushed ref's tree, so a release branch cut at an
      # older base commit must be given the default branch's release workflows
      # in the candidate commit. The fixture's base tree is pre-migration: an old
      # release-settle.yml, a release-publish.yml and an on-release.yml whose
      # dist-docs job writes with a Maxwell token and commits as Maxwell. (The
      # fixtures use literal secret names, not expressions: this script is
      # itself a workflow, and `${{ }}` in it would be expanded.)
      - name: The release workflows are carried onto a base_commit candidate
        run: |
          set -euo pipefail
          CREPO="$RUNNER_TEMP/carry"
          LINT="$GITHUB_WORKSPACE/.github/scripts/app_token_lint.py"
          wf=.github/workflows
          TOKEN_ACTION=actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
          git init --quiet --bare "$CREPO.git"
          git clone --quiet "$CREPO.git" "$CREPO" 2>/dev/null
          cd "$CREPO"
          mkdir -p "$wf"
          echo 1.0.0 > VERSION
          cat > "$wf/release-settle.yml" <<YML
          name: release-settle
          on:
            workflow_dispatch:
          jobs:
            settle:
              runs-on: ubuntu-24.04
              steps:
                - uses: $TOKEN_ACTION # v3
                  id: token
                  with:
                    client-id: MEGA_MAXWELL_CLIENT_ID
                    private-key: MEGA_MAXWELL_PK
                    permission-contents: write
                - uses: megaeth-labs/.github/.github/actions/release-settle@main
                  with:
                    token: from-the-step
          YML
          cat > "$wf/on-release.yml" <<YML
          name: on-release
          on:
            release:
              types: [published]
          jobs:
            dist-docs:
              runs-on: ubuntu-24.04
              steps:
                - uses: $TOKEN_ACTION # v3
                  id: token
                  with:
                    client-id: MEGA_MAXWELL_CLIENT_ID
                    private-key: MEGA_MAXWELL_PK
                    repositories: dist-docs
                    permission-contents: write
                - run: |
                    git config user.name "mega-maxwell[bot]"
                    git config user.email "290560214+mega-maxwell[bot]@users.noreply.github.com"
          YML
          printf 'name: release-publish\non: workflow_dispatch\njobs:\n  publish:\n    runs-on: ubuntu-24.04\n    steps:\n      - run: echo old publish\n' > "$wf/release-publish.yml"
          printf 'name: daily-audit\non: workflow_dispatch\njobs:\n  audit:\n    runs-on: ubuntu-24.04\n    steps:\n      - run: echo audit\n' > "$wf/daily-audit.yml"
          git add -A && git commit --quiet -m "feat: pre-migration release workflows"
          git rev-parse HEAD > "$RUNNER_TEMP/carry-base"
          # The default branch has moved on: migrated workflows, no release-publish.
          cat > "$wf/release-settle.yml" <<YML
          name: release-settle
          on:
            workflow_dispatch:
          jobs:
            settle:
              runs-on: ubuntu-24.04
              environment: release
              steps:
                - uses: $TOKEN_ACTION # v3
                  id: release-token
                  with:
                    client-id: RELEASE_APP_CLIENT_ID
                    private-key: RELEASE_APP_PRIVATE_KEY
                    permission-contents: write
                - uses: megaeth-labs/.github/.github/actions/release-settle@main
                  with:
                    token: from-the-step
          YML
          cat > "$wf/on-release.yml" <<YML
          name: on-release
          on:
            release:
              types: [published]
          jobs:
            dist-docs:
              runs-on: ubuntu-24.04
              environment: release
              steps:
                - uses: $TOKEN_ACTION # v3
                  id: release-token
                  with:
                    client-id: RELEASE_APP_CLIENT_ID
                    private-key: RELEASE_APP_PRIVATE_KEY
                    repositories: dist-docs
                    permission-contents: write
                - run: |
                    git config user.name "mega-gutenberg[bot]"
                    git config user.email "348780249+mega-gutenberg[bot]@users.noreply.github.com"
          YML
          git rm --quiet "$wf/release-publish.yml"
          git add -A && git commit --quiet -m "feat: migrate the release workflows"
          git push --quiet -u origin main
          base="$(cat "$RUNNER_TEMP/carry-base")"

          # Stale state: the base tree really is pre-migration, and the lint says so.
          mkdir -p "$RUNNER_TEMP/carry-base-tree" "$RUNNER_TEMP/carry-candidate-tree"
          git archive "$base" "$wf" | tar -x -C "$RUNNER_TEMP/carry-base-tree"
          [[ -f "$RUNNER_TEMP/carry-base-tree/$wf/release-publish.yml" ]] \
            || { echo "the base tree has no release-publish.yml"; exit 1; }
          rc=0
          python3 "$LINT" --repo fake "$RUNNER_TEMP/carry-base-tree/$wf/release-settle.yml" \
            "$RUNNER_TEMP/carry-base-tree/$wf/on-release.yml" > "$RUNNER_TEMP/lint-base.log" 2>&1 || rc=$?
          [[ "$rc" -eq 1 ]] || { echo "the lint exits $rc on the base tree, not 1"; cat "$RUNNER_TEMP/lint-base.log"; exit 1; }

          # Propose: cut the branch at the base, carry the workflows. The
          # checkout is dirty (an untracked file) the way a real job's is.
          : > "$OUT"
          env GH_TOKEN=fake GITHUB_REPOSITORY=megaeth-labs/fake GITHUB_OUTPUT="$OUT" \
            BRANCH=release-v1.1.0 BASE="$base" bash "$SH/cut-branch.sh"
          echo scratch > scratch.txt
          env GH_TOKEN=fake GITHUB_REPOSITORY=megaeth-labs/fake \
            RELEASE_WORKFLOWS="$(cat "$SH/release_workflows.default")" bash "$SH/carry.sh" \
            | tee "$RUNNER_TEMP/carry.log"
          git add "$wf" && git commit --quiet -m "chore(release): candidate v1.1.0"
          candidate="$(git rev-parse HEAD)"

          # The candidate commit's tree, not the log, is the evidence.
          for f in release-settle.yml on-release.yml; do
            git show "$candidate:$wf/$f" > "$RUNNER_TEMP/got"
            git show "origin/main:$wf/$f" > "$RUNNER_TEMP/want"
            cmp "$RUNNER_TEMP/got" "$RUNNER_TEMP/want" \
              || { echo "$f is not the default branch's, byte for byte"; exit 1; }
          done
          if git cat-file -e "$candidate:$wf/release-publish.yml" 2>/dev/null; then
            echo "release-publish.yml is still in the candidate tree"; exit 1
          fi
          [[ "$(git diff --name-only "$base" "$candidate" | sort | tr '\n' ' ')" \
              == "$wf/on-release.yml $wf/release-publish.yml $wf/release-settle.yml " ]] \
            || { echo "the candidate changed more than the release workflows:"; git diff --name-only "$base" "$candidate"; exit 1; }
          [[ "$(git status --porcelain)" == "?? scratch.txt" ]] \
            || { echo "the carry touched the rest of the checkout:"; git status --porcelain; exit 1; }
          git archive "$candidate" "$wf" | tar -x -C "$RUNNER_TEMP/carry-candidate-tree"
          python3 "$LINT" --repo fake "$RUNNER_TEMP/carry-candidate-tree/$wf/release-settle.yml" \
            "$RUNNER_TEMP/carry-candidate-tree/$wf/on-release.yml"
          [[ "$(git ls-remote --heads origin refs/heads/release-v1.1.0 | cut -f1)" == "$base" ]] \
            || { echo "the release branch is not at the base commit"; exit 1; }

          # Re-running the carry on the candidate changes nothing; an absent
          # path is skipped, not an error.
          env GH_TOKEN=fake GITHUB_REPOSITORY=megaeth-labs/fake \
            RELEASE_WORKFLOWS="$(cat "$SH/release_workflows.default")"$'\n'"$wf/not-there.yml" \
            bash "$SH/carry.sh" | tee "$RUNNER_TEMP/carry2.log"
          grep -qF "skipped $wf/not-there.yml" "$RUNNER_TEMP/carry2.log" \
            || { echo "an absent path was not reported as skipped"; exit 1; }
          [[ "$(git status --porcelain)" == "?? scratch.txt" ]] \
            || { echo "a second carry changed the tree"; git status --porcelain; exit 1; }
          echo "candidate $candidate carries the default branch's release workflows"

      - name: The bump command never runs with the release token
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/carry"
          marker="$RUNNER_TEMP/bump-ran"
          rm -f "$marker"
          bump() { # <dependency token>
            env GITHUB_AUTH_TOKEN="$1" DEPENDENCY_TOKEN="$1" GH_TOKEN=fake \
              OLD_VERSION=0.9.0 NEW_VERSION=1.0.0 BUMP_COMMAND="touch '$marker'" \
              FILE=VERSION PATTERN=plain TOOLS="$TOOLS" bash "$SH/bump.sh"
          }
          if bump "" > "$RUNNER_TEMP/bump.log" 2>&1; then
            echo "the bump command ran without a dependency token"; cat "$RUNNER_TEMP/bump.log"; exit 1
          fi
          grep -qF "bump_command needs a separate dependency_token" "$RUNNER_TEMP/bump.log" \
            || { echo "refused, but not for the missing dependency token:"; cat "$RUNNER_TEMP/bump.log"; exit 1; }
          [[ ! -e "$marker" ]] || { echo "the bump command ran before the refusal"; exit 1; }
          bump dependency-token
          [[ -e "$marker" ]] || { echo "the bump command did not run with a dependency token"; exit 1; }
          echo "refused without a dependency token, runs with one"

      # `cut` runs on the push that merged the candidate. It re-reads the PR
      # through the API (fixtures here) and trusts nothing from the event.
      - name: Cut refuses what is not a merged candidate and creates the branch for one
        run: |
          set -euo pipefail
          UP="$RUNNER_TEMP/cut"
          git init --quiet --bare "$UP.git"
          git clone --quiet "$UP.git" "$UP" 2>/dev/null
          cd "$UP"
          echo 1.0.0 > VERSION
          git add -A && git commit --quiet -m "feat: first"
          echo 1.3.0 > VERSION
          git add -A && git commit --quiet -m "chore(release): candidate v1.3.0 (#7)"
          git push --quiet -u origin main
          merge="$(git rev-parse HEAD)"
          earlier="$(git rev-parse HEAD~1)"
          mkdir -p "$RUNNER_TEMP/pr"
          pr() { # <number> <merged_at|null> <merge sha> <head ref> <base ref> <author>
            python3 - "$@" "$RUNNER_TEMP/pr" <<'PY'
          import json, sys
          number, merged_at, sha, head, base, login, out = sys.argv[1:]
          doc = {
              "number": int(number),
              "merged_at": None if merged_at == "null" else merged_at,
              "merge_commit_sha": sha,
              "head": {"ref": head},
              "base": {"ref": base},
              "user": {"login": login},
          }
          json.dump(doc, open(f"{out}/{number}.json", "w"))
          PY
          }
          run_cut() { # <pr number> <commit>
            : > "$OUT"
            ( cd "$UP" && env \
                GH_TOKEN=fake \
                GITHUB_REPOSITORY=megaeth-labs/fake \
                GITHUB_OUTPUT="$OUT" \
                VERSION=1.3.0 \
                PREFIX=release-v \
                FILE=VERSION \
                PATTERN=plain \
                COMMIT="$2" \
                PR_NUMBER="$1" \
                EXPECTED_AUTHOR='mega-gutenberg[bot]' \
                TOOLS="$TOOLS" \
                bash "$SH/cut.sh" ) > "$RUNNER_TEMP/cut.log" 2>&1
          }
          branch_at() { git -C "$UP" ls-remote --heads origin refs/heads/release-v1.3.0 | cut -f1; }
          refuse_cut() { # <pr number> <commit> <message fragment>
            if run_cut "$1" "$2"; then
              echo "expected a refusal for PR $1"; cat "$RUNNER_TEMP/cut.log"; exit 1
            fi
            grep -qF "$3" "$RUNNER_TEMP/cut.log" \
              || { echo "PR $1 refused, but not for '$3':"; cat "$RUNNER_TEMP/cut.log"; exit 1; }
            [[ -z "$(branch_at)" ]] || { echo "a refused cut still created release-v1.3.0"; exit 1; }
          }
          candidate=chore/release-candidate-1.3.0
          merged=2026-01-01T00:00:00Z
          bot='mega-gutenberg[bot]'
          pr 12 "$merged" "$merge" "$candidate" main 'mega-maxwell[bot]'
          pr 13 null "$merge" "$candidate" main "$bot"
          pr 14 "$merged" "$earlier" "$candidate" main "$bot"
          pr 15 "$merged" "$merge" "$candidate" release-v1.2.0 "$bot"
          pr 16 "$merged" "$merge" feature/x main "$bot"
          pr 17 "$merged" "$earlier" "$candidate" main "$bot"
          refuse_cut 12 "$merge" "not by 'mega-gutenberg[bot]'"
          refuse_cut 13 "$merge" "has not been merged"
          refuse_cut 14 "$merge" "not the pushed commit"
          refuse_cut 15 "$merge" "not the default branch 'main'"
          refuse_cut 16 "$merge" "is not a chore/release-candidate-* branch"
          refuse_cut 17 "$earlier" "says 1.0.0, expected 1.3.0"
          refuse_cut "" "$merge" "cut needs the commit and pr_number inputs"
          refuse_cut 11 "" "cut needs the commit and pr_number inputs"

          # The version comes from the PR's head ref, read through the API.
          pr 11 "$merged" "$merge" "$candidate" main "$bot"
          : > "$OUT"
          env STAGE=cut PR_NUMBER=11 INPUT_VERSION= GH_TOKEN=fake GITHUB_REPOSITORY=megaeth-labs/fake \
            GITHUB_OUTPUT="$OUT" TOOLS="$TOOLS" bash "$SH/version.sh"
          expect_out() { grep -qxF "$1" "$OUT" || { echo "no '$1' in the step output:"; cat "$OUT"; exit 1; }; }
          expect_out "version=1.3.0"

          run_cut 11 "$merge" || { cat "$RUNNER_TEMP/cut.log"; exit 1; }
          expect_out "release_branch=release-v1.3.0"
          [[ "$(branch_at)" == "$merge" ]] \
            || { echo "release-v1.3.0 is not at the merge commit: '$(branch_at)'"; exit 1; }
          echo "release-v1.3.0 created at $merge"

          # Stale state: the branch is there now, and a second cut is refused
          # without moving it.
          if run_cut 11 "$merge"; then
            echo "a second cut succeeded"; cat "$RUNNER_TEMP/cut.log"; exit 1
          fi
          grep -qF "branch release-v1.3.0 already exists" "$RUNNER_TEMP/cut.log" \
            || { echo "refused, but not because the branch exists:"; cat "$RUNNER_TEMP/cut.log"; exit 1; }
          [[ "$(branch_at)" == "$merge" ]] || { echo "the existing branch moved"; exit 1; }
          echo "cut creates the branch for a merged gutenberg candidate and refuses the rest"

  # release-publish re-verifies the merged settle PR through the API and tags
  # the pushed commit. The three steps that do it are extracted by name and run
  # against a throwaway bare remote, a fake gh that answers from fixtures and
  # records what it was asked to create, and fixtures for each refusal.
  release-publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    env:
      TOOLS: ${{ github.workspace }}/.github/actions/release-tools/release_tools.py
      ACTION: ${{ github.workspace }}/.github/actions/release-publish/action.yml
      AUTH_WRAPPER: ${{ github.workspace }}/.github/actions/git-auth/with-github-auth.sh
      GITHUB_AUTH_TOKEN: fixture-token
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # `runner` is not a context a job-level `env:` may read, so the paths
      # the steps below share are set here instead.
      - name: Where the rehearsal lives
        run: |
          set -euo pipefail
          {
            echo "REPO=$RUNNER_TEMP/repo"
            echo "SH=$RUNNER_TEMP/sh"
            echo "OUT=$RUNNER_TEMP/step-output"
            echo "FIX=$RUNNER_TEMP/fixtures"
            echo "ARGS=$RUNNER_TEMP/fixtures/release-create-args"
            echo "RELEASES=$RUNNER_TEMP/fixtures/releases"
          } >> "$GITHUB_ENV"

      - name: The shell under test, taken from the action
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          mkdir -p "$SH"
          python3 - "$ACTION" "$SH" <<'PY'
          import pathlib, sys, yaml

          want = {
              "Guard": "guard.sh",
              "Create and push tag": "tag.sh",
              "Publish GitHub Release": "release.sh",
          }
          steps = yaml.safe_load(open(sys.argv[1]))["runs"]["steps"]
          found = {s["name"]: s["run"] for s in steps if s.get("name") in want}
          missing = sorted(set(want) - set(found))
          if missing:
              sys.exit(f"action.yml has no step named {missing}; this job drives them by name")
          # The job below skips the tag step by this condition; if the action's
          # changes, the rehearsal would no longer be rehearsing it.
          cond = next(s for s in steps if s.get("name") == "Create and push tag").get("if")
          if cond != "steps.guard.outputs.tag_exists != 'true'":
              sys.exit(f"the tag step's condition is {cond!r}; update this job to match")
          for name, script in found.items():
              pathlib.Path(sys.argv[2], want[name]).write_text(script)
              print(f"extracted {name!r} -> {want[name]}")
          PY
          cat > "$SH/helpers.sh" <<'SH'
          out_get() { grep -m1 "^$1=" "$OUT" | cut -d= -f2-; }

          expect_output() { # <exact line the guard should have written>
            grep -qxF "$1" "$OUT" || { echo "no '$1' in the guard output:"; cat "$OUT"; exit 1; }
          }

          # The three steps, the way the action's steps run them.
          guard() { # <pr> [expected author]
            : > "$OUT"
            ( cd "$REPO" && env \
                GH_TOKEN=fake \
                GITHUB_REPOSITORY=megaeth-labs/fake \
                GITHUB_OUTPUT="$OUT" \
                MERGE_SHA="$(cat "$FIX/merge-$1")" \
                PR_NUMBER="$1" \
                EXPECTED_AUTHOR="${2-mega-gutenberg[bot]}" \
                PREFIX=release-v \
                FILE=VERSION \
                PATTERN=plain \
                CHANGELOG=CHANGELOG.md \
                bash "$SH/guard.sh" )
          }

          tag_step() {
            ( cd "$REPO" && env \
                TAG="$(out_get tag)" \
                MERGE_SHA="$(out_get merge_sha)" \
                bash "$SH/tag.sh" ) || return 1
            touch "$FIX/tag-ran"
          }

          release_step() {
            ( cd "$REPO" && env \
                GH_TOKEN=fake \
                TAG="$(out_get tag)" \
                NOTES="$(out_get notes_file)" \
                GITHUB_OUTPUT="$OUT.release" \
                bash "$SH/release.sh" )
          }

          # The action's step list: the tag step runs unless the guard says the
          # tag is already at the commit.
          publish() { # <pr> [expected author]
            rm -f "$FIX/tag-ran"
            guard "$@" || return 1
            if [[ "$(out_get tag_exists)" != true ]]; then
              tag_step || return 1
            fi
            release_step
          }

          refuse() { # <pr> <message fragment> [expected author]
            local log="$RUNNER_TEMP/refused.log"
            if publish "$1" "${3-mega-gutenberg[bot]}" > "$log" 2>&1; then
              echo "expected a refusal for PR $1"; cat "$log"; exit 1
            fi
            grep -qF "$2" "$log" || { echo "refused, but not for '$2':"; cat "$log"; exit 1; }
            [[ ! -e "$FIX/tag-ran" ]] || { echo "a refused publish still ran the tag step"; exit 1; }
          }

          # What the remote says, not what the logs say.
          remote_commit() { # <tag> -> commit an annotated remote tag points at, or nothing
            git ls-remote "$REPO.git" "refs/tags/$1^{}" | cut -f1
          }
          remote_tag_object() { # <tag>
            git ls-remote "$REPO.git" "refs/tags/$1" | cut -f1
          }
          seed_tag() { # <tag> <sha>: an annotated tag already on the remote
            git -C "$REPO" tag -a "$1" "$2" -m seed
            git -C "$REPO" push --quiet origin "refs/tags/$1"
            git -C "$REPO" tag -d "$1" > /dev/null
          }

          # A release branch: the settled commit, optionally a late commit on
          # top (LATE=1), then the settle PR's merge commit. The PR fixture
          # describes it; O_* variables bend one field of that fixture.
          settle() { # <version> <pr>
            local v="$1" pr="$2"
            git -C "$REPO" checkout --quiet -B "release-v$v" "$(cat "$FIX/root")"
            (
              cd "$REPO"
              echo "${WRONG_FILE:-$v}" > VERSION
              printf '# Changelog\n\n## v%s (2024-02-01)\n\n- shipped in %s\n\n## v1.0.0 (2024-01-01)\n\n- shipped in 1.0.0\n' "$v" "$v" > CHANGELOG.md
              git add -A && git commit --quiet -m "chore(release): changelog for v$v"
              git rev-parse HEAD > "$FIX/settled-$pr"
              if [[ "${LATE:-}" == 1 ]]; then
                git commit --quiet --allow-empty -m "fix: landed after the settle PR opened"
              fi
              git commit --quiet --allow-empty -m "Merge settle PR #$pr"
              git rev-parse HEAD > "$FIX/merge-$pr"
              git push --quiet --force origin "release-v$v"
              git checkout --quiet main
            )
            write_pr "$pr" "$v"
          }

          write_pr() { # <pr> <version>
            python3 - "$FIX" "$1" "$2" <<'PY'
          import json, os, pathlib, sys

          fix, pr, v = pathlib.Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          env = os.environ.get
          settled = env("O_SETTLED") or (fix / f"settled-{pr}").read_text().strip()
          merge = env("O_MERGE_SHA") or (fix / f"merge-{pr}").read_text().strip()
          body = f"Settle v{v}."
          if env("O_MARKER") != "none":
              body += f"\n\n<!-- release-settle: v{v} {settled} -->\n"
          doc = {
              "merged_at": None if env("O_UNMERGED") else "2024-02-02T00:00:00Z",
              "merge_commit_sha": merge,
              "head": {"ref": env("O_HEAD") or f"chore/release-settle-v{v}"},
              "base": {"ref": env("O_BASE") or f"release-v{v}"},
              "user": {"login": env("O_USER") or "mega-gutenberg[bot]"},
              "body": body,
          }
          (fix / f"pr-{pr}.json").write_text(json.dumps(doc))
          PY
          }
          SH

      - name: A fake gh
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" "$FIX"
          : > "$ARGS"
          : > "$RELEASES"
          cat > "$RUNNER_TEMP/bin/gh" <<'SH'
          #!/usr/bin/env bash
          # Only what the shell under test calls. The pull request comes from a
          # fixture; a Release exists once `release create` has been asked for
          # it, and what it was asked is recorded for the assertions.
          set -euo pipefail
          if [[ "${1:-}" == api && "${2:-}" == repos/*/pulls/* ]]; then
            f="$FIX/pr-${2##*/}.json"
            [[ -f "$f" ]] || { echo "gh: no fixture $f" >&2; exit 1; }
            cat "$f"
            exit 0
          fi
          if [[ "${1:-}" == release && "${2:-}" == view ]]; then
            grep -qxF "${3:-}" "$RELEASES" && exit 0
            echo "release not found" >&2
            exit 1
          fi
          if [[ "${1:-}" == release && "${2:-}" == create ]]; then
            if [[ -e "$FIX/fail-create" ]]; then
              echo "gh: release create failed (injected)" >&2
              exit 1
            fi
            notes=""
            args=("$@")
            for ((i = 0; i < ${#args[@]}; i++)); do
              if [[ "${args[i]}" == --notes-file ]]; then notes="${args[i + 1]}"; fi
            done
            [[ -s "$notes" ]] || { echo "gh: --notes-file '$notes' is missing or empty" >&2; exit 1; }
            echo "$*" >> "$ARGS"
            echo "$3" >> "$RELEASES"
            echo "https://github.com/megaeth-labs/fake/releases/tag/$3"
            exit 0
          fi
          echo "gh: unexpected call: $*" >&2
          exit 99
          SH
          chmod +x "$RUNNER_TEMP/bin/gh"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: A repository shaped like a trunk with a release line to cut
        run: |
          set -euo pipefail
          git init --quiet --bare -b main "$REPO.git"
          git clone --quiet "$REPO.git" "$REPO" 2>/dev/null
          cd "$REPO"
          # Local config only: the steps under test run with the global and
          # system config blanked, as they do in the action.
          git config user.name tester
          git config user.email tester@example.invalid
          git config commit.gpgsign false
          git config tag.gpgsign false
          echo 1.0.0 > VERSION
          printf '# Changelog\n\n## v1.0.0 (2024-01-01)\n\n- shipped in 1.0.0\n' > CHANGELOG.md
          git add -A && git commit --quiet -m "feat: the first release"
          git push --quiet -u origin main
          git rev-parse HEAD > "$FIX/root"

      - name: A settled release is tagged at its merge commit and published
        run: |
          set -euo pipefail
          source "$SH/helpers.sh"
          settle 1.2.0 101
          publish 101
          merge="$(cat "$FIX/merge-101")"
          expect_output "version=1.2.0"
          expect_output "tag=v1.2.0"
          expect_output "tag_exists=false"
          [[ -e "$FIX/tag-ran" ]] || { echo "the tag step did not run"; exit 1; }
          [[ "$(git --git-dir="$REPO.git" cat-file -t refs/tags/v1.2.0)" == tag ]] \
            || { echo "v1.2.0 is not an annotated tag"; exit 1; }
          [[ "$(remote_commit v1.2.0)" == "$merge" ]] \
            || { echo "v1.2.0 does not point at the merge commit $merge"; exit 1; }
          git --git-dir="$REPO.git" cat-file -p refs/tags/v1.2.0 | grep -qxF "Release v1.2.0" \
            || { echo "the tag annotation changed"; exit 1; }
          grep -qF "release create v1.2.0 --verify-tag --latest --title v1.2.0 --notes-file " "$ARGS" \
            || { echo "the Release was not created for v1.2.0:"; cat "$ARGS"; exit 1; }
          grep -qx "v1.2.0" "$RELEASES" || { echo "no Release v1.2.0"; exit 1; }
          grep -qxF -- "- shipped in 1.2.0" "$RUNNER_TEMP/release-notes-v1.2.0.md" \
            || { echo "the notes are not the changelog section"; exit 1; }
          echo "v1.2.0 is an annotated tag at $merge and the Release was asked for with --verify-tag"

      - name: A published release is not published twice
        run: |
          set -euo pipefail
          source "$SH/helpers.sh"
          before="$(remote_tag_object v1.2.0)"
          refuse 101 "a release is published once"
          [[ "$(remote_tag_object v1.2.0)" == "$before" ]] || { echo "the tag moved"; exit 1; }
          [[ "$(grep -c 'release create v1.2.0 ' "$ARGS")" == 1 ]] || { echo "a second Release was created"; exit 1; }
          echo "tag and Release both existing is refused, and nothing changed"

      - name: A run that died after the tag is resumed, not refused
        run: |
          set -euo pipefail
          source "$SH/helpers.sh"
          settle 1.3.0 102
          merge="$(cat "$FIX/merge-102")"
          # The Release call fails once: the tag is pushed, no Release exists.
          : > "$FIX/fail-create"
          if publish 102 > "$RUNNER_TEMP/first-run.log" 2>&1; then
            echo "the first run should have failed at the Release"; exit 1
          fi
          rm "$FIX/fail-create"
          [[ "$(remote_commit v1.3.0)" == "$merge" ]] \
            || { echo "the interrupted run left no tag at the merge commit"; exit 1; }
          ! grep -qx "v1.3.0" "$RELEASES" || { echo "a Release exists after the failed run"; exit 1; }
          object="$(remote_tag_object v1.3.0)"
          # Re-run: the tag is already there, so the tag step is skipped.
          publish 102
          expect_output "tag=v1.3.0"
          expect_output "tag_exists=true"
          [[ ! -e "$FIX/tag-ran" ]] || { echo "the tag step ran again"; exit 1; }
          [[ "$(remote_tag_object v1.3.0)" == "$object" ]] || { echo "the tag was rewritten"; exit 1; }
          grep -qF "release create v1.3.0 --verify-tag --latest --title v1.3.0 --notes-file " "$ARGS" \
            || { echo "the Release was not created with the guard's tag:"; cat "$ARGS"; exit 1; }
          grep -qx "v1.3.0" "$RELEASES" || { echo "no Release v1.3.0"; exit 1; }
          echo "v1.3.0 resumed: tag step skipped, tag untouched, Release created"

      - name: Anything that does not describe a settled release is refused
        run: |
          set -euo pipefail
          source "$SH/helpers.sh"

          settle 1.4.0 103
          O_USER=someone-else write_pr 103 1.4.0
          refuse 103 "was opened by 'someone-else'"

          # A commit landed after the settle PR was opened: the merge commit's
          # parent is no longer the settled one.
          LATE=1 settle 1.5.0 104
          refuse 104 "drifted"

          settle 1.6.0 105
          seed_tag v1.6.0 "$(cat "$FIX/settled-105")"
          refuse 105 "a release is published once"
          [[ "$(remote_commit v1.6.0)" == "$(cat "$FIX/settled-105")" ]] || { echo "the tag moved"; exit 1; }

          settle 1.7.0 106
          seed_tag v1.7.0 "$(cat "$FIX/merge-106")"
          echo v1.7.0 >> "$RELEASES"
          refuse 106 "a release is published once"

          WRONG_FILE=1.8.1 settle 1.8.0 107
          refuse 107 "says 1.8.1, expected 1.8.0"

          settle 1.9.0 108
          O_UNMERGED=1 write_pr 108 1.9.0
          refuse 108 "is not merged"

          settle 1.9.1 109
          O_MERGE_SHA="$(cat "$FIX/settled-109")" write_pr 109 1.9.1
          refuse 109 "not the pushed commit"

          settle 1.9.2 110
          O_MARKER=none write_pr 110 1.9.2
          refuse 110 "settle PR body has no"

          settle 1.9.3 111
          O_BASE=main write_pr 111 1.9.3
          refuse 111 "merged into 'main'"

          settle 1.9.4 112
          O_HEAD=feature/x write_pr 112 1.9.4
          refuse 112 "is not a settle PR"

          # The remote and the recorded calls, not the messages, say that
          # nothing was published: only the two good releases were created.
          for v in 1.4.0 1.5.0 1.8.0 1.9.0 1.9.1 1.9.2 1.9.3 1.9.4; do
            [[ -z "$(git ls-remote "$REPO.git" "refs/tags/v$v")" ]] \
              || { echo "v$v was tagged although it was refused"; exit 1; }
          done
          [[ "$(grep -c . "$ARGS")" == 2 ]] \
            || { echo "expected exactly the v1.2.0 and v1.3.0 Releases:"; cat "$ARGS"; exit 1; }
          echo "ten refusals, no tag, no Release"

  # The generated parts of every action README (inputs, outputs, steps,
  # errors) and the catalogue come from action.yml; stale docs fail here.
  docs:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check generated action documentation
        run: |
          python3 -m pip install --quiet pyyaml
          python3 .github/scripts/action_docs.py --check
